<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPPO Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#16202B; --muted:#5B6672; --line:#D4DAD2;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --accent-soft:#D8ECE8; --xp:#C9851C; --xp-soft:#F6E7C8;
  --good:#1F8A4C; --good-soft:#DDF1E4; --bad:#C2410C; --bad-soft:#FBE3D6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --lore-title:"Cinzel",Georgia,serif; --lore:"EB Garamond",Georgia,serif;
  --radius:14px; --wacc:#8ff0dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1519; --surface:#172027; --surface-2:#1C272F; --ink:#E6ECEA; --muted:#93A1A6; --line:#2A3840;
    --accent:#3CC2B2; --accent-ink:#06201D; --accent-soft:#16332F; --xp:#F0B44A; --xp-soft:#3A2E17;
    --good:#4ADE80; --good-soft:#15301F; --bad:#F47B55; --bad-soft:#3A1E14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1519; --surface:#172027; --surface-2:#1C272F; --ink:#E6ECEA; --muted:#93A1A6; --line:#2A3840;
  --accent:#3CC2B2; --accent-ink:#06201D; --accent-soft:#16332F; --xp:#F0B44A; --xp-soft:#3A2E17;
  --good:#4ADE80; --good-soft:#15301F; --bad:#F47B55; --bad-soft:#3A1E14;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;background:none;border:0;padding:0}
.brand span{color:var(--accent)}

.hero{padding-block:30px 6px;display:grid;gap:10px}
.hero h1{font-size:clamp(32px,6.4vw,54px);line-height:1.03;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:64ch;color:var(--muted);margin:0}
.nextup{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}.nextup h3{margin:2px 0 0;font-size:20px}.qs-d{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}.qs-d summary{cursor:pointer}.qs-d p{margin:8px 0;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.tabs{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px;background:var(--surface)}
.tabs button{border:0;background:none;padding:9px 18px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--bg)}
.map{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:780px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.map{grid-template-columns:1fr}}
.world{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:6px;align-content:start;background:var(--surface);transition:transform .15s,border-color .15s;overflow:hidden}
.world:hover{transform:translateY(-2px);border-color:var(--accent)}
.world .num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.world h3{font-size:20px;font-weight:700}
.world p{margin:0;color:var(--muted);font-size:14px}
.world.story{background:linear-gradient(160deg,var(--c1),var(--c2));border-color:transparent;color:#EDEAE2}
.world.story .num{color:var(--c3)}
.world.story h3{font-family:var(--lore-title);font-weight:700;letter-spacing:.02em;font-size:19px}
.world.story p{color:#C9C6BD;font-family:var(--lore);font-size:16px}
.world.story .done{font-family:var(--mono);font-size:12px;color:var(--c3)}
.stars{display:flex;gap:4px;margin-top:4px}
.stars i{width:16px;height:16px;display:block;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--line)}
.stars i.on{background:var(--xp)}
.world.boss{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.world.boss p,.world.boss .num{color:var(--accent-ink);opacity:.92}
.section{margin-top:30px;display:grid;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:22px}
.mastery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
@media (max-width:620px){.mastery{grid-template-columns:1fr}}
.m-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.m-name{font-weight:700;font-size:15px}
.m-pct{font-family:var(--mono);font-size:13px;color:var(--muted)}
.m-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.m-track i{display:block;height:100%;background:var(--accent)}
.powers-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:780px){.powers-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.pw b{font-family:var(--display);font-size:15px}
.pw span{font-size:13px;color:var(--muted)}
.pw i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
.grouphead{margin-top:22px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar .tabs{margin-top:18px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}

/* game */
.game{padding-block:14px;display:grid;gap:10px}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud .spacer{flex:1}
.pill{font-family:var(--mono);font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:var(--bad-soft);border-color:var(--bad)}
.hearts{display:flex;gap:4px}
.hearts i{width:14px;height:17px;display:block;background:var(--ink);clip-path:polygon(50% 0,100% 30%,85% 100%,15% 100%,0 30%)}
.hearts i.lost{background:var(--line)}
.hearts i.shield{background:var(--accent)}
.pchips{display:flex;gap:4px}
.pchips b{font-family:var(--mono);font-size:10.5px;padding:3px 6px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);font-weight:700}
.pchips b.on{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.stage{position:relative;border-radius:var(--radius);overflow:hidden;background:#05070a;border:1px solid #1d2530}
canvas{display:block;width:100%;height:auto;touch-action:none}
.dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 28px));max-height:72%;overflow:auto;background:rgba(6,8,12,.9);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:16px 20px;color:#ECE9E1;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.5)}
.dlg .dh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.dlg .dt{font-family:var(--lore-title);font-weight:700;letter-spacing:.08em;font-size:14px;color:var(--wacc);text-transform:uppercase}
.dlg .ds{font-family:var(--lore);font-style:italic;color:#A9A59B;font-size:15px}
.dlg p{margin:0;font-family:var(--lore);font-size:clamp(17px,2.2vw,20px);line-height:1.45}
.dlg p strong{color:var(--wacc);font-weight:500}
.dlg .df{margin-top:10px;font-family:var(--mono);font-size:11px;color:#8C887F;display:flex;justify-content:space-between;gap:8px}
.banner{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center;pointer-events:none;background:rgba(6,8,12,.82);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 18px;color:#ECE9E1;max-width:calc(100% - 28px);animation:bin .3s ease-out}
.banner .bt{font-family:var(--lore-title);font-weight:700;letter-spacing:.1em;font-size:13px;color:var(--wacc);text-transform:uppercase}
.banner .bs{font-family:var(--lore);font-size:17px}
@keyframes bin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width:640px){.dlg{position:static;transform:none;width:auto;max-height:none;border-radius:0 0 12px 12px;border-left:0;border-right:0;border-bottom:0}}
.pad{display:none;justify-content:space-between;gap:10px;user-select:none;-webkit-user-select:none}
.pad .grp{display:flex;gap:8px}
.pad button{min-width:58px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-weight:700;font-size:14px;touch-action:none;padding:0 12px}
.pad button.j{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (hover:none),(max-width:780px){.pad{display:flex}}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(4,6,9,.55);backdrop-filter:blur(3px)}
.qbox{width:100%;max-width:680px;max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.q-topic{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q-text{font-family:var(--display);font-size:clamp(18px,3vw,22px);font-weight:600;line-height:1.32}
.opts{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15.5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;font-weight:700;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:15px}
.explain b{font-family:var(--display)}
.explain.good{border-color:var(--good)} .explain.bad{border-color:var(--bad)}
.stakes{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}


/* realm register (night) for study + workshop */
.realm{color-scheme:dark;--surface:#172027;--surface-2:#1C272F;--ink:#E6ECEA;--muted:#93A1A6;--line:#2A3840;--accent:#3CC2B2;--accent-ink:#06201D;--accent-soft:#16332F;--good:#4ADE80;--good-soft:#15301F;--bad:#F47B55;--bad-soft:#3A1E14;--lantern:#F0B44A;
  background:radial-gradient(120% 80% at 50% 0%,#1d2a33 0%,#0d1317 70%);color:var(--ink);border-radius:var(--radius);padding:20px;display:grid;gap:14px;margin-top:16px}
.realm .btn,.realm .opt{border-color:#6B7C84}.realm .kbd,.realm .label{color:var(--muted)}
.realm h2,.realm h3{color:var(--ink)}
.mentor{font-family:var(--lore);font-style:italic;font-size:18px;line-height:1.45;color:#E9E6DE;border-left:3px solid var(--lantern,#F0B44A);padding:2px 0 2px 12px;margin:0}
.mentor b{font-family:var(--lore-title);font-style:normal;font-size:12px;letter-spacing:.12em;color:var(--lantern,#F0B44A);display:block;margin-bottom:2px}
.lmeter{height:8px;border-radius:99px;background:#0b1014;border:1px solid #2A3840;overflow:hidden}.lmeter i{display:block;height:100%;background:linear-gradient(90deg,#C9851C,#F0B44A);box-shadow:0 0 12px #F0B44A;width:0;transition:width .3s}
.purse{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid #8A948C;border-radius:999px;padding:5px 12px;font-family:var(--mono);font-size:13px;color:var(--ink)}
.purse .gem{width:10px;height:14px;background:#C9851C;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
@media (max-width:480px){.purse .pl{display:none}}
.ready{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:-4px 0 10px;font-size:14px;color:var(--muted)}
.ready b{color:var(--ink)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--surface-2);border:1.5px solid #2A3840;border-radius:12px;padding:10px;display:grid;gap:6px;text-align:left;color:var(--ink)}
.item.eq{border-color:var(--lantern,#F0B44A);box-shadow:0 0 0 1px var(--lantern,#F0B44A) inset}
.item .sw{height:26px;border-radius:8px;border:1px solid #2A3840}
.item .pr{font-family:var(--mono);font-size:13px;color:var(--muted)}
.prev{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prev canvas{width:160px;height:160px;border-radius:12px;background:radial-gradient(circle at 50% 60%,#22313b,#0b1014)}
.settings{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.game .hud .pill{border-color:var(--wacc,#8A948C)}
/* UX council pass */
.ico{display:inline-block;margin-right:6px;font-weight:800}

.opt .tag{display:none;font-size:12px;font-weight:700;margin-left:8px}
.opt.right .tag,.opt.wrong .tag{display:inline}
.opt.right .tag{color:var(--good)}.opt.wrong .tag{color:var(--bad)}
.touch-only{display:none}@media (hover:none),(pointer:coarse){.touch-only{display:inline}.key-only{display:none}}
.coach{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;color:var(--ink)}
.skipb{margin-left:auto}
.toast{background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.modal-dark{color-scheme:dark;--surface:#172027;--surface-2:#1C272F;--ink:#E6ECEA;--muted:#93A1A6;--line:#2A3840;--accent:#3CC2B2;--accent-ink:#06201D;--accent-soft:#16332F;--good:#4ADE80;--good-soft:#15301F;--bad:#F47B55;--bad-soft:#3A1E14}.modal-dark .qbox{background:var(--surface);color:var(--ink)}.modal-dark .opt,.modal-dark .btn{border-color:#6B7C84}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.pad button:focus-visible,.q-text:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q-text:focus{outline:none}
.kbd{font-size:13px}.dlg .df{font-size:13px}
.opt,.btn{border-color:#8A948C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt,:root:not([data-theme="light"]) .btn{border-color:#6B7C84}}
@media (max-width:640px){
 .hud{flex-wrap:nowrap;gap:6px;overflow-x:auto}.hud .pill{font-size:12px;padding:3px 7px}.pchips{display:none}
 .stage .dlg{position:absolute;top:0;bottom:0;left:0;right:0;max-height:none;overflow:auto;border-radius:0}
}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
@media (prefers-reduced-motion:reduce){.shake,.banner{animation:none}.world{transition:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;gap:12px}
.score-big{font-family:var(--display);font-size:clamp(52px,12vw,88px);font-weight:800;line-height:1}
.score-big small{font-size:.35em;color:var(--muted);font-weight:600}
.verdict{font-size:18px;font-weight:700}
.statrow{display:flex;flex-wrap:wrap;gap:8px}
.review{display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);display:grid;gap:4px;font-size:15px}
.rv .mark{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--bad)}
.rv .qq{font-weight:700}
.rv .aa{color:var(--muted)}
.lorecard{background:#0A0D12;color:#E9E6DE;border-radius:var(--radius);padding:22px;display:grid;gap:8px}
.lorecard .dt{font-family:var(--lore-title);letter-spacing:.1em;color:var(--wacc);font-weight:700;font-size:14px;text-transform:uppercase}
.lorecard p{margin:0;font-family:var(--lore);font-size:19px;line-height:1.45}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button class="brand" id="homeBtn" aria-label="Back to the map">MPPO<span>Arcade</span></button>
    <button class="purse" id="shopBtn" aria-label="Lantern Workshop: spend your shards"><span class="gem" aria-hidden="true"></span><b id="purse">0</b><span class="pl">shards · Workshop</span></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   CONTENT: five regions, each with five lessons (lore + gate questions)
   Question format: [scenario, [options; first is correct], explanation]
   ===================================================================== */
const WORLDS = [
{ id:"P", num:"I", name:"The Mirrored Marsh", topic:"Perception & attribution",
  pal:{top:"#06141a",bot:"#0f2c2c",far:"#0b2225",near:"#0f3230",tile:"#070f11",edge:"#4f9c90",acc:"#8ff0dc",fog:"143,240,220"},
  card:["#0d2a2b","#07161a","#8ff0dc"],
  enemies:["Halo","Horn","Stereotype","Contrast","Blame"],
  intro:[
    "So. Another lantern-bearer. The halls of Organa went dark when its people stopped seeing one another truly. The dark did not begin with a villain. It began with a manager who stopped asking.",
    "Sixteen beacons are dark across three realms. Begin with five. Each lies beyond sealed gates, and the gates here yield only to understanding, never to force.",
    "Read the stones along the way. Answer a gate at its first asking and an old art will wake in you: a second jump, a dash, and more. Hesitate, and the path stays hard.",
    "This first marsh mirrors the one who looks into it. What you see says as much about you as about the world. Go."],
  outro:"The first beacon burns. Remember: perception is neither right nor wrong. It is simply the reality each of us acts upon.",
  lessons:[
   {title:"The Clouded Eye", lore:[
     "<strong>Perception</strong> is how we organise and interpret what our senses bring in, to give meaning to the world. We do not see things as they are. We see them as we are.",
     "Three forces shape what is seen. <strong>The perceiver</strong>: attitudes, motives, interests, past experience, expectations.",
     "<strong>The target</strong>: novelty, motion, sound, size, background, proximity, similarity. The loud, the near and the new draw the eye.",
     "<strong>The situation</strong>: time, work setting, social setting. The same act reads differently at a party and in a boardroom."],
    qs:[
     ["Vikram, newly promoted over his former peer Rohan, reads Rohan's Slack jokes as a challenge to his authority. Which perception factors are doing the most work here?",["Factors in the perceiver: Vikram's expectations and new-role insecurity","Factors in the target: novelty and motion","Factors in the situation: time of day","None: the perception is objective"],"Vikram's changed role colours how he reads the same behaviour, so it's the perceiver factors."],
     ["In town halls, the people who speak loudest and sit closest to the CEO are the ones noticed and remembered. Which perception factors explain this?",["Target factors: sound and proximity","Perceiver factors: motives","Situation factors: time","Attribution: high consensus"],"Traits of the target (loudness, closeness) make them stand out."],
     ["Two managers watch the same pitch. The one who was let down by this presenter last year rates it far lower. The main driver is…",["The perceiver's past experience","The target's novelty","The social setting","High distinctiveness"],"Past experience is a perceiver factor. The pitch itself is identical."]]},
   {title:"The Three Questions", lore:[
     "When we see someone act, we ask: was it them (<strong>internal</strong>) or their circumstances (<strong>external</strong>)? Three cues decide.",
     "<strong>Distinctiveness</strong>: do they act this way only in this situation? High means external. Low, where they do it everywhere, means internal.",
     "<strong>Consensus</strong>: do others act the same way? High means external. Low, where only they do it, means internal.",
     "<strong>Consistency</strong>: do they act this way over time? Here the rule flips. High means <strong>internal</strong>. Low, a one-off, means external.",
     "Low distinctiveness, low consensus and high consistency point to the person. The mirror pattern points to the situation. If a cue is unknown, find it before you judge."],
    qs:[
     ["Riya is late to every meeting she attends, nobody else on the team is late, and she has been late all quarter. What will her manager most likely conclude?",["The cause is internal: something about Riya","The cause is external: the meeting schedule","It's a mix; no conclusion is possible","The team culture is at fault"],"Low distinctiveness + low consensus + high consistency = internal."],
     ["Kabir's code this sprint had many bugs. His past work is clean, the whole team's code broke after a forced framework switch, and it has never happened to him before. Attribution?",["External: the situation caused it","Internal: Kabir got careless","Internal, because the bugs are in his code","Can't tell without his personality profile"],"High distinctiveness + high consensus + low consistency all point outward."],
     ["A manager only knows that Tara has missed her last five deadlines. Before blaming Tara, which question adds the most information?",["Are others on the team missing the same deadlines?","Has Tara missed deadlines repeatedly?","Does Tara seem stressed?","Is Tara a high performer on paper?"],"Consistency is already known. Consensus is the missing cue: if everyone misses, look at the situation."],
     ["All branch staff get more complaints after a buggy app launch, and Sneha's ratings fall too. Her manager puts her on a performance plan. What went wrong?",["He ignored high consensus, which points to an external cause","He correctly used consistency","He applied the halo effect","He used the Pygmalion effect"],"When everyone shows the same drop, the app is the likely cause."]]},
   {title:"The Easy Blame", lore:[
     "The mind takes shortcuts when judging. The <strong>fundamental attribution error</strong>: when judging others, we underrate the situation and overrate their character.",
     "<strong>Self-serving bias</strong>: our own successes we credit to ourselves; our failures we blame on circumstance.",
     "Together they set a trap. The same late report is 'IT trouble' when it's mine and 'she's disorganised' when it's hers."],
    qs:[
     ["When his own report is late, Arun blames an IT outage. When his analyst's report is late the same week, he calls her disorganised. His judgement of the analyst shows…",["Fundamental attribution error","Contrast effect","Halo effect","Pygmalion effect"],"He overweights internal causes for her and ignores the same outage."],
     ["After a hit launch, the product head credits his own vision. After a flop, he blames the market. This is…",["Self-serving bias","Fundamental attribution error","Horn effect","Groupthink"],"Successes are credited internally; failures externally."],
     ["A new hire struggles in her first month. Her manager decides she 'lacks ability', never noticing she got no onboarding or system access. This is…",["Fundamental attribution error","Self-serving bias","Stereotyping","Contrast effect"],"Situational causes are ignored when judging someone else."]]},
   {title:"Borrowed Light", lore:[
     "<strong>Contrast effect</strong>: we judge a person against whoever we saw just before, or the team we came from, not against a fixed standard.",
     "<strong>Halo effect</strong>: one shining trait lights up every judgement. <strong>Horn effect</strong>: one flaw darkens them all.",
     "<strong>Stereotyping</strong>: judging a person by what we believe about their group.",
     "The remedies: score people independently against fixed criteria before discussing them, and blind resumes to hide irrelevant cues."],
    qs:[
     ["In appraisals, a solid performer gets 'meets expectations' mainly because he sits next to the team's star. Which fix targets this bias best?",["Rate each person against fixed criteria independently before any group calibration","Let the star help rate peers","Rank everyone against each other","Rate in joining order"],"Contrast effect. Independent scoring against a fixed standard removes the comparison."],
     ["Impressed by a candidate's IIM degree and polished English, an interviewer rates her highly on analytical skills that were never tested. This is…",["Halo effect","Stereotyping","Contrast effect","Self-serving bias"],"One positive feature spills into unrelated judgements."],
     ["'No point training the Gen Z hires; they'll leave in a year anyway.' This reasoning is…",["Stereotyping","Contrast effect","Self-serving bias","Halo effect"],"It's a judgement based on beliefs about a group."],
     ["After one missed deadline, a manager starts calling an employee unreliable, unpolished and 'not leadership material'. This is…",["The horn effect","The halo effect","The Golem effect","Consensus bias"],"One negative trait colours everything."],
     ["A team lead who spent years in a star unit joins an average one and rates everyone lower than her peers do. The main risk in her ratings is…",["A contrast effect from her old team","Self-serving bias","Stereotyping","High consistency"],"Her old team is her reference point."]]},
   {title:"The Spoken Future", lore:[
     "Expectations become reality. The <strong>Pygmalion effect</strong>: high expectations, backed by support, lift performance. The <strong>Golem effect</strong>: low expectations drag it down, then seem to prove themselves right.",
     "Guard against it: pair expectations with coaching and resources, and ask whether your expectations rest on evidence.",
     "As a leader, check how you are seen with <strong>360° feedback</strong>, and share the reasons behind your decisions.",
     "When perceptions clash, as Vikram's and Rohan's did, begin by <strong>listening to understand, not to evaluate</strong>. Ask how they see it, and say it back before you judge."],
    qs:[
     ["A manager decides a new hire is 'weak', gives him only routine tasks and little feedback. Six months later he is underperforming, and the manager feels proven right. This is…",["The Golem effect","The Pygmalion effect","Fundamental attribution error","The horn effect only"],"The low expectations fulfilled themselves."],
     ["A leader tells a new analyst, 'I picked you because I think you can lead this', and backs it with weekly coaching. She outperforms. This is…",["The Pygmalion effect","The halo effect","Self-serving bias","The contrast effect"],"High expectations plus support lifted her performance."],
     ["Vikram wants to fix things with Rohan. Which first move best reflects this region's teaching?",["Ask how Rohan sees the situation and restate it before sharing his own concerns","Issue a formal warning","Give Rohan fewer responsibilities","Discuss Rohan's attitude with the team"],"Listen with understanding before evaluating. Keep it impersonal and involve Rohan."]]}
  ]},
{ id:"D", num:"II", name:"Hall of Crooked Scales", topic:"Decisions & biases",
  pal:{top:"#120c06",bot:"#2b1e0e",far:"#1f160b",near:"#2c2112",tile:"#0d0905",edge:"#a8834a",acc:"#ffc566",fog:"255,197,102"},
  card:["#2d1f0e","#120c06","#ffc566"],
  enemies:["Anchor","Availability","Groupthink","Sunk Cost","Overconfidence","Confirmation","Loss Aversion"],
  intro:[
    "The Hall of Crooked Scales. The old council weighed every choice here, and every scale was bent.",
    "They believed they were rational. They were not. Nobody is. The skill is knowing how the scales bend.",
    "Tread carefully. The crawlers here are named for the biases that brought the council down."],
  outro:"The second beacon burns. No decision is free of bias. Good leaders check the team's biases, and their own, before the big call.",
  lessons:[
   {title:"Three Kinds of Problem", lore:[
     "<strong>Simple</strong> problems, like a recipe, are repeatable: solve them with routine. <strong>Complicated</strong> problems, like a moon rocket, need experts: break them into parts and reassemble.",
     "<strong>Complex</strong> problems, like raising a child, are uncertain and unique. They need partnerships, shared principles, real-time feedback and an eye for non-linear effects.",
     "The rational model assumes full information, every option known, no bias and a wish to optimise. Real minds have <strong>bounded rationality</strong>, so we <strong>satisfice</strong>: we take the first option that is good enough.",
     "<strong>Intuition</strong> is judgement without deliberate analysis, 'unconscious intelligence', and it is built from experience. Trust it most in familiar, repeated situations and least in novel ones. <strong>System 1</strong> is fast and automatic; <strong>System 2</strong> is slow and deliberate."],
    qs:[
     ["Your firm is entering a country where regulation keeps shifting and consumer behaviour is unknown. Which approach fits the problem type?",["Run small pilots with local partners and adjust using real-time feedback","Hire one top expert to design the whole plan upfront","Copy the home-market playbook","Break it into parts and solve each in isolation"],"It's a complex problem: partnerships, principles, feedback loops."],
     ["Building a data centre is hard but well understood: it needs several expert teams to coordinate, and the outcome is predictable. The problem is…",["Complicated: decompose it and bring in experts","Simple: follow a checklist","Complex: experiment and iterate","Chaotic: act first"],"It's the moon-rocket category."],
     ["A hiring manager must fill a role by Friday, so she takes the first candidate who clears the minimum bar. This is…",["Satisficing under bounded rationality","The endowment effect","Anchoring","Groupthink"],"Limits of time and information lead to 'good enough'."],
     ["In which situation is a manager's intuition most defensible?",["A seasoned plant manager diagnosing a machine fault she has seen hundreds of times","A first-time founder valuing a startup","Any high-stakes, one-off decision","When the data contradicts the gut"],"Intuition comes from repeated experience of familiar patterns."]]},
   {title:"Echoes and Anchors", lore:[
     "<strong>Anchoring</strong>: the first number heard pulls every later estimate toward it. Ask where the number came from.",
     "<strong>Availability</strong>: what comes easily to mind, because it is recent or vivid, feels more common and more important than it is.",
     "<strong>Saliency</strong>: one memorable past success becomes the analogy for everything, even when the cases differ."],
    qs:[
     ["A candidate opens at ₹40L. The band is ₹25–30L, yet the final offer lands at ₹34L. The recruiter was most affected by…",["Anchoring","Availability","Loss aversion","The halo effect"],"The first number pulled the outcome toward it."],
     ["After one fraud case hits the headlines, the audit team moves almost all its effort to that fraud type and neglects larger routine risks. Bias?",["Availability bias","Endowment effect","Overconfidence","Self-interest"],"The vivid, recent event is overweighted."],
     ["'This turnaround is exactly like how we fixed Unit X in 2019,' says the team, though Unit X was a very different business. Bias?",["Saliency bias","Endowment effect","Affect heuristic","Groupthink"],"A memorable success is used as a false analogy."]]},
   {title:"The Council's Blind Spots", lore:[
     "<strong>Confirmation bias</strong>: seeking only evidence that agrees with us. Remedy: look for what would prove you wrong.",
     "<strong>Groupthink</strong>: the wish to agree silences dissent. Remedy: collect views independently first, and appoint a devil's advocate.",
     "<strong>Self-interest</strong>: does the person recommending this gain from it? This is the reviewer's first question.",
     "<strong>Affect heuristic</strong>: a team in love with its idea stops seeing the costs. <strong>Halo effect</strong>: success in one domain is assumed to carry over to another."],
    qs:[
     ["The CEO tells the strategy team: 'Find me data proving the market is growing.' The biggest risk in their report is…",["Confirmation bias","Disaster neglect","Loss aversion","Contrast effect"],"The brief asks only for confirming evidence."],
     ["Everyone agrees with the MD in meetings, and doubts surface only in the corridor afterwards. Which intervention helps most?",["Collect written views independently before discussion and appoint a devil's advocate","Let the MD speak first","Shorten meetings","Invite only supporters"],"This is groupthink. Independent input brings the hidden doubts out."],
     ["A regional head recommends an expansion that would also double the size of his own division. As the reviewer, the first bias to check is…",["Self-interest bias","Availability","Anchoring","Loss aversion"],"Ask whether there's any reason to suspect motivated errors."],
     ["The product team is visibly in love with its vision and brushes past the cost risks. You'd flag…",["The affect heuristic","Anchoring","Availability","Loss aversion"],"Liking the option is driving the judgement."],
     ["'She fixed our supply chain, so she'll obviously turn around marketing too.' As a reviewer you'd flag the…",["Halo effect","Saliency bias","Anchoring","Disaster neglect"],"Success in one domain is assumed to transfer."]]},
   {title:"The Future Unseen", lore:[
     "<strong>Sunk cost and the endowment effect</strong>: overvaluing what we already own or have spent. Past money should not drive a forward-looking choice.",
     "<strong>Loss aversion</strong>: a loss hurts more than an equal gain pleases, so teams reject good bets. Ask: are we being too cautious?",
     "<strong>Overconfidence</strong> produces rosy base cases. Remedy: the <strong>outside view</strong>. How did similar projects actually go?",
     "<strong>Disaster neglect</strong> leaves the worst case not bad enough. Remedy: the <strong>premortem</strong>. Imagine the plan has already failed, and write down why."],
    qs:[
     ["₹50 crore has gone into a failing ERP rollout. The committee adds ₹20 crore 'so the earlier money isn't wasted'. Bias?",["Sunk cost / endowment effect","Anchoring","Availability","Saliency"],"Past spend is driving a forward-looking decision."],
     ["A project has a 70% chance of gaining ₹10 crore and a 30% chance of losing ₹3 crore. The team rejects it as 'too risky'. Most likely bias?",["Loss aversion","Overconfidence","Disaster neglect","Halo effect"],"The expected value is strongly positive, but the loss looms larger."],
     ["A team estimates a migration at 6 months. Similar migrations across the industry took 14 months on average. Which technique would have caught this?",["The outside view (reference-class forecast)","Joint evaluation","One expert's opinion","Cycling through objectives"],"That's overconfidence. Anchor the estimate on how similar projects went."],
     ["'Imagine it's a year from now and this launch has flopped. Write down why.' What does this mainly counter?",["Disaster neglect and overconfidence (a premortem)","Loss aversion","Anchoring","Self-interest"],"A premortem legitimises imagining failure."]]},
   {title:"Wider Choices", lore:[
     "On options: <strong>joint evaluation</strong> compares them side by side. The <strong>vanishing options test</strong> asks: if none of these were available, what would we do? It uncovers alternatives nobody considered.",
     "On objectives: seek advice, and cycle through your objectives. On the future: make three estimates (low, medium and high).",
     "<strong>Nudging</strong> changes how a choice is set up, such as its defaults, so the good behaviour becomes the easy one, without forbidding anything.",
     "Beware the new scales too. An AI trained on years of biased human decisions learns those biases, as a hiring tool once learned to penalise women's CVs."],
    qs:[
     ["A manager is stuck between Vendor A and Vendor B. A colleague asks, 'If neither were available, what would you do?' The value of this question is that it…",["Generates alternatives nobody had considered","Anchors the team on A","Forces a quick choice","Tests for self-interest"],"This is the vanishing options test."],
     ["A company makes pension enrolment the default, with the option to opt out. Participation jumps from 40% to 90%. This is…",["A nudge","Satisficing","Anchoring employees","Loss aversion by HR"],"The choice architecture changed; no option was removed."],
     ["An AI screening tool trained on 10 years of past hiring decisions starts downgrading women's CVs. The key managerial lesson is…",["Algorithms trained on past human decisions can reproduce those decisions' biases","AI is inherently sexist","More data always removes bias","Only humans should screen"],"Bias in the historical data became bias in the model."]]}
  ]},
{ id:"T", num:"III", name:"The Mask Archive", topic:"Personality",
  pal:{top:"#0e0a18",bot:"#221737",far:"#191128",near:"#241a3a",tile:"#0a0711",edge:"#7f6cc0",acc:"#c9b8ff",fog:"201,184,255"},
  card:["#241a3a","#0e0a18","#c9b8ff"],
  enemies:["Fixed Mindset","Typecast","Narcissus","Machiavel","Labeler"],
  intro:[
    "The Mask Archive. Every citizen of Organa once kept a mask here, a record of who they were.",
    "The archivists argued forever. Are masks carved at birth, or shaped by the life that wears them?",
    "Learn the old taxonomies. And learn when a mask matters, and when the room decides for you."],
  outro:"The third beacon burns. No trait is good or bad in itself. What matters is how, and where, it is used.",
  lessons:[
   {title:"Clay and Kiln", lore:[
     "<strong>Personality</strong> is the sum of the ways a person reacts to and interacts with others: characteristic patterns of thinking, feeling and behaving.",
     "Nature or nurture? The modern answer is both. <strong>Epigenetics</strong> shows that environment and behaviour change how genes are expressed. It is an interactionist view.",
     "Mindset matters. A <strong>growth mindset</strong> treats mistakes as lessons and ability as something you develop. A <strong>fixed mindset</strong> says 'I'll never be good at this.'"],
    qs:[
     ["Identical twins raised apart show similar extraversion but differ in openness, depending on how enriching their homes were. This supports…",["An interactionist view: genes and environment shape each other","Pure nature","Pure nurture","Situation strength theory"],"Genes act in context."],
     ["After a failed pitch, which response is most likely to build a growth mindset?",["'What did we learn, and what will we try differently next time?'","'Some people just aren't cut out for pitching.'","'Don't worry, you're naturally talented.'","'Let's avoid pitches for now.'"],"Mistakes are treated as learning."],
     ["Which statement reflects a fixed mindset?",["'I'm just not a numbers person, so there's no point practising.'","'I'll ask for feedback on my model.'","'This is hard, so I'll break it down.'","'I'll learn from how Priya did it.'"],"It treats ability as unchangeable."]]},
   {title:"The Five Currents", lore:[
     "The <strong>Big Five</strong>: Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism. It is a taxonomy of how people describe themselves and others, not a theory, and it is the model research trusts most.",
     "<strong>Conscientiousness</strong> (dependable, organised, persistent) is the most consistent predictor of job performance across roles.",
     "<strong>Neuroticism</strong> is the opposite of emotional stability. It matters most under pressure.",
     "No score is simply good or bad. High agreeableness builds harmony but can fail you in hard negotiations or tough feedback. Teams work best when traits complement one another."],
    qs:[
     ["You are hiring for dozens of different roles and can measure only one Big Five trait. Which is the best general predictor of performance?",["Conscientiousness","Extraversion","Openness","Agreeableness"],"Conscientiousness predicts performance across most jobs."],
     ["A candidate for a high-pressure trading desk scores very high on neuroticism. The most relevant concern is…",["How well they stay emotionally stable under stress","Whether they're creative enough","Whether they're too sociable","Whether they follow rules"],"Neuroticism is low emotional stability."],
     ["A team made up entirely of high-openness, low-conscientiousness people generates brilliant ideas but misses every deadline. The best composition fix is to…",["Add members high in conscientiousness","Add more high-openness members","Remove anyone low in agreeableness","Run an MBTI workshop"],"Complementary traits cover the gap."],
     ["A highly agreeable manager is praised for team harmony. Where is this trait most likely to become a liability?",["Delivering tough feedback or negotiating hard with a supplier","Onboarding new hires","Resolving minor conflicts","Building client rapport"],"No trait is good or bad; it depends on the situation."]]},
   {title:"The Measuring", lore:[
     "Personality testing began with the US Army in the First World War. Today it is a large industry, and not without controversy.",
     "<strong>MBTI</strong> sorts people into 16 types. It is popular, but more than half of those who retake it get a different type, and types don't predict performance. Even its foundation warns against using it for hiring. <strong>Big Five-based tests do predict performance.</strong>",
     "Strengths-based tests such as StrengthsFinder come from positive psychology. But criticism and realistic self-assessment also drive growth.",
     "Two traps. Blaming conflict on 'difficult personalities' can hide the manager's own role in creating the right conditions. And bespoke tests built on proprietary methods are hard to validate."],
    qs:[
     ["HR proposes shortlisting candidates by MBTI type. The strongest objection is…",["Many people get a different type on retesting, and types don't predict performance","MBTI has too few types","MBTI measures IQ","MBTI is illegal"],"It has low reliability and weak prediction."],
     ["A company uses only strengths assessments and discourages critical feedback. The risk is…",["Criticism and realistic self-assessment also drive improvement, and they get lost","Strengths tests are illegal","Engagement falls","It takes too long"],"Focusing only on positives isn't the best way to improve."],
     ["A team keeps fighting, so the manager orders personality tests to find the 'difficult people'. The warning is that this can make managers…",["Overlook their own role in creating conditions for the team to succeed","Hire too many introverts","Over-invest in training","Break privacy law"],"Personality isn't the only lever. The conditions the manager creates matter too."],
     ["A firm profiles its top sellers and rewrites the job description around their traits using a proprietary test. Why are academics sceptical?",["The methods are proprietary and hard to validate","Top performers can't be identified","Traits never predict sales","It's too cheap"],"Proprietary methods resist scrutiny."]]},
   {title:"The Dark Three", lore:[
     "<strong>Machiavellianism</strong>: manipulative and self-interested, playing people against each other.",
     "<strong>Narcissism</strong>: grandiose, entitled, hungry for admiration. Every story returns to 'I'.",
     "<strong>Psychopathy</strong>: impulsive, emotionally cold, without remorse."],
    qs:[
     ["A manager charms senior leaders, quietly takes credit for others' work, and plays colleagues against each other to get ahead. Which Dark Triad trait fits best?",["Machiavellianism","Narcissism","Psychopathy","Neuroticism"],"Manipulative and self-interested."],
     ["A leader constantly needs admiration, feels entitled to special treatment, and turns every conversation back to himself. Which trait?",["Narcissism","Machiavellianism","Psychopathy","Openness"],"Grandiose and entitled."],
     ["A manager acts on impulse, humiliates a junior in public, and shows no remorse afterwards, seeming emotionally cold. Which trait?",["Psychopathy","Narcissism","Machiavellianism","Agreeableness"],"Impulsive, cold and remorseless."]]},
   {title:"Strong Rooms", lore:[
     "<strong>Situation strength</strong>: strong situations, high in Clarity, Consistency, Constraints and Consequences, make everyone behave alike, so personality predicts little. Weak situations let personality show.",
     "<strong>Trait activation</strong>: some situations call a trait forward. Handling angry customers activates agreeableness and extraversion; creative work activates openness."],
    qs:[
     ["In the compliance team, with scripted processes and strict penalties, everyone behaves alike. In the innovation lab, behaviour varies hugely. Best explanation?",["Situation strength: strong situations suppress personality differences","Trait activation","Epigenetics","Random variation"],"The compliance team works in a strong situation."],
     ["Which job would most strongly activate agreeableness and extraversion as predictors of success?",["Handling angry customers at a service desk","Archiving documents alone","Data entry to fixed rules","Night-shift monitoring"],"Dealing with upset people activates these traits."],
     ["A firm introduces a detailed SOP with clear rules and penalties for every step. You'd expect personality tests to predict employee behaviour…",["Less well than before","Better than before","Exactly as before","Only for extraverts"],"The situation has become strong, so personality matters less."]]}
  ]},
{ id:"E", num:"IV", name:"Ember Hollow", topic:"Emotions & EI",
  pal:{top:"#150707",bot:"#33110c",far:"#240d0a",near:"#341510",tile:"#0f0505",edge:"#b85a3e",acc:"#ff9468",fog:"255,148,104"},
  card:["#3a150f","#150707","#ff9468"],
  enemies:["Hijack","Rumination","Suppression","Dissonance","Outburst"],
  intro:[
    "Ember Hollow. The fires here never went out. The people only stopped understanding them.",
    "Emotions are not the enemy of good work. Unexamined emotions are."],
  outro:"The fourth beacon burns. Emotions plus knowledge make behaviour. Know your emotions, regulate them, and be empathetic to the emotions of others.",
  lessons:[
   {title:"Sparks and Smoke", lore:[
     "<strong>Affect</strong> is the broad range of feelings. It comes as <strong>emotions</strong> or <strong>moods</strong>.",
     "<strong>Emotions</strong> have a specific cause and are brief (seconds to minutes), action-oriented, with distinct facial expressions. <strong>Moods</strong> have a general or unclear cause, last hours or days, and are cognitive, with no distinct expression.",
     "Ekman found <strong>seven universal emotions</strong> whose faces are read across cultures: anger, contempt, disgust, enjoyment, fear, sadness, surprise.",
     "Anger climbs a ladder: annoyance, frustration, exasperation, argumentativeness, bitterness, vengefulness, fury. Deal with it while it is still small."],
    qs:[
     ["Priya has felt flat and unfocused all week and can't point to any reason. She is experiencing…",["A mood","An emotion","An amygdala hijack","Emotional labour"],"It has an unclear cause and is lasting days: a mood."],
     ["An Indian manager in Brazil correctly reads a colleague's expression of disgust without speaking the language. This is best explained by…",["Universal basic emotions (Ekman)","Cultural distance","Emotional labour","Trait activation"],"Basic emotional expressions are recognised across cultures."],
     ["An employee's mild annoyance at being interrupted in meetings is never addressed. Months later it has become bitterness. The lesson is…",["Anger escalates along a continuum, so address it while it's mild","Moods fix themselves","Only intense emotions matter","This is an amygdala hijack"],"Annoyance turns into bitterness over time."]]},
   {title:"The Three Brains", lore:[
     "The <strong>neocortex</strong> thinks. The <strong>limbic brain</strong> feels. The <strong>reptilian brain</strong> reacts.",
     "An <strong>amygdala hijack</strong> has three signs: a strong emotional reaction, a sudden onset, and realising afterwards that it was inappropriate. The first defence is a pause, so the thinking brain can catch up.",
     "<strong>Emotions + Knowledge = Behaviour.</strong> Emotion decides whether we act on what we know, or ignore it."],
    qs:[
     ["A manager hears a blunt critique in a review, instantly shouts at the presenter, and ten minutes later regrets it. The best label is…",["An amygdala hijack","Deep acting","A negative mood","Low conscientiousness"],"A strong reaction, a sudden onset, and regret afterwards."],
     ["A manager knows the fair disciplinary process but, while furious, fires someone on the spot. Which idea explains this?",["Emotions + Knowledge = Behaviour: the emotion overrode what he knew","He lacked knowledge","It was a strong situation","He is low in openness"],"Emotion decided whether he used what he knew."],
     ["Mid-negotiation, you feel a sudden surge of anger at an insulting offer. What's the best response?",["Pause and buy time before replying, so the thinking brain catches up","Reply immediately while the point is fresh","Suppress it and smile","Walk out"],"The first defence against a hijack is a pause."]]},
   {title:"The Five Lights", lore:[
     "<strong>Emotional intelligence</strong> means being self-aware, detecting emotions in others, and managing emotional cues. Goleman names five parts.",
     "<strong>Self-awareness</strong>: knowing your emotions and their effects, and assessing yourself realistically. <strong>Self-regulation</strong>: keeping impulses in check, comfort with ambiguity, openness to change.",
     "<strong>Motivation</strong>: a drive to achieve, and optimism even in failure.",
     "<strong>Empathy</strong>: sensing others' feelings and taking an active interest in them. <strong>Social skill</strong>: persuading, leading change, building teams."],
    qs:[
     ["During uncertain merger talks, a leader stays calm, avoids snap reactions to rumours, and is open to changes in the plan. Which component is this?",["Self-regulation","Empathy","Social skill","Motivation"],"Impulse control, comfort with ambiguity, openness to change."],
     ["A leader notices a usually talkative team member has gone quiet after a meeting and checks in privately. Which component?",["Empathy","Self-awareness","Self-regulation","Motivation"],"Sensing and caring about others' feelings."],
     ["A manager knows she gets impatient when tired, so she schedules hard conversations for mornings. Which component?",["Self-awareness","Empathy","Social skill","Motivation"],"She knows her emotions and their effects."],
     ["A leader builds a coalition across three departments and persuades sceptics one by one to push through a restructuring. Which component?",["Social skill","Self-regulation","Self-awareness","Empathy"],"Persuasion and leading change."],
     ["After losing a major client, a sales head stays optimistic, sets new targets and pushes on. Which component?",["Motivation","Social skill","Empathy","Self-awareness"],"A drive to achieve and optimism in failure."]]},
   {title:"The Painted Smile", lore:[
     "<strong>Emotional labour</strong> is displaying the emotions a job requires. When felt and displayed emotions differ, the gap is <strong>emotional dissonance</strong>, and over time it exhausts.",
     "<strong>Surface acting</strong> fakes the display. <strong>Deep acting</strong> tries to genuinely feel the required emotion, for example by taking the other person's perspective. Deep acting drains less over time."],
    qs:[
     ["A call-centre agent tries to see an angry caller's perspective so that she genuinely feels sympathy rather than just sounding sympathetic. This is…",["Deep acting, which tends to drain less over time","Surface acting, which drains less","Emotional suppression","An amygdala hijack"],"She is changing the felt emotion, not just the display."],
     ["A receptionist must smile all day while feeling contempt for rude guests. The biggest long-term risk is…",["Emotional dissonance leading to exhaustion","Higher EI","Better moods","Higher agreeableness"],"A persistent felt-versus-displayed gap wears people down."],
     ["Which employee is most at risk of emotional dissonance?",["A nurse required to appear cheerful while privately exhausted and grieving","A coder working alone on a task she enjoys","An analyst who is openly frustrated with a bug","A manager celebrating a genuine win"],"The gap between felt and displayed emotion is widest for the nurse."]]},
   {title:"Cooling the Embers", lore:[
     "Weaker strategies: <strong>suppression, rumination, avoidance</strong>. Stronger ones: <strong>cognitive reappraisal</strong> (reframing what the situation means), mindfulness, social sharing.",
     "The <strong>CBT</strong> chain runs thoughts and beliefs → physical feelings → emotions → behaviour. 'I'm bad at this' leads to threat, then anxiety, then avoidance. Change the thought, and the chain changes.",
     "Signs of low emotional intelligence: being argumentative, not listening, blaming others, emotional outbursts."],
    qs:[
     ["After a proposal is rejected, a manager tells herself, 'This is feedback that'll make the next pitch stronger.' Which strategy is this?",["Cognitive reappraisal","Suppression","Rumination","Avoidance"],"She reframed what the situation means."],
     ["An analyst believes 'I'm bad at presenting', so he avoids presentations, never practises, and stays bad at them. Using CBT, where should coaching start?",["Challenging the belief itself","Assigning him many presentations at once","Teaching slide design","Removing presentations from his role"],"The chain begins with thoughts and beliefs."],
     ["In a quarterly review, a manager publicly blames his team for a missed target and cuts people off when they explain. Which signs of low EI does he show?",["Blaming others and not listening","Being argumentative only","None: he's just being direct","Emotional outbursts only"],"He shows two of the classic signs at once."]]}
  ]},
{ id:"C", num:"V", name:"The Quiet Bridge", topic:"Listening & context",
  pal:{top:"#070c17",bot:"#152139",far:"#0e172a",near:"#16223b",tile:"#060a12",edge:"#6286c0",acc:"#a8ccff",fog:"168,204,255"},
  card:["#16223b","#070c17","#a8ccff"],
  enemies:["Evaluation","Smith","Defensiveness","One-Way Empathy","Monologue"],
  intro:[
    "The Quiet Bridge, and the last beacon of the first realm. Organa did not fall silent from shouting. It fell silent because no one truly listened.",
    "Everyone spoke. Everyone explained. No one understood."],
  outro:"The fifth beacon burns, and the first realm's light holds. Human behaviour is a science, not a random act. Understand it and you can predict it; predict it and you can lead. Your quiz awaits.",
  lessons:[
   {title:"Person and Place", lore:[
     "Lewin: <strong>B = f(P, E)</strong>. Behaviour is a function of the Person and their Environment. When behaviour changes, look at both.",
     "<strong>Sociomateriality</strong>: technology is not a passive tool. Its design shapes behaviour, culture and power, as when a raise-hand queue on a video call decides who speaks next."],
    qs:[
     ["A star performer's output collapses after he moves to a team with a hostile manager. What does Lewin's equation suggest you examine?",["The environment, not just the person","Only his motivation","Only his personality","Nothing: performance is random"],"The person didn't change; the environment did."],
     ["After the company adopts a chat tool that shows everyone's online status, people start staying 'green' late into the night. This illustrates…",["Sociomateriality: technology's design shapes behaviour and culture","Bounded rationality","The contrast effect","Deep acting"],"The tool's design created a new norm."],
     ["A usually punctual team becomes chronically late after the office moves far from public transport. The best first explanation is…",["A change in environment (E in B = f(P, E))","A sudden drop in conscientiousness","Groupthink","Self-serving bias"],"Look at what changed: the environment."]]},
   {title:"Distant Shores", lore:[
     "Ghemawat: the world is <strong>semi-globalised</strong>. Differences across borders still matter.",
     "The <strong>CAGE</strong> distances: <strong>Cultural</strong> (language, norms), <strong>Administrative</strong> (laws, institutions), <strong>Geographic</strong>, <strong>Economic</strong>. Wise managers engage with them strategically and tactically, instead of using one playbook everywhere."],
    qs:[
     ["An Indian firm entering Brazil struggles with unfamiliar labour laws and permit rules. On the CAGE framework, this is mainly…",["Administrative distance","Cultural distance","Geographic distance","Economic distance"],"Laws and institutions are administrative."],
     ["A manager runs one identical playbook for teams in Bengaluru, São Paulo and Warsaw and is surprised by the uneven results. He ignored…",["Semi-globalisation: differences across borders still matter","Bounded rationality","Situation strength","The halo effect"],"Engage with CAGE distances; don't assume a flat world."],
     ["An Indian manager is confused that her Tokyo team rarely disagrees openly in meetings, then raises concerns privately. This is mainly…",["Cultural distance","Administrative distance","Economic distance","Geographic distance"],"Communication norms are cultural."]]},
   {title:"Fallen Leaders", lore:[
     "Why managers fail (HBR, 2024): they <strong>lack self-awareness</strong>; their <strong>empathy is a one-way street</strong>; their <strong>relationships with employees are unproductive</strong>; their employees' <strong>work doesn't align with goals</strong>."],
    qs:[
     ["A manager expects his team to understand the pressures he's under but never asks about theirs. Why is he likely to fail?",["Empathy is a one-way street","He lacks technical skill","Work isn't aligned with goals","He is too self-aware"],"Empathy must flow both ways."],
     ["A technically brilliant manager doesn't realise his sarcasm in reviews demotivates the team. Which failure reason fits?",["Lack of self-awareness","One-way empathy","Goal misalignment","Unproductive relationships"],"He is blind to his own effect on others."],
     ["A team works long hours on projects that leadership doesn't value or even track. Which failure reason fits?",["Employees' work doesn't align with goals","Lack of self-awareness","One-way empathy","Too much empathy"],"The effort is disconnected from what matters."]]},
   {title:"The Listener", lore:[
     "Carl Rogers: the major barrier to communication is our <strong>tendency to evaluate</strong>, to judge, approve or disapprove from our own frame of reference. It grows stronger as emotions rise.",
     "The gateway is <strong>listening with understanding</strong>: seeing the idea from the other person's frame of reference. It means understanding <em>with</em> a person, not <em>about</em> them.",
     "The test: you may speak only after you have restated the other person's ideas <strong>and feelings</strong> to their satisfaction.",
     "The obstacles: it takes <strong>courage</strong>, because you risk being changed yourself; <strong>heightened emotions</strong> make it hardest, though a neutral third party can help; it is proven only in small <strong>groups</strong>; and society lacks faith in the social sciences."],
    qs:[
     ["An employee says, 'This new appraisal system is unfair.' Which response shows listening with understanding?",["'You feel it doesn't capture the work you do. Tell me more.'","'It's data-driven, so it can't be unfair.'","'Everyone else seems fine with it.'","'Let's not get emotional.'"],"It reflects the speaker's ideas and feelings without evaluating them."],
     ["Two colleagues are arguing about a plan. Under Rogers' rule, what must each do before stating their own view?",["Restate the other's ideas and feelings accurately, to their satisfaction","Present evidence for their own view","Take equal turns","Agree to disagree"],"This takes the heat out and narrows the differences."],
     ["Union and management are deadlocked, and emotions are high. Rogers would suggest…",["A neutral third party who listens to each side with understanding","A quick vote","Going to the courts","Replacing the negotiators"],"A neutral catalyst restores communication."],
     ["Why might a manager avoid truly understanding a militant union leader's view, even knowing it would help?",["It takes courage, because she risks being changed","It takes too long","It's against policy","Understanding means agreeing"],"Entering another's frame of reference can change you."]]},
   {title:"Smith and Jones", lore:[
     "The boss says: 'I think this is the best way to do your job.' Bill replies: 'Oh yeah!'",
     "<strong>Smith</strong> explains harder. He assumes the conversation is <strong>logical</strong>, that words mean something by themselves, and that the goal is to make Bill agree. Bill hears the attitude, not the logic, and grows defensive.",
     "<strong>Jones</strong> listens. He assumes the conversation is an interaction of <strong>sentiments</strong>, that <em>Bill</em>, not his words, means something, and that the goal is to let Bill express his differences. To Jones, 'Oh yeah!' is indeterminate: a chance to find out more.",
     "Jones has a better map of how communication works. Listening like him takes self-awareness and practised skill, an emotional achievement as well as an intellectual one. There are too many Smiths and too few Joneses."],
    qs:[
     ["Boss: 'I think this is the best way to do your job.' Employee: 'Oh yeah!' Which reply is most like Jones?",["'Sounds like you see it differently. What's on your mind?'","'Let me explain again why this works.'","'I'm the manager, so let's go with it.'","'You'll understand once you try it.'"],"Jones invites Bill to express his differences."],
     ["A manager re-explains his logic in simpler and simpler words, and the employee grows more defensive each time. What is he missing?",["The exchange is about feelings; the employee hears his attitude more than his logic","He needs better slides","The employee lacks intelligence","He should talk more slowly"],"This is Smith's error."],
     ["In Roethlisberger's second school of thought, 'Oh yeah!' should be treated as…",["Indeterminate: a chance to find out what the employee means","Proof of poor communication","Agreement","Insubordination"],"The first school explains harder; the second listens."],
     ["Why is listening like Jones more than an intellectual exercise?",["It needs self-awareness and practised face-to-face skill, which is an emotional achievement too","It requires a psychology degree","It only works in writing","It depends on seniority"],"There are too many Smiths and too few Joneses."]]}
  ]}

{ id:"M1", num:"VI", name:"The Hunger Stair", topic:"Motivation · content theories",
  pal:{top:"#07120a",bot:"#16301b",far:"#0f220f",near:"#173219",tile:"#060c06",edge:"#6fa35a",acc:"#b8f08a",fog:"184,240,138"},
  card:["#173219","#07120a","#b8f08a"],
  enemies:["Hygiene","Stagnation","Frustration","Apathy","Regression"],
  intro:[
    "The Hunger Stair. Every worker of Organa once climbed it, step by step, need by need.",
    "When the stair broke, people stopped asking what moved them. They only asked what they were owed.",
    "Learn what moves people, and you can move with them."],
  outro:"The sixth beacon burns. Motivated people are an organisation's key asset. Understand what motivates the people with you, and align what you offer with their needs.",
  lessons:[
   {title:"What Moves Us", lore:[
     "To <strong>motivate</strong> is to move, to activate. Motivation has three elements: <strong>direction</strong> (where effort goes), <strong>intensity</strong> (how hard one tries) and <strong>persistence</strong> (how long one keeps at it).",
     "It arises where three things meet: the <strong>person</strong>, the <strong>situation</strong> and the <strong>job itself</strong>.",
     "<strong>Content theories</strong> ask <em>what</em> motivates. They assume people have needs they pursue: Maslow, Alderfer, McClelland, Herzberg, Self-Determination.",
     "<strong>Process theories</strong> ask <em>how</em> motivation happens: people choose goals and how to reach them through a kind of calculation. These are goal setting, self-efficacy, reinforcement, expectancy, equity and job design."],
    qs:[
     ["An analyst works furiously on the right model for an hour, then abandons it at the first error. Which element of motivation is weakest?",["Persistence","Direction","Intensity","Valence"],"He worked hard (intensity) on the right task (direction), but didn't keep going."],
     ["A theory that asks 'which needs drive employees?' belongs to…",["Content theories","Process theories","Reinforcement theory","Equity theory"],"Content theories ask what motivates; process theories ask how."],
     ["A strong performer disengages after moving from a creative role to a repetitive one, with the same manager, team and pay. Which source of motivation changed most?",["The job itself","The person","The situation","Her pay"],"The person and her surroundings stayed the same; the work changed."]]},
   {title:"The Stair of Needs", lore:[
     "<strong>Maslow</strong> describes five levels, from the bottom: <strong>physiological</strong> (food, water, rest), <strong>safety</strong> (security), <strong>belongingness and love</strong> (relationships), <strong>esteem</strong> (prestige, accomplishment) and <strong>self-actualisation</strong> (reaching your full potential). A lower need must be largely met before the next one motivates.",
     "<strong>Alderfer's ERG</strong> compresses these into three. <strong>Existence</strong> covers physiological and safety needs. <strong>Relatedness</strong> covers social needs and the outward part of esteem. <strong>Growth</strong> covers inner esteem and self-actualisation.",
     "ERG differs in a key way: it makes <strong>no assumption that lower needs must be satisfied first</strong>, so several can operate at once. It also adds <strong>frustration–regression</strong>: when a higher need is blocked, people fall back on a lower one. Satisfaction–progression still moves them upward."],
    qs:[
     ["After a layoff scare, a designer who used to chase creative stretch projects now cares only about keeping her job. In Maslow's terms…",["An unmet safety need dominates again","She has self-actualised","Her esteem needs are fully met","Her growth need has strengthened"],"A threatened lower need takes priority again."],
     ["An engineer is repeatedly denied promotion and learning opportunities. He now pushes hard for a bigger bonus and spends more time socialising. Best explanation?",["ERG frustration–regression","Maslow's satisfaction–progression","Herzberg's hygiene factors","Need for power"],"His blocked growth need pushes him back toward existence and relatedness needs."],
     ["Which observation fits ERG but contradicts strict Maslow?",["A poorly paid artist is driven mainly by creative growth while still worried about rent","People always satisfy safety before belonging","Self-actualisation sits at the top","Physiological needs are most basic"],"ERG allows several needs to operate at once, without strict order."],
     ["A firm offers free meals, health insurance and job security. In ERG terms these mainly address…",["Existence needs","Relatedness needs","Growth needs","Need for achievement"],"Existence covers physiological and safety needs."]]},
   {title:"Three Hungers", lore:[
     "<strong>McClelland</strong> argues that needs are <em>acquired</em> through life experience. Three matter at work.",
     "<strong>Need for achievement (nAch)</strong>: the drive to excel against a standard. High achievers like personal responsibility, quick feedback and moderately difficult goals.",
     "<strong>Need for affiliation (nAff)</strong>: the desire for friendly, close relationships. <strong>Need for power (nPow)</strong>: the need to make others behave in ways they otherwise would not.",
     "Match roles to needs. A high-nAch star can be a superb individual contributor without being a natural manager, a role where influence (power) matters more."],
    qs:[
     ["A sales rep tracks her numbers against last quarter, wants weekly feedback, and prefers targets that are hard but reachable. Dominant need?",["Need for achievement","Need for affiliation","Need for power","Existence"],"Standards, feedback and moderately hard goals are the high-nAch profile."],
     ["A team member turns down a promotion because he'd have to manage his friends and lose his place in the team's social life. Dominant need?",["Need for affiliation","Need for achievement","Need for power","Esteem"],"Close relationships matter more to him than status."],
     ["A manager loves shaping decisions, persuading the leadership team and controlling which projects get funded. Dominant need?",["Need for power","Need for affiliation","Need for achievement","Safety"],"She wants to influence what others do."],
     ["A top individual coder is promoted to lead a team and struggles. McClelland would say…",["A high need for achievement doesn't guarantee the influence a manager role needs","He needs more pay","His hygiene factors were removed","His existence needs are unmet"],"Achievement drives personal excellence; managing others draws on power and influence."]]},
   {title:"The Two Ledgers", lore:[
     "<strong>Herzberg</strong> split the traditional single scale in two. Satisfaction and dissatisfaction are <strong>not opposites</strong>.",
     "<strong>Hygiene factors</strong> are extrinsic: company policy, supervision, salary, relationships with peers, working conditions, workspace, status and security. Getting them right yields <strong>no dissatisfaction</strong>. It does not yield motivation.",
     "<strong>Motivators</strong> are intrinsic: achievement, recognition, the work itself, responsibility, advancement and growth. They create <strong>satisfaction</strong>. Without them you get 'no satisfaction', not dissatisfaction.",
     "So remove dissatisfaction with hygiene, and build motivation with motivators. Hygiene maps to Maslow's lower needs; motivators map to esteem and self-actualisation."],
    qs:[
     ["A company raises salaries and renovates the office. Complaints fall, but engagement doesn't rise. Herzberg would say…",["Hygiene factors removed dissatisfaction but cannot create motivation","Pay is a motivator, so engagement will follow","The office is a motivator","Satisfaction and dissatisfaction are one scale"],"Hygiene factors only take you to 'no dissatisfaction'."],
     ["Which change is most likely to genuinely motivate a bored analyst, per Herzberg?",["Ownership of a client project, with recognition for results","A better chair and air-conditioning","A clearer leave policy","Friendlier supervision"],"Responsibility and recognition are motivators; the rest are hygiene factors."],
     ["A demotivated team has below-market pay and a cramped office, and people also feel unrecognised. What's the Herzberg-consistent priority?",["Fix pay and conditions to remove dissatisfaction, then add recognition and growth to motivate","Only add recognition; pay doesn't matter","Only raise pay; it will motivate","Only rewrite company policies"],"The two factors work on different scales, so you need both."],
     ["Staff grumble about an unfair leave policy and a micromanaging supervisor. These complaints concern…",["Hygiene factors","Motivators","Growth needs","Need for achievement"],"Policy and supervision are extrinsic hygiene factors."]]},
   {title:"Self-Determination", lore:[
     "<strong>Self-determination theory</strong> names three basic human needs. <strong>Competence</strong>: being effective in dealing with your environment. <strong>Autonomy</strong>: control over the course of your life. <strong>Relatedness</strong>: close, affectionate relationships with others.",
     "When work feeds all three, motivation becomes intrinsic: people do the work because they want to. Heavy external control, such as tight monitoring or a reward for every step, can crowd that intrinsic drive out.",
     "Think of what campus recruiters offer. Pay and perks speak to lower needs and hygiene factors. Learning, ownership and good colleagues speak to growth, motivators and self-determination."],
    qs:[
     ["A manager lets an experienced team choose how and when to work, as long as targets are met. Which need is she mainly feeding?",["Autonomy","Competence","Relatedness","Existence"],"Control over how work happens is autonomy."],
     ["A new hire gets training, stretch tasks matched to her level, and clear feedback that she's improving. Which need is fed?",["Competence","Autonomy","Relatedness","Power"],"She is becoming effective at her work."],
     ["A volunteer who loved organising events loses interest after the club starts paying per event and logging every hour. Self-determination theory says…",["External control crowded out intrinsic motivation","Pay is a hygiene factor","This is frustration–regression","She has a high need for power"],"Rewards and monitoring shifted her reason for doing the work."],
     ["Remote workers have high pay and full autonomy but feel isolated and flat. Which need is unmet?",["Relatedness","Competence","Autonomy","Existence"],"They lack close connection with others."]]}
  ]},
{ id:"M2", num:"VII", name:"The Clockwork Forge", topic:"Motivation · process theories",
  pal:{top:"#0c0c0f",bot:"#28201a",far:"#1c1915",near:"#2b241d",tile:"#0a0908",edge:"#b07a3e",acc:"#ffb36b",fog:"255,179,107"},
  card:["#2b241d","#0c0c0f","#ffb36b"],
  enemies:["Inequity","Vague Goal","Extinction","Low Valence","Doubt"],
  intro:[
    "The Clockwork Forge. Here Organa built the machinery of effort: goals, rewards, comparisons, and the shape of the jobs themselves.",
    "The Hunger Stair asked what moves people. The Forge asks how. By what process is effort chosen, kept, or given up?"],
  outro:"The seventh beacon burns. Set clear, hard goals. Build belief. Reward what you want repeated. Link effort to performance to reward. Keep it fair, and design jobs worth doing.",
  lessons:[
   {title:"Goals and Belief", lore:[
     "<strong>Goal-setting theory</strong> (Locke): <strong>specific, difficult</strong> goals, once accepted, beat 'do your best'. Its principles are <strong>clarity</strong>, <strong>challenge</strong>, <strong>commitment</strong>, <strong>feedback</strong> and attention to <strong>task complexity</strong>.",
     "<strong>Self-efficacy</strong> is your belief that you can do a task. It is built four ways: <strong>enactive mastery</strong> (succeeding yourself, the strongest source), <strong>vicarious experience</strong> (watching someone like you succeed), <strong>verbal persuasion</strong> (encouragement) and <strong>arousal</strong> (an energised emotional state).",
     "The two reinforce each other. A manager who sets a hard, specific goal signals confidence, which raises self-efficacy. People then set higher goals for themselves and perform better."],
    qs:[
     ["Which target best follows goal-setting theory?",["Raise qualified leads from 40 to 55 a month by March, with weekly progress reviews","Do your best on leads this quarter","Get a lot more leads","Be more proactive about leads"],"It's specific and challenging, and it comes with feedback."],
     ["A manager sets a stretch goal and then gives no progress updates for six months. Which principle is missing?",["Feedback","Clarity","Challenge","Task complexity"],"People need to know how they're tracking."],
     ["Before her first client pitch, an analyst watches a peer with a similar background nail one. Which source of self-efficacy is this?",["Vicarious experience","Enactive mastery","Verbal persuasion","Arousal"],"Seeing someone like you succeed builds belief."],
     ["What's the strongest way to build a new hire's confidence in presenting?",["Have her succeed at progressively harder presentations herself","Tell her she's a natural","Show her great TED talks","Get her excited just before"],"Enactive mastery is the most powerful source."]]},
   {title:"Consequences", lore:[
     "<strong>Reinforcement theory</strong> (Skinner): behaviour is a function of its consequences. What gets reinforced gets repeated.",
     "<strong>Positive reinforcement</strong> adds something pleasant after a behaviour. <strong>Negative reinforcement</strong> removes something unpleasant after it. Both <em>increase</em> the behaviour.",
     "<strong>Punishment</strong> adds something unpleasant, or takes away something pleasant, to <em>decrease</em> a behaviour. <strong>Extinction</strong> withholds all reinforcement, so the behaviour fades.",
     "Don't confuse them. Negative reinforcement is not punishment: 'negative' means something is <em>removed</em>, and the behaviour goes <em>up</em>."],
    qs:[
     ["A manager drops the daily check-in calls once a new hire starts filing reports on time, and on-time filing keeps rising. This is…",["Negative reinforcement","Positive reinforcement","Punishment","Extinction"],"Removing something unpleasant increased the behaviour."],
     ["A team member keeps cracking off-topic jokes in meetings. Everyone stops reacting at all, and the jokes fade. This is…",["Extinction","Punishment","Negative reinforcement","Positive reinforcement"],"Withholding all reinforcement let the behaviour die out."],
