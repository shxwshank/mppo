{ id:"M1", num:"VI", name:"The Hunger Stair", topic:"Motivation · content theories",
  pal:{top:"#07120a",bot:"#16301b",far:"#0f220f",near:"#173219",tile:"#060c06",edge:"#6fa35a",acc:"#b8f08a",fog:"184,240,138"},
  card:["#173219","#07120a","#b8f08a"],
  enemies:["Hygiene","Stagnation","Frustration","Apathy","Regression"],
  intro:[
    "The Hunger Stair. Every worker of Organa once climbed it, step by step, need by need.",
    "When the stair broke, people stopped asking what moved them. They only asked what they were owed.",
    "Learn what moves people, and you can move with them."],
  outro:"The sixth beacon burns. Motivated people are an organisation's key asset. Understand what motivates the people with you, and align what you offer with their needs.",
  lessons:[
   {title:"What Moves Us", lore:[
     "To <strong>motivate</strong> is to move, to activate. Motivation has three elements: <strong>direction</strong> (where effort goes), <strong>intensity</strong> (how hard one tries) and <strong>persistence</strong> (how long one keeps at it).",
     "It arises where three things meet: the <strong>person</strong>, the <strong>situation</strong> and the <strong>job itself</strong>.",
     "<strong>Content theories</strong> ask <em>what</em> motivates. They assume people have needs they pursue: Maslow, Alderfer, McClelland, Herzberg, Self-Determination.",
     "<strong>Process theories</strong> ask <em>how</em> motivation happens: people choose goals and how to reach them through a kind of calculation. These are goal setting, self-efficacy, reinforcement, expectancy, equity and job design."],
    qs:[
     ["An analyst works furiously on the right model for an hour, then abandons it at the first error. Which element of motivation is weakest?",["Persistence","Direction","Intensity","Valence"],"He worked hard (intensity) on the right task (direction), but didn't keep going."],
     ["A theory that asks 'which needs drive employees?' belongs to…",["Content theories","Process theories","Reinforcement theory","Equity theory"],"Content theories ask what motivates; process theories ask how."],
     ["A strong performer disengages after moving from a creative role to a repetitive one, with the same manager, team and pay. Which source of motivation changed most?",["The job itself","The person","The situation","Her pay"],"The person and her surroundings stayed the same; the work changed."]]},
   {title:"The Stair of Needs", lore:[
     "<strong>Maslow</strong> describes five levels, from the bottom: <strong>physiological</strong> (food, water, rest), <strong>safety</strong> (security), <strong>belongingness and love</strong> (relationships), <strong>esteem</strong> (prestige, accomplishment) and <strong>self-actualisation</strong> (reaching your full potential). A lower need must be largely met before the next one motivates.",
     "<strong>Alderfer's ERG</strong> compresses these into three. <strong>Existence</strong> covers physiological and safety needs. <strong>Relatedness</strong> covers social needs and the outward part of esteem. <strong>Growth</strong> covers inner esteem and self-actualisation.",
     "ERG differs in a key way: it makes <strong>no assumption that lower needs must be satisfied first</strong>, so several can operate at once. It also adds <strong>frustration–regression</strong>: when a higher need is blocked, people fall back on a lower one. Satisfaction–progression still moves them upward."],
    qs:[
     ["After a layoff scare, a designer who used to chase creative stretch projects now cares only about keeping her job. In Maslow's terms…",["An unmet safety need dominates again","She has self-actualised","Her esteem needs are fully met","Her growth need has strengthened"],"A threatened lower need takes priority again."],
     ["An engineer is repeatedly denied promotion and learning opportunities. He now pushes hard for a bigger bonus and spends more time socialising. Best explanation?",["ERG frustration–regression","Maslow's satisfaction–progression","Herzberg's hygiene factors","Need for power"],"His blocked growth need pushes him back toward existence and relatedness needs."],
     ["Which observation fits ERG but contradicts strict Maslow?",["A poorly paid artist is driven mainly by creative growth while still worried about rent","People always satisfy safety before belonging","Self-actualisation sits at the top","Physiological needs are most basic"],"ERG allows several needs to operate at once, without strict order."],
     ["A firm offers free meals, health insurance and job security. In ERG terms these mainly address…",["Existence needs","Relatedness needs","Growth needs","Need for achievement"],"Existence covers physiological and safety needs."]]},
   {title:"Three Hungers", lore:[
     "<strong>McClelland</strong> argues that needs are <em>acquired</em> through life experience. Three matter at work.",
     "<strong>Need for achievement (nAch)</strong>: the drive to excel against a standard. High achievers like personal responsibility, quick feedback and moderately difficult goals.",
     "<strong>Need for affiliation (nAff)</strong>: the desire for friendly, close relationships. <strong>Need for power (nPow)</strong>: the need to make others behave in ways they otherwise would not.",
     "Match roles to needs. A high-nAch star can be a superb individual contributor without being a natural manager, a role where influence (power) matters more."],
    qs:[
     ["A sales rep tracks her numbers against last quarter, wants weekly feedback, and prefers targets that are hard but reachable. Dominant need?",["Need for achievement","Need for affiliation","Need for power","Existence"],"Standards, feedback and moderately hard goals are the high-nAch profile."],
     ["A team member turns down a promotion because he'd have to manage his friends and lose his place in the team's social life. Dominant need?",["Need for affiliation","Need for achievement","Need for power","Esteem"],"Close relationships matter more to him than status."],
     ["A manager loves shaping decisions, persuading the leadership team and controlling which projects get funded. Dominant need?",["Need for power","Need for affiliation","Need for achievement","Safety"],"She wants to influence what others do."],
     ["A top individual coder is promoted to lead a team and struggles. McClelland would say…",["A high need for achievement doesn't guarantee the influence a manager role needs","He needs more pay","His hygiene factors were removed","His existence needs are unmet"],"Achievement drives personal excellence; managing others draws on power and influence."]]},
   {title:"The Two Ledgers", lore:[
     "<strong>Herzberg</strong> split the traditional single scale in two. Satisfaction and dissatisfaction are <strong>not opposites</strong>.",
     "<strong>Hygiene factors</strong> are extrinsic: company policy, supervision, salary, relationships with peers, working conditions, workspace, status and security. Getting them right yields <strong>no dissatisfaction</strong>. It does not yield motivation.",
     "<strong>Motivators</strong> are intrinsic: achievement, recognition, the work itself, responsibility, advancement and growth. They create <strong>satisfaction</strong>. Without them you get 'no satisfaction', not dissatisfaction.",
     "So remove dissatisfaction with hygiene, and build motivation with motivators. Hygiene maps to Maslow's lower needs; motivators map to esteem and self-actualisation."],
    qs:[
     ["A company raises salaries and renovates the office. Complaints fall, but engagement doesn't rise. Herzberg would say…",["Hygiene factors removed dissatisfaction but cannot create motivation","Pay is a motivator, so engagement will follow","The office is a motivator","Satisfaction and dissatisfaction are one scale"],"Hygiene factors only take you to 'no dissatisfaction'."],
     ["Which change is most likely to genuinely motivate a bored analyst, per Herzberg?",["Ownership of a client project, with recognition for results","A better chair and air-conditioning","A clearer leave policy","Friendlier supervision"],"Responsibility and recognition are motivators; the rest are hygiene factors."],
     ["A demotivated team has below-market pay and a cramped office, and people also feel unrecognised. What's the Herzberg-consistent priority?",["Fix pay and conditions to remove dissatisfaction, then add recognition and growth to motivate","Only add recognition; pay doesn't matter","Only raise pay; it will motivate","Only rewrite company policies"],"The two factors work on different scales, so you need both."],
     ["Staff grumble about an unfair leave policy and a micromanaging supervisor. These complaints concern…",["Hygiene factors","Motivators","Growth needs","Need for achievement"],"Policy and supervision are extrinsic hygiene factors."]]},
   {title:"Self-Determination", lore:[
     "<strong>Self-determination theory</strong> names three basic human needs. <strong>Competence</strong>: being effective in dealing with your environment. <strong>Autonomy</strong>: control over the course of your life. <strong>Relatedness</strong>: close, affectionate relationships with others.",
     "When work feeds all three, motivation becomes intrinsic: people do the work because they want to. Heavy external control, such as tight monitoring or a reward for every step, can crowd that intrinsic drive out.",
     "Think of what campus recruiters offer. Pay and perks speak to lower needs and hygiene factors. Learning, ownership and good colleagues speak to growth, motivators and self-determination."],
    qs:[
     ["A manager lets an experienced team choose how and when to work, as long as targets are met. Which need is she mainly feeding?",["Autonomy","Competence","Relatedness","Existence"],"Control over how work happens is autonomy."],
     ["A new hire gets training, stretch tasks matched to her level, and clear feedback that she's improving. Which need is fed?",["Competence","Autonomy","Relatedness","Power"],"She is becoming effective at her work."],
     ["A volunteer who loved organising events loses interest after the club starts paying per event and logging every hour. Self-determination theory says…",["External control crowded out intrinsic motivation","Pay is a hygiene factor","This is frustration–regression","She has a high need for power"],"Rewards and monitoring shifted her reason for doing the work."],
     ["Remote workers have high pay and full autonomy but feel isolated and flat. Which need is unmet?",["Relatedness","Competence","Autonomy","Existence"],"They lack close connection with others."]]}
  ]},
{ id:"M2", num:"VII", name:"The Clockwork Forge", topic:"Motivation · process theories",
  pal:{top:"#0c0c0f",bot:"#28201a",far:"#1c1915",near:"#2b241d",tile:"#0a0908",edge:"#b07a3e",acc:"#ffb36b",fog:"255,179,107"},
  card:["#2b241d","#0c0c0f","#ffb36b"],
  enemies:["Inequity","Vague Goal","Extinction","Low Valence","Doubt"],
  intro:[
    "The Clockwork Forge. Here Organa built the machinery of effort: goals, rewards, comparisons, and the shape of the jobs themselves.",
    "The Hunger Stair asked what moves people. The Forge asks how. By what process is effort chosen, kept, or given up?"],
  outro:"The seventh beacon burns. Set clear, hard goals. Build belief. Reward what you want repeated. Link effort to performance to reward. Keep it fair, and design jobs worth doing.",
  lessons:[
   {title:"Goals and Belief", lore:[
     "<strong>Goal-setting theory</strong> (Locke): <strong>specific, difficult</strong> goals, once accepted, beat 'do your best'. Its principles are <strong>clarity</strong>, <strong>challenge</strong>, <strong>commitment</strong>, <strong>feedback</strong> and attention to <strong>task complexity</strong>.",
     "<strong>Self-efficacy</strong> is your belief that you can do a task. It is built four ways: <strong>enactive mastery</strong> (succeeding yourself, the strongest source), <strong>vicarious experience</strong> (watching someone like you succeed), <strong>verbal persuasion</strong> (encouragement) and <strong>arousal</strong> (an energised emotional state).",
     "The two reinforce each other. A manager who sets a hard, specific goal signals confidence, which raises self-efficacy. People then set higher goals for themselves and perform better."],
    qs:[
     ["Which target best follows goal-setting theory?",["Raise qualified leads from 40 to 55 a month by March, with weekly progress reviews","Do your best on leads this quarter","Get a lot more leads","Be more proactive about leads"],"It's specific and challenging, and it comes with feedback."],
     ["A manager sets a stretch goal and then gives no progress updates for six months. Which principle is missing?",["Feedback","Clarity","Challenge","Task complexity"],"People need to know how they're tracking."],
     ["Before her first client pitch, an analyst watches a peer with a similar background nail one. Which source of self-efficacy is this?",["Vicarious experience","Enactive mastery","Verbal persuasion","Arousal"],"Seeing someone like you succeed builds belief."],
     ["What's the strongest way to build a new hire's confidence in presenting?",["Have her succeed at progressively harder presentations herself","Tell her she's a natural","Show her great TED talks","Get her excited just before"],"Enactive mastery is the most powerful source."]]},
   {title:"Consequences", lore:[
     "<strong>Reinforcement theory</strong> (Skinner): behaviour is a function of its consequences. What gets reinforced gets repeated.",
     "<strong>Positive reinforcement</strong> adds something pleasant after a behaviour. <strong>Negative reinforcement</strong> removes something unpleasant after it. Both <em>increase</em> the behaviour.",
     "<strong>Punishment</strong> adds something unpleasant, or takes away something pleasant, to <em>decrease</em> a behaviour. <strong>Extinction</strong> withholds all reinforcement, so the behaviour fades.",
     "Don't confuse them. Negative reinforcement is not punishment: 'negative' means something is <em>removed</em>, and the behaviour goes <em>up</em>."],
    qs:[
     ["A manager drops the daily check-in calls once a new hire starts filing reports on time, and on-time filing keeps rising. This is…",["Negative reinforcement","Positive reinforcement","Punishment","Extinction"],"Removing something unpleasant increased the behaviour."],
     ["A team member keeps cracking off-topic jokes in meetings. Everyone stops reacting at all, and the jokes fade. This is…",["Extinction","Punishment","Negative reinforcement","Positive reinforcement"],"Withholding all reinforcement let the behaviour die out."],
     ["An employee who files expenses late has her reimbursement held for a month, to cut late filing. This is…",["Punishment","Negative reinforcement","Extinction","Positive reinforcement"],"Taking away something pleasant to reduce a behaviour is punishment."],
     ["A sales team gets a spot bonus right after every closed deal, and closing rises. This is…",["Positive reinforcement","Negative reinforcement","Extinction","Punishment"],"Adding something pleasant increased the behaviour."]]},
   {title:"The Three Links", lore:[
     "<strong>Expectancy theory</strong> (Vroom) assumes people consciously choose among alternatives to maximise pleasure and minimise pain.",
     "Motivation = <strong>Expectancy × Instrumentality × Valence</strong>. <strong>Expectancy</strong> (effort → performance): can I hit the target if I work hard? <strong>Instrumentality</strong> (performance → reward): will hitting it get me the reward? <strong>Valence</strong>: do I actually want that reward?",
     "The terms <strong>multiply</strong>, so if any one is near zero, motivation collapses, however strong the others."],
    qs:[
     ["Targets were raised so high that no one believes they can be hit, even with maximum effort. Which link is broken?",["Expectancy","Instrumentality","Valence","Equity"],"The effort-to-performance belief has gone."],
     ["Last year's promised bonus for top performers was quietly cancelled. This year effort is down. Which link broke?",["Instrumentality","Expectancy","Valence","Self-efficacy"],"Performance no longer leads to the reward."],
     ["Top performers win an all-expenses-paid offsite abroad. For an employee who hates travel and has young kids, motivation stays low. Which term is near zero?",["Valence","Expectancy","Instrumentality","Equity"],"He doesn't value the reward."],
     ["Expectancy is high and the reward is attractive, but promotions are seen as decided by politics, not performance. Predicted motivation?",["Low, because instrumentality is near zero and the terms multiply","High, because two of three are strong","Moderate, the average of the three","Unaffected; only valence matters"],"A zero in a product makes the whole product zero."]]},
   {title:"The Scales of Fairness", lore:[
     "We are social beings, and we compare. <strong>Adams' equity theory</strong>: people compare their own <strong>outcome-to-input ratio</strong> with a referent's. The fairer it seems, the more motivated they are.",
     "If someone is underpaid relative to a peer doing the same job, they may cut effort, ask for more, reinterpret the comparison, switch referents, or leave, all to restore balance.",
     "<strong>Organisational justice</strong> has three parts. <strong>Distributive</strong> justice is the fairness of outcomes (equity, equality, need), and it drives outcome satisfaction. <strong>Procedural</strong> justice is the fairness of the policies and processes used, and it drives system satisfaction. <strong>Interactional</strong> justice is respectful, dignified treatment, and it drives relationship satisfaction.",
     "In practice, pay bands rest on equity theory, and codes of conduct rest on organisational justice."],
    qs:[
     ["Riya learns a new hire doing exactly her job earns 20% more. She starts leaving on time and stops volunteering for extra work. Best explanation?",["Equity theory","Reinforcement theory","Goal setting","ERG"],"She is restoring balance by reducing her inputs."],
     ["Two employees get the same small raise. One is told in a respectful meeting with clear reasons; the other learns it from a curt email and is far angrier. Which justice is at stake?",["Interactional","Distributive","Procedural","Equity of inputs"],"The outcome is the same; the treatment differs."],
     ["Staff accept a disappointing bonus because the criteria were transparent, applied consistently, and open to appeal. This reflects…",["Procedural justice","Distributive justice","Interactional justice","Valence"],"A fair process makes a poor outcome easier to accept."],
     ["A promotion goes to the manager's friend over a clearly stronger candidate. Staff object that the result itself is unfair. Which justice?",["Distributive","Procedural","Interactional","Instrumentality"],"The objection is to the fairness of the outcome."]]},
   {title:"The Shape of the Work", lore:[
     "Some jobs are inherently more motivating. The <strong>Job Characteristics Model</strong> names five core characteristics.",
     "<strong>Skill variety</strong>, <strong>task identity</strong> (doing a whole, identifiable piece of work) and <strong>task significance</strong> (impact on others) create <strong>experienced meaningfulness</strong>. <strong>Autonomy</strong> creates <strong>experienced responsibility</strong> for outcomes. <strong>Feedback</strong> from the job gives <strong>knowledge of actual results</strong>.",
     "Those states lead to high internal motivation, high-quality work, high satisfaction, and low absenteeism and turnover. Individual differences moderate the effect: knowledge and skill, <strong>growth need strength</strong>, and satisfaction with the context.",
     "Compare a primary school teacher (high significance, variety and autonomy) with a quick-commerce delivery rider (little variety, little autonomy, a tightly scripted job)."],
    qs:[
     ["A loan officer checks one form in a 12-step process and never learns whether loans are approved. Which characteristics are weakest?",["Task identity and feedback","Only skill variety","Only task significance","Growth need strength"],"He never does a whole piece of work, and he never sees the results."],
     ["Which change most raises a delivery rider's experienced responsibility for outcomes?",["Letting him plan his own routes and schedule","A public leaderboard","A talk on the company mission","More types of parcels"],"Autonomy drives experienced responsibility."],
     ["Job enrichment energises some employees but barely moves others. The model explains this with…",["Growth need strength, a moderator","Hygiene factors","Instrumentality","Self-serving bias"],"Enrichment works best for people with strong growth needs."],
     ["Which job scores highest on task significance?",["A paediatric nurse","A data-entry clerk","A warehouse packer","A night-shift security guard at a quiet site"],"The nurse's work directly affects others' lives."]]}
  ]},
{ id:"CF", num:"VIII", name:"The Fractured Span", topic:"Conflict",
  pal:{top:"#110810",bot:"#2c1424",far:"#200e1a",near:"#301a29",tile:"#0c060a",edge:"#a85a86",acc:"#ff9ad5",fog:"255,154,213"},
  card:["#301a29","#110810","#ff9ad5"],
  enemies:["Avoidance","Escalation","Hostility","Rivalry","Ultimatum"],
  intro:[
    "The Fractured Span. A great bridge once joined Organa's two halves. Now it hangs in pieces, and each side is certain the other broke it.",
    "Conflict is not the enemy. Unmanaged conflict is. Learn when to stir it, how to read it, and how to mend it."],
  outro:"The eighth beacon burns. Let go of needing to be liked. Keep the big picture in view. Don't confuse disagreement with unkindness.",
  lessons:[
   {title:"Three Views", lore:[
     "<strong>Conflict</strong> is a process that begins when one party perceives that another has negatively affected, or is about to negatively affect, something the first party cares about.",
     "There are three views. <strong>Traditional</strong>: conflict is bad and should be avoided. <strong>Behavioural</strong>: conflict is natural and unavoidable, and it may even help. <strong>Interactionist</strong>: encourage a <strong>minimum desirable level</strong> of conflict to keep a group vibrant, self-critical and creative.",
     "Performance traces an inverted U. Too little conflict (point A) brings apathy and stagnation. An optimal level (B) brings peak performance. Too much (C) brings chaos.",
     "<strong>Functional</strong> conflict supports the group's goals and improves performance. <strong>Dysfunctional</strong> conflict hinders it."],
    qs:[
     ["A leadership team agrees on everything, nobody has challenged a decision in a year, and market share is slipping. An interactionist would say…",["Conflict is below the optimal level, so stimulate constructive debate","Perfect, because conflict is bad","They're at the optimal point","Conflict is unavoidable, so do nothing"],"Too little conflict sits at the left of the inverted U."],
     ["Two designers argue hard over which prototype better meets users' needs, and the final product improves. This conflict is…",["Functional","Dysfunctional","Annihilatory","Status conflict"],"It served the group's goal and improved performance."],
     ["A manager treats every disagreement as a sign of poor leadership and shuts debate down. Which view does he hold?",["Traditional","Behavioural","Interactionist","Integrative"],"The traditional view says conflict is bad and should be avoided."]]},
   {title:"Kinds of Conflict", lore:[
     "By content: <strong>task</strong> conflict is over the content and goals of the work. <strong>Relationship</strong> conflict is interpersonal. <strong>Process</strong> conflict is over how work gets done. <strong>Status</strong> conflict is over who does it and who ranks where.",
     "Low-to-moderate task conflict can be functional. Relationship conflict is almost always dysfunctional, because it breeds hostility and erodes trust.",
     "By locus: <strong>dyadic</strong> conflict is between two people, <strong>intragroup</strong> conflict is within a team, and <strong>intergroup</strong> conflict is between teams or groups."],
    qs:[
     ["Two analysts agree on the goal but clash over weekly sprints versus one big deadline. This is…",["Process conflict","Task conflict","Relationship conflict","Status conflict"],"It's about how the work gets done."],
     ["Two managers can't sit in the same meeting because of personal dislike, and their teams are taking sides. This is…",["Relationship conflict, likely dysfunctional","Task conflict, likely functional","Process conflict","Status conflict only"],"Interpersonal hostility rarely helps performance."],
     ["In the Jugaad case, Boston and Mumbai engineers blame each other for missed deadlines. By locus this is…",["Intergroup","Dyadic","Intrapersonal","Intragroup only"],"It runs between two groups at different sites."],
     ["A senior engineer is furious that a junior was chosen to present the team's work to the client. This is mainly…",["Status conflict","Task conflict","Process conflict","Functional conflict"],"It's about who gets to do the work, and rank."]]},
   {title:"Roots and Signs", lore:[
     "<strong>Causes</strong> of conflict: differing task goals, differing process goals, interpersonal differences, resource constraints, change, differing values, poor communication and <strong>task interdependence</strong>.",
     "<strong>Symptoms</strong>: poor communication, intergroup hostility and jealousy, interpersonal friction, escalation to arbitration, a proliferation of rules and regulations, and low morale.",
     "The <strong>conflict process</strong> has five stages: (1) potential opposition or incompatibility, arising from communication, structure or personal variables; (2) cognition and personalisation, where conflict is perceived and felt; (3) intentions; (4) behaviour; (5) outcomes, which can mean better or worse group performance.",
     "<strong>Intensity</strong> runs from minor misunderstandings, through overt questioning, assertive verbal attacks, and threats and ultimatums, up to physical attacks and efforts to destroy the other party, which is <strong>annihilatory conflict</strong>."],
    qs:[
     ["Two departments share one data team, and they fight over its time every quarter. The root cause is mainly…",["Resource constraints, with task interdependence","Differing values","Change","Personality"],"Scarce shared resources plus dependence on each other create conflict."],
     ["In one division every dispute now goes to HR for a ruling, and new rules keep being added to stop repeats. These are…",["Symptoms: escalation to arbitration and a proliferation of rules","Causes of conflict","Signs of functional conflict","Outcomes of collaboration"],"Both appear on the list of symptoms."],
     ["Two colleagues feel tense and anxious about each other but haven't acted on it yet. Which stage of the conflict process are they in?",["Cognition and personalisation (felt conflict)","Behaviour","Outcomes","Intentions already acted on"],"The conflict is perceived and felt, but not yet acted on."],
     ["A disagreement goes from 'Could you explain your numbers?' to 'Fix it by Friday or I go to the CEO.' On the intensity continuum it moved from…",["Overt questioning to threats and ultimatums","No conflict to annihilatory conflict","Assertive attacks to minor misunderstandings","Physical attacks to questioning"],"It escalated two rungs up the scale."]]},
   {title:"The Five Animals", lore:[
     "Conflict-handling intentions sit on two axes: how much your own needs matter, and how much the relationship matters.",
     "The <strong>shark competes</strong>: my needs matter and the relationship doesn't. The <strong>owl collaborates</strong>: both matter, so find a solution that fully satisfies both. The <strong>fox compromises</strong>: each side gives something up. The <strong>turtle avoids</strong>: it withdraws. The <strong>teddy bear accommodates</strong>: the relationship comes first, so it gives way.",
     "Culture shapes conflict too. Hofstede calls culture 'the collective programming of the mind'. His dimensions are <strong>power distance</strong>, <strong>uncertainty avoidance</strong>, <strong>individualism–collectivism</strong> and <strong>masculinity–femininity</strong>, later joined by <strong>long-term orientation</strong> and <strong>indulgence–restraint</strong>. India scores higher than the USA on power distance (77 vs 40) and long-term orientation (51 vs 26). The USA is far more individualist (91 vs 48) and indulgent (68 vs 26).",
     "In the <strong>Jugaad case</strong>, Boston feels that Mumbai hides bad news and misses deadlines. Mumbai feels disrespected, buried in requests it never agreed to, and addressed too casually. Beneath this lie differences in power distance and communication style, plus a work split that cut Mumbai off from the client."],
    qs:[
     ["A manager works with two feuding leads to find a solution that fully meets each one's core needs, even though it takes longer. This intention is…",["Collaborating (owl)","Compromising (fox)","Accommodating (teddy bear)","Competing (shark)"],"Both sides' needs and the relationship are kept whole."],
     ["To protect a key client relationship, a manager concedes a point he cares little about. This is…",["Accommodating (teddy bear)","Avoiding (turtle)","Competing (shark)","Collaborating (owl)"],"He put the relationship above his own need."],
     ["Mumbai engineers rarely flag bad news directly to Boston, and they expect seniors to be addressed as 'sir'. Which Hofstede dimension best explains this?",["Higher power distance in India","Higher indulgence in India","Masculinity","Lower long-term orientation in India"],"Deference to hierarchy shapes how bad news travels."],
     ["What is the deepest structural cause of the Boston–Mumbai conflict in the Jugaad case?",["The work split kept Mumbai away from clients while Boston passed on requests and deadlines Mumbai never agreed to","Mumbai engineers were less qualified","Boston had too few engineers","The suggestion box"],"The structure created task interdependence without shared ownership. The case notes that Mumbai's engineers were the more qualified."]]},
   {title:"Mending", lore:[
     "Resolution techniques: <strong>problem solving</strong> (meet face to face and openly work it through); <strong>superordinate goals</strong> (a shared goal neither side can reach alone); <strong>expansion of resources</strong> (grow the scarce thing); <strong>avoidance</strong> (withdraw or suppress); <strong>smoothing</strong> (play down differences and stress common interests); <strong>compromise</strong> (each side gives up something of value).",
     "Also: <strong>authoritative command</strong> (management decides, using formal authority); <strong>altering the human variable</strong> (training to change attitudes and behaviour); and <strong>altering structural variables</strong> (job redesign, transfers, coordinating roles).",
     "Managed well, conflict brings better work, chances to learn and grow, better relationships, higher job satisfaction and a more inclusive workplace (Gallo, HBR 2018). Her advice: let go of needing to be liked, focus on the big picture, don't equate disagreement with unkindness, and find a role model."],
    qs:[
     ["Sales and operations keep fighting over delivery promises. The CEO sets a joint target, 'zero missed customer deadlines this quarter', that neither can hit alone. This technique is…",["Superordinate goals","Smoothing","Authoritative command","Expansion of resources"],"A shared goal that requires cooperation."],
     ["Two teams fight over one shared meeting room, so the company leases a second. This is…",["Expansion of resources","Compromise","Avoidance","Problem solving"],"The scarce resource grew."],
     ["Which resolution in the Jugaad case tackles the structure that caused the conflict?",["Create a liaison role and give Mumbai client contact and a say in deadlines","Tell both sides to get along","Wait until the project ends","Let Boston decide everything"],"This alters structural variables, which removes the root cause."],
     ["A manager keeps saying, 'Let's focus on what we agree on,' and never addresses the real disagreement. This is…",["Smoothing","Problem solving","A superordinate goal","Collaborating"],"It plays down differences instead of resolving them."],
     ["A new manager avoids disagreeing with her team because she wants to be liked. Gallo's advice is to…",["Let go of needing to be liked, and don't equate disagreement with unkindness","Avoid conflict until trust is built","Use authoritative command","Agree in public and disagree in private"],"Disagreement handled well is not unkind."]]}
  ]},
{ id:"NG", num:"IX", name:"The Bargain Market", topic:"Negotiation",
  pal:{top:"#0a0e15",bot:"#1c2638",far:"#141c2b",near:"#1f2a3e",tile:"#070a10",edge:"#c79a4b",acc:"#ffd27a",fog:"255,210,122"},
  card:["#1f2a3e","#0a0e15","#ffd27a"],
  enemies:["Fixed Pie","Anchor","Bluff","Lowball","Positional"],
  intro:[
    "The Bargain Market. Every stall in Organa once traded here. Now each merchant guards a fixed pie and trusts no one.",
    "Negotiation is a process in which parties exchange goods or services and try to agree on the rate of exchange. See the real pie, and you will never fight over the wrong one."],
  outro:"The ninth beacon burns. Focus on interests, not positions. Create value before you claim it. And remember: effective negotiation is about beating your fallback.",
  lessons:[
   {title:"The Five Steps", lore:[
     "Negotiation has five steps: <strong>preparation and planning</strong>, <strong>definition of ground rules</strong>, <strong>clarification and justification</strong>, <strong>bargaining and problem solving</strong>, and <strong>closure and implementation</strong>.",
     "Why did the jacket deals vary so much between pairs? Because of anchoring, opening offers and how people responded to them, aspirations, how concessions were made, framing, justification, how information was gathered, and lies and deception. Outcomes depend on skill plus strategy."],
    qs:[
     ["Before a salary talk, a candidate researches market pay, lists her alternatives and sets her walk-away number. Which step is she in?",["Preparation and planning","Clarification and justification","Bargaining and problem solving","Closure and implementation"],"All of this happens before the negotiation starts."],
     ["Two buyers negotiate for the same jacket from the same seller. One aims high and opens first with a well-justified price; the other just asks, 'What's your best price?' The first pays far less. What mainly explains the gap?",["Aspirations, anchoring and justification","Luck","The seller's BATNA changed","Integrative bargaining"],"These are the variance drivers from the jacket exercise."],
     ["After agreeing a vendor contract, the team spells out who delivers what, by when, and how disputes will be handled. Which step?",["Closure and implementation","Definition of ground rules","Preparation","Clarification"],"The deal is formalised and put into practice."]]},
   {title:"Walk-Away", lore:[
     "<strong>BATNA</strong> stands for Best Alternative To a Negotiated Agreement: what you'll do if there's no deal. Assessing it is the <strong>first step</strong>. List your alternatives, value each one, and the best becomes your BATNA.",
     "Your <strong>reservation value</strong> (walk-away or resistance point) comes from your BATNA, your reality if there's no deal. It is not what you aspire to, not what feels fair, and not set by sunk costs.",
     "The <strong>ZOPA</strong> (zone of possible agreement, or settlement range) covers every deal between the two sides' resistance points. If the seller's minimum is above the buyer's maximum, there is no ZOPA. Each side also has a <strong>target point</strong>: its aspiration.",
     "Knowing your own BATNA stops you accepting a bad deal or walking away from a good one. Estimating <em>theirs</em> tells you how far you can push."],
    qs:[
     ["You hold a ₹20L offer and are negotiating with a second firm. Your reservation value with the second firm should rest on…",["The value of the ₹20L offer, your BATNA","What feels fair","What your MBA cost","Your dream salary"],"Your walk-away point is your reality without this deal."],
     ["The seller won't go below ₹50,000 and the buyer can't go above ₹62,000. The ZOPA is…",["₹50,000 to ₹62,000","₹0 to ₹50,000","Above ₹62,000","There is none"],"It's every deal between the two resistance points."],
     ["The seller's minimum is ₹70,000 and the buyer's maximum is ₹62,000, with nothing else on the table. What should happen?",["No ZOPA exists, so both should take their BATNAs","Split the difference at ₹66,000","The buyer must pay ₹70,000","Anchor harder"],"With no overlap, any deal leaves one side worse off than walking away."],
     ["A supplier keeps pressing you because it knows no other vendor can deliver in time. What is it exploiting?",["Your weak BATNA","Its own reservation value","Integrative potential","Your target point"],"A poor alternative limits how far you can push back."]]},
   {title:"Claiming", lore:[
     "<strong>Distributive</strong> bargaining divides a fixed pie. It is win–lose, focused on positions ('I can't go beyond this'), with opposed interests, little information sharing and a short-term relationship.",
     "<strong>Integrative</strong> bargaining expands the pie so both sides are satisfied. It is win–win, focused on interests ('Can you explain why this matters to you?'), with congruent interests, a lot of information sharing and a long-term relationship.",
     "Skilled negotiators sequence the two. First <strong>clarify needs</strong>, <strong>articulate interests</strong> rather than positions, and <strong>avoid early compromise</strong>. Then <strong>set high goals</strong>, and <strong>slice the pie</strong> with progressively smaller concessions.",
     "First offers anchor. If you make one, base it on the ZOPA and your aspirations, justify it, and mind the relationship. Faced with an aggressive offer, ignore it, ask for justification, or counter. Faced with a generous one, accept, counter, or ask why."],
    qs:[
     ["A one-time buyer at a flea market haggles only on price, reveals nothing about why he wants the item, and will never see the seller again. This is…",["Distributive bargaining","Integrative bargaining","Collaborating","A superordinate goal"],"Fixed pie, positions, no information shared, short term."],
     ["A firm cares most about delivery speed and its supplier about volume certainty. They sign a longer contract with faster delivery. This is…",["Integrative bargaining","Distributive bargaining","Compromise","Avoiding"],"Each side's interests were met, so the pie grew."],
     ["A recruiter opens a salary talk with an unexpectedly aggressive low offer. A sensible response is to…",["Avoid anchoring on it: ask for justification, or counter with your own justified number","Accept fast before it gets worse","Split the difference with your target","Walk out immediately"],"Don't let an extreme anchor set the range."],
     ["Why should integrative negotiators avoid compromising early?",["Early compromise often leaves value on the table before both sides' interests are understood","Compromise is always unethical","It weakens their BATNA","It creates a ZOPA"],"Explore interests first; then slice the pie."]]},
   {title:"Pitfalls", lore:[
     "Common pitfalls: <strong>premature judgement</strong>, <strong>searching for a single answer</strong>, <strong>assuming a fixed pie</strong>, and <strong>thinking that solving their problem is their problem</strong>.",
     "Individual differences shape outcomes too: personality, moods and emotions, cultural differences and gender.",
     "From <em>Getting to Yes</em>: craft agreements by focusing on <strong>interests, not positions</strong>. A position is what someone says they want; an interest is why they want it.",
     "Two siblings fight over one orange and cut it in half. One wanted the juice, the other only the peel for baking. They assumed a fixed pie and never asked about interests."],
    qs:[
     ["A buyer insists on a 15% price cut. Asked why, she explains that her real problem is cash flow this quarter. The seller offers 90-day payment terms at full price, and she agrees. What happened?",["Moving from her position to her interest unlocked a better deal","Distributive bargaining","The seller lowered his reservation value","Anchoring"],"Interests, not positions."],
     ["A negotiator thinks, 'Their budget-approval problem isn't my concern.' Which pitfall is this?",["Thinking that solving their problem is their problem","Premature judgement","Searching for a single answer","Fixed pie"],"Helping them solve their problem can make the deal possible."],
     ["Management walks into wage talks sure that any gain for the union must be a loss for the company. Which pitfall?",["Assuming a fixed pie","Searching for a single answer","Premature judgement","Lies and deception"],"It blinds them to trades that could create value for both sides."]]},
   {title:"Split the Pie", lore:[
     "Nalebuff and Brandenburger (HBR, 2021): the <strong>pie</strong> is not the total value. It is the <strong>extra value created by agreeing</strong>, over and above the sum of both sides' BATNAs.",
     "Both sides are <strong>equally essential</strong> to that pie: without either one, it vanishes. So it should be <strong>split equally</strong>, whatever each side's size or fallback. Each side gets its BATNA plus half the pie.",
     "Take a pizza. Without a deal, Alice gets 4 slices and Bob 2. Together they get 12. The pie is 12 − 6 = 6, so Alice gets 4 + 3 = <strong>7</strong> and Bob 2 + 3 = <strong>5</strong>. Not 8:4 (the power view), and not 6:6 (the naive fairness view).",
     "Splitting in proportion to size, as in a merger of equals, is wrong, and so is splitting the difference between a fair offer and an unfair one: halfway between unfair and fair is still unfair. If the pie's size is uncertain, split it as it's created, per unit. Caring more doesn't change the split. Effective negotiation is about <strong>beating your fallback</strong>."],
    qs:[
     ["Anju can earn $50 on her own and Bharat $400. Pooled, they earn $750. Under the split-the-pie principle, Anju should get…",["$200","$150","$375","$50"],"Pie = 750 − 450 = 300. Anju gets 50 + 150 = 200; Bharat gets 400 + 150 = 550."],
     ["Firm A (worth 60) and Firm B (worth 40) merge, creating 30 in synergies. A banker proposes splitting the synergies 60:40. Nalebuff would say…",["Split them 15:15, because both firms are equally needed to create them","60:40 is fair because A is bigger","A deserves all of it","Split by headcount"],"Either side walking away kills the whole 30."],
     ["A giant beverage firm can cut a start-up's bottle cost from 19¢ to 11¢, but future volume is uncertain. How should they split the savings?",["Price at 15¢ a bottle, so each gains 4¢ whatever the volume","11¢, because the giant has more power","Keep it at 19¢","Make one payment based on a volume guess"],"Splitting per unit handles the uncertainty."],
     ["One side offers a fair split, the other an unfair one, and someone suggests meeting in the middle. The article's answer is…",["Halfway between unfair and fair is still unfair","Meeting in the middle is always fair","The larger party should decide","Whoever cares less should get more"],"Anju rejected Bharat's split-the-difference offer of $175 for exactly this reason."]]}
  ]},
{ id:"GT", num:"X", name:"The Desert of Many", topic:"Groups & teams",
  pal:{top:"#130b0b",bot:"#33201b",far:"#261613",near:"#3a241e",tile:"#100807",edge:"#d08a6a",acc:"#ffc2a1",fog:"255,194,161"},

  intro:[

    "Teams don't happen. They need to be made to happen."],
  outro:"The tenth beacon burns, and all of Organa glows. People, performance, motivation, conflict, negotiation and teams: none of it is random. Understand it, design for it, and lead. Your quiz awaits.",
  lessons:[
   {title:"The Desert Trial", lore:[
     "In the Desert Survival exercise, members ranked 15 items alone, then agreed on one group ranking by consensus, with no voting, and compared both against an expert's ranking.",
     "The expert's logic: <strong>stay put and get found</strong>, and protect yourself from heat and dehydration. So the cosmetic mirror (for signalling) and the top coats (to slow water loss) rank highest, and the water third. The pistol, compass and air map matter far less.",
     "The lessons: teams usually reach better decisions than individuals; <strong>influence</strong> is key to team effectiveness; teams run on interpersonal processes (communication, influence, conflict resolution and negotiation); and each member plays a different role.",
     "Team roles include the <strong>creator</strong> (initiates ideas), <strong>promoter</strong> (champions them), <strong>assessor</strong> (analyses options), <strong>organiser</strong> (provides structure), <strong>producer</strong> (provides direction and follow-through), <strong>controller</strong> (checks details and enforces rules), <strong>maintainer</strong> (fights external battles), <strong>adviser</strong> (encourages the search for more information) and <strong>linker</strong> (coordinates and integrates)."],
    qs:[
     ["In the desert exercise, a team's consensus ranking lands closer to the expert's than most members' individual rankings. This shows…",["Teams often decide better by integrating diverse information","Social loafing","Groupthink","Process losses"],"Pooling information beats most individuals."],
     ["One member keeps urging the group to dig for more information before deciding. Which team role is this?",["Adviser","Controller","Promoter","Producer"],"The adviser encourages the search for more information."],
     ["A member makes sure the plan gets carried out on time and chases every action item. Which role?",["Producer","Creator","Assessor","Linker"],"The producer provides direction and follow-through."],
     ["Why does the expert rank the cosmetic mirror first?",["Signalling for rescue matters most, because the strategy is to stay put and get found","It's lightweight","To check for sunburn","To start a cooking fire"],"Being found fast is what saves lives."]]},
   {title:"Synergy", lore:[
     "<strong>Actual group effectiveness = potential effectiveness + process gains − process losses.</strong> Positive synergy means the team does better than any of its individuals.",
     "Synergy comes from integrating information from diverse views, complementary skills, and open communication with active listening.",
     "Process losses come from conflict, withdrawal, disengagement, a lack of psychological safety, groupthink and social loafing. Manage these and the whole becomes greater than the sum of its parts."],
    qs:[
     ["A team of five stars underperforms its best individual, because members talk over each other and quiet experts are never heard. In synergy terms…",["Process losses exceeded process gains","Potential effectiveness was low","This is positive synergy","This is social facilitation"],"Talent was there; the process wasted it."],
     ["Which change most directly creates process gains?",["Structured turn-taking, so diverse views are heard and integrated","Adding more members","Removing all disagreement","Letting the boss decide alone"],"Integrating diverse information is a source of synergy."],
     ["Members stop raising concerns after one was mocked in a meeting. Which source of process loss is this?",["Lack of psychological safety","Social loafing","Complementary skills","A superordinate goal"],"People withhold input when speaking up feels unsafe."]]},
   {title:"The Effective Team", lore:[
     "The <strong>team effectiveness model</strong> groups its factors into three sets.",
     "<strong>Context</strong>: adequate resources, leadership and structure, a climate of trust, and performance evaluation and reward systems.",
     "<strong>Composition</strong>: members' abilities, personality, allocation of roles, diversity, cultural differences, team size and member preferences.",
     "<strong>Process</strong>: common purpose, specific goals, team efficacy, team identity, cohesion, shared mental models, conflict levels and social loafing. Trust underpins it all, and both leadership and followership matter."],
    qs:[
     ["A team has talented, well-matched members and a clear purpose, but rewards are based only on individual sales, so nobody helps anybody. Which part of the model is failing?",["Context: performance evaluation and reward systems","Composition: abilities","Process: mental models","Composition: size"],"The reward system undercuts teamwork."],
     ["A project team has 22 members and coordination is chaos. Which factor should change?",["Composition: team size","Context: resources","Process: team identity","Context: trust"],"Large teams struggle to coordinate, and loafing rises."],
     ["Members share a common purpose but disagree on what 'done' means and how the system works. Which process factor is weak?",["Shared mental models","Team identity","Climate of trust","Member preferences"],"They hold different pictures of the work."]]},
   {title:"The Idle Hand", lore:[
     "<strong>Social loafing</strong> is the tendency of some members to put in less effort in a group than they would working alone.",
     "Reduce it by: identifying individual performance in a measurable way, forming smaller work groups, stating expectations and goals clearly, giving direct and immediate feedback, and building cohesion by restating the larger purpose."],
    qs:[
     ["In a 9-member class project, two members rarely contribute because the team gets one shared grade. Best fix?",["Make each member's contribution visible and measurable, with owned sections and peer evaluation","Add more members","Keep the single shared grade","Let the leader do it all"],"Measurable individual output reduces loafing."],
     ["Why does splitting a 12-person team into three pods of four often reduce loafing?",["In smaller groups, individual effort is more visible and harder to hide","Smaller groups have less talent","It creates groupthink","It removes goals"],"Visibility drives accountability."],
     ["A member says, 'My bit won't change the outcome anyway.' This mindset is at the core of…",["Social loafing","Groupthink","Status conflict","Equity theory"],"Felt dispensability invites free riding."]]},
   {title:"One Voice", lore:[
     "<strong>Groupthink</strong>: well-intentioned people make faulty decisions because group pressure and conformity make it hard to dissent.",
     "To reduce it: don't state a preferred solution early; regularly split into subgroups, then bring everyone back together; invite outsiders to challenge the group's ideas; get feedback from different stakeholders; and role-play how others will react.",
     "Group behaviour differs from individual behaviour. Teams don't happen; they need to be designed to happen."],
    qs:[

     ["Which practice best counters groupthink in a cohesive leadership team?",["Work in independent subgroups, then reconvene, and invite an outsider to challenge","Hold one long meeting to reach consensus fast","Invite only senior members","Let the leader speak first"],"Both practices are on the list of remedies."],
     ["A tight-knit team dismisses a junior's warning about a product flaw because 'we always get this right'. Which phenomenon?",["Groupthink","Social loafing","Process gains","Trait activation"],"Cohesion plus overconfidence silences dissent."]]}

/* ============================ LEVEL CHUNKS ============================ */
const TS=30, ROWS=18, VW=960, VH=540;
function mk(w){
  const g=Array.from({length:ROWS},()=>Array(w).fill("."));
  const c={w,g,ents:[],
    r(x0,y0,x1,y1,ch="#"){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=ch;return c;},
    gnd(x0,x1){return c.r(x0,15,x1,17,"#");},
    e(type,x,y,o={}){c.ents.push(Object.assign({type,x,y},o));return c;}};
  return c;
}
const CH={
  start:(story)=>{const c=mk(24).gnd(0,23).e("spawn",2,14).e("bench",6,14); if(story) c.e("npc",12,14); return c;},
  lore:(k)=>mk(12).gnd(0,11).e("stone",6,14,{k}),
  gate:(k)=>mk(13).gnd(0,12).e("bench",2,14).e("gate",9,14,{k}),
  end:()=>mk(18).gnd(0,17).e("flag",10,14),
};
const CHALL=[
  // tier 1
  {t:1,f:()=>mk(26).gnd(0,4).gnd(9,12).gnd(18,25).e("shard",6,12).e("shard",7,11).e("shard",15,11).e("shard",16,12).e("shard",11,3)},
  {t:1,f:()=>mk(26).gnd(0,25).r(12,13,14,14).e("enemy",7,14,{range:2.5}).e("enemy",19,14,{range:2.5}).e("shard",13,11).e("shard",13,5)},
  {t:1,f:()=>mk(28).gnd(0,27).r(6,14,21,14,"^").r(5,12,8,12,"=").r(11,10,14,10,"=").r(17,12,20,12,"=").e("shard",12,8).e("shard",13,8).e("shard",12,3).e("shard",13,3)},
  // tier 2
  {t:2,f:()=>mk(22).gnd(0,13).r(14,7,21,17).r(7,14,13,14,"^").r(3,12,6,12,"=").r(8,9,11,9,"=").e("shard",9,7).e("shard",18,5).e("shard",5,4)},
  {t:2,f:()=>mk(28).gnd(0,4).gnd(23,27).e("mplat",7,13,{axis:"x",range:4,spd:1.25}).e("mplat",17,11,{axis:"x",range:3,spd:1.5,ph:1.6}).e("shard",12,9).e("shard",13,9).e("shard",13,4)},
  {t:2,f:()=>mk(30).r(0,15,3,17).r(4,13,7,17).r(10,11,13,17).r(16,9,19,17).r(22,15,29,17).e("enemy",26,14,{range:2}).e("shard",8,8).e("shard",14,6).e("shard",18,3)},
  {t:2,f:()=>mk(24).gnd(0,6).r(11,13,13,17).gnd(19,23).e("shard",9,9).e("shard",16,9).e("shard",12,4).e("enemy",21,14,{range:1.2})},
  // tier 3
  {t:3,f:()=>mk(26).gnd(0,25).r(6,0,19,9).r(6,10,19,10,"v").e("spike1",9,14).e("spike1",16,14).e("enemy",12,14,{range:1.3}).e("shard",13,12)},
  {t:3,f:()=>mk(28).gnd(0,27).r(4,14,23,14,"^").r(4,12,8,12).r(12,10,16,10).r(20,12,24,12).e("enemy",6,11,{range:1.4}).e("enemy",22,11,{range:1.4}).e("shard",14,8).e("shard",14,3)},
  {t:3,f:()=>mk(24).gnd(0,5).r(13,9,15,9,"=").r(18,11,23,17).e("mplat",9,12,{axis:"y",range:3,spd:1.4}).e("shard",14,7).e("shard",14,2)},
  {t:3,f:()=>mk(30).gnd(0,3).r(12,12,16,17).gnd(26,29).e("mplat",7,12,{axis:"x",range:3,spd:1.35}).e("enemy",14,11,{range:1.4}).e("mplat",21,10,{axis:"x",range:3,spd:1.6,ph:2}).e("shard",14,7).e("shard",21,5)},
  {t:3,f:()=>mk(30).gnd(0,4).r(8,12,9,17).r(14,10,15,17).r(20,12,21,17).gnd(25,29).r(10,17,13,17,"^").r(16,17,19,17,"^").e("shard",11,8).e("shard",17,7).e("enemy",27,14,{range:1.5})},
];
function pickChunk(t,avoid){
  const pool=CHALL.filter(c=>c.t===t && c!==avoid);
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildLevel(wi,story,final){
  const parts=[CH.start(story)];
  const nG=final?10:5; let last=null;
  for(let k=0;k<nG;k++){
    if(story) parts.push(CH.lore(k));
    const tier=final?(k<3?2:3):Math.min(3,1+Math.floor((k+wi+(story?0:1))/2));
    const n=final?1:2;
    for(let j=0;j<n;j++){ const t=j===0?tier:Math.max(1,tier-1); const c=pickChunk(t,last); last=c; parts.push(c.f()); }
    parts.push(CH.gate(k));
  }
  const fin=pickChunk(3,last); parts.push(fin.f()); parts.push(CH.end());
  const cols=parts.reduce((a,c)=>a+c.w,0);
  const grid=Array.from({length:ROWS},()=>[]);
  const L={cols,grid,spawn:{x:60,y:450},benches:[],stones:[],gates:[],enemies:[],mplats:[],shards:[],npc:null,flag:null};
  let off=0;
  for(const c of parts){
    for(let y=0;y<ROWS;y++) grid[y].push(...c.g[y]);
    for(const e of c.ents){
      const X=(off+e.x)*TS, Y=e.y*TS;
      switch(e.type){
        case "spawn": L.spawn={x:X,y:Y+TS}; break;
        case "bench": L.benches.push({x:X,y:Y+10,w:60,h:20,used:false}); break;
        case "npc": L.npc={x:X,y:Y+TS}; break;
        case "stone": L.stones.push({x:X,y:Y+TS,k:e.k,read:false}); break;
        case "gate": L.gates.push({x:X,y:0,w:TS,h:Y+TS,k:e.k,open:false,openT:0}); break;
        case "flag": L.flag={x:X,y:Y+TS}; break;
        case "spike1": grid[e.y][off+e.x]="^"; break;
        case "enemy": { const ex=X+4; L.enemies.push({x:ex,y:Y+TS-22,w:22,h:22,vx:1,minX:ex-e.range*TS,maxX:ex+e.range*TS,alive:true,dieT:0}); break; }
        case "mplat": { const bx=X+15-45; L.mplats.push({bx,by:Y,x:bx,y:Y,w:90,h:14,axis:e.axis,range:e.range*TS,spd:e.spd,ph:e.ph||0,dx:0,dy:0}); break; }
        case "shard": L.shards.push({x:X+15,y:Y+15,got:false}); break;
      }
    }
    off+=c.w;
  }
  return L;
}

/* ============================ GAME ============================ */
let G=null, raf=null, timerId=null;
const keys={left:false,right:false,jump:false,dash:false,act:false};
function clearKeys(){ for(const k in keys) keys[k]=false; if(G){G.jp=G.jr=G.dp=G.ap=false;} }
function stopGame(){ if(raf) cancelAnimationFrame(raf); raf=null; if(timerId) clearInterval(timerId); timerId=null; G=null; document.onkeydown=null; document.onkeyup=null; for(const k in keys) keys[k]=false; }
const has=id=>G&&G.powers.includes(id);

function startGame(id,story){

  const set=SETS.find(x=>x.key===id); const final=!!set;

    pool=shuffle(pool.slice(0,10)).concat(shuffle(by.flat()));
  } else if(story){
    lessonPools=world.lessons.map((l,lk)=>shuffle(l.qs.map(q=>qobj(world.id,lk,q))));
  } else {
    pool=shuffle(world.lessons.flatMap((l,lk)=>l.qs.map(q=>qobj(world.id,lk,q))));
  }
  const pal=world.pal;
  G={world,story,final,wi,d,pal,L,pool,qi:0,lessonPools,
     p:{x:L.spawn.x,y:L.spawn.y-35,w:20,h:34,vx:0,vy:0,on:false,face:1,coyote:0,buf:0,jumps:0,dashT:0,dashUsed:false,inv:0,kbT:0,kbVx:0,plat:null,cut:false,gliding:false},
     cp:{x:L.spawn.x,y:L.spawn.y},cam:0,t:0,hearts:5,maxHearts:5,shieldUp:false,powers:[],shards:0,
     firstTry:0,answered:0,missed:[],gatesCleared:0,deaths:0,done:false,dlg:null,cur:null,
     parts:[],trail:[],motes:Array.from({length:46},()=>({x:Math.random()*VW,y:Math.random()*VH,r:Math.random()*1.8+.4,s:Math.random()*14+6,a:Math.random()*.5+.15})),
     shake:0,start:performance.now(),end:final?Date.now()+15*60*1000:null,banner:null,jp:false,jr:false,dp:false,ap:false,prompt:null};
  app.innerHTML=`<section class="game">
    <div class="hud">
      <button class="btn" id="quit">Map</button>
      <span class="pill">${final?esc(world.name):(story?"Chapter "+world.num+" · ":"Trial · ")+esc(world.name)}</span>
      <span class="spacer"></span>
      ${final?`<span class="pill mono" id="clock">15:00</span>`:""}
      <span class="hearts" id="hearts" aria-label="Resolve"></span>

    </div>
    <div class="stage" id="stage" style="--wacc:${pal.acc}">
      <canvas id="cv" width="${VW}" height="${VH}" aria-label="Platformer. Move right, read lore stones, and answer at the gates."></canvas>
      <div class="dlg" id="dlg" hidden></div>

    </div>
    <div class="pad">
      <div class="grp"><button id="bl" aria-label="Move left">◀</button><button id="br" aria-label="Move right">▶</button></div>
      <div class="grp"><button id="ba" aria-label="Read or talk">READ</button><button id="bd" aria-label="Dash">DASH</button><button class="j" id="bj" aria-label="Jump">JUMP</button></div>
    </div>
    <span class="kbd">${story?"Walk past a lore stone to read it. Walk into a gate to answer it. Benches save your spot.":"Walk into a gate to answer. Benches save your spot. Falling or spikes cost 1 resolve."}</span>

  $("#quit").onclick=home;

  if(final){ timerId=setInterval(()=>{ if(!G) return; const left=Math.max(0,G.end-Date.now()); const el=$("#clock"); if(el){el.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,"0")}`; el.classList.toggle("warn",left<120000);} if(left<=0) finish(false,"Time's up"); },500); }
  G.last=performance.now(); raf=requestAnimationFrame(loop);

function bindControls(){
  const map={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"jump",KeyW:"jump",Space:"jump",KeyZ:"jump",ShiftLeft:"dash",ShiftRight:"dash",KeyX:"dash",KeyK:"dash",KeyE:"act",ArrowDown:"act",KeyS:"act"};
  document.onkeydown=e=>{
    if(!G) return;
    if(G.cur){ modalKey(e); return; }
    if(G.dlg){ if(["Enter","Space","KeyE","ArrowDown","KeyS"].includes(e.code)){ e.preventDefault(); if(!e.repeat) advanceDlg(); } else if(e.code==="Escape"){ closeDlg(); } return; }
    const k=map[e.code]; if(!k) return; e.preventDefault(); if(e.repeat){ keys[k]=true; return; }
    if(k==="jump"&&!keys.jump) G.jp=true;
    if(k==="dash") G.dp=true;
    if(k==="act") G.ap=true;
    keys[k]=true;
  };
  document.onkeyup=e=>{ const k=map[e.code]; if(!k||!G) return; keys[k]=false; if(k==="jump") G.jr=true; };
  const hold=(id,k)=>{ const b=$(id); if(!b) return;
    b.onpointerdown=e=>{ e.preventDefault(); if(!G) return; if(G.dlg){ advanceDlg(); return; } if(k==="jump") G.jp=true; if(k==="dash") G.dp=true; if(k==="act") G.ap=true; keys[k]=true; };
    b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{ if(keys[k]&&k==="jump"&&G) G.jr=true; keys[k]=false; }; };
  hold("#bl","left"); hold("#br","right"); hold("#bj","jump"); hold("#bd","dash"); hold("#ba","act");
}

function tile(cx,cy){ if(cy<0||cy>=ROWS) return "."; if(cx<0||cx>=G.L.cols) return "#"; return G.L.grid[cy][cx]; }
const ov=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

function loop(now){
  if(!G) return;
  const dt=Math.min(1/30,(now-G.last)/1000); G.last=now; G.t+=dt;
  const paused=!!(G.dlg||G.cur||G.done);
  if(!paused) step(dt);
  if(!G) return;
  for(const g of G.L.gates){ if(g.open&&g.openT<1) g.openT=Math.min(1,g.openT+dt*1.4); }
  G.parts=G.parts.filter(q=>(q.life-=dt)>0); G.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;});
  G.trail=G.trail.filter(q=>(q.life-=dt)>0);
  G.motes.forEach(m=>{ m.y-=m.s*dt; m.x+=Math.sin(G.t*.6+m.r*7)*6*dt; if(m.y<-4){m.y=VH+4;m.x=Math.random()*VW;} });
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  draw();
  raf=requestAnimationFrame(loop);
}

function step(dt){
  const p=G.p, L=G.L;
  // moving platforms
  for(const m of L.mplats){ const ox=m.x,oy=m.y, s=Math.sin(G.t*m.spd+m.ph)*m.range; if(m.axis==="x") m.x=m.bx+s; else m.y=m.by+s; m.dx=m.x-ox; m.dy=m.y-oy; }
  if(p.plat){ p.x+=p.plat.dx; p.y=p.plat.y-p.h; }
  // input
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir&&p.dashT<=0&&p.kbT<=0) p.face=dir;
  const spd=has("speed")?325:240;
  if(G.dp){ G.dp=false; if(has("dash")&&!p.dashUsed&&p.dashT<=0){ p.dashT=.17; p.dashUsed=true; p.plat=null; G.shake=3; } }
  if(p.dashT>0){ p.dashT-=dt; p.vx=p.face*650; p.vy=0; G.trail.push({x:p.x,y:p.y,face:p.face,life:.25}); }
  else if(p.kbT>0){ p.kbT-=dt; p.vx=p.kbVx; }
  else { const target=dir*spd; p.vx+=(target-p.vx)*Math.min(1,dt*(p.on?22:12)); if(!dir&&Math.abs(p.vx)<8) p.vx=0; }
  if(G.jp){ p.buf=.12; G.jp=false; }
  if(p.buf>0){ p.buf-=dt;
    if(p.on||p.coyote>0){ p.vy=-760; p.on=false; p.coyote=0; p.buf=0; p.jumps=1; p.plat=null; p.cut=false; }
    else if(has("double")&&p.jumps<2&&p.dashT<=0){ p.vy=-690; p.jumps=2; p.buf=0; p.cut=false; puff(p.x+p.w/2,p.y+p.h,G.pal.acc,10); }
  }
  if(G.jr){ G.jr=false; if(p.vy<0&&!p.cut){ p.vy*=.45; p.cut=true; } }
  p.gliding=false;
  if(p.dashT<=0){ p.vy+=2100*dt; if(has("glide")&&keys.jump&&p.vy>95&&!p.on){ p.vy=95; p.gliding=true; } if(p.vy>1000) p.vy=1000; }
  const prevBottom=p.y+p.h;
  // X
  p.x+=p.vx*dt; if(p.x<0) p.x=0;
  { const y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h-.01)/TS);
    if(p.vx>0){ const cx=Math.floor((p.x+p.w-.01)/TS); for(let y=y0;y<=y1;y++) if(tile(cx,y)==="#"){ p.x=cx*TS-p.w; p.vx=0; break; } }
    else if(p.vx<0){ const cx=Math.floor(p.x/TS); for(let y=y0;y<=y1;y++) if(tile(cx,y)==="#"){ p.x=(cx+1)*TS; p.vx=0; break; } } }
  for(const g of L.gates){ if(!g.open&&ov(p,g)){ p.x=g.x-p.w; p.vx=0; p.dashT=0; askGate(g); return; } }
  // Y
  p.y+=p.vy*dt; p.on=false; p.plat=null;
  { const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-.01)/TS);
    if(p.vy>=0){ const cy=Math.floor((p.y+p.h-.01)/TS); for(let x=x0;x<=x1;x++){ const c=tile(x,cy); if(c==="#"||(c==="="&&prevBottom<=cy*TS+1)){ p.y=cy*TS-p.h; p.vy=0; p.on=true; break; } } }
    else { const cy=Math.floor(p.y/TS); for(let x=x0;x<=x1;x++) if(tile(x,cy)==="#"){ p.y=(cy+1)*TS; p.vy=0; break; } } }
  for(const m of L.mplats){ if(p.vy>=0&&prevBottom<=m.y+3&&p.y+p.h>=m.y&&p.x+p.w>m.x+2&&p.x<m.x+m.w-2){ p.y=m.y-p.h; p.vy=0; p.on=true; p.plat=m; } }
  if(p.on){ p.coyote=.1; p.jumps=0; p.dashUsed=false; } else p.coyote-=dt;
  if(p.inv>0) p.inv-=dt;
  // hazards
  { const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-.01)/TS), y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h-.01)/TS);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const c=tile(x,y);
      if(c==="^"&&ov(p,{x:x*TS+5,y:y*TS+13,w:20,h:17})) return hurt(true);
      if(c==="v"&&ov(p,{x:x*TS+5,y:y*TS,w:20,h:17})) return hurt(true); } }
  if(p.y>VH+40) return hurt(true);
  // enemies
  const espd=final_or_world_speed();
  for(const e of L.enemies){ if(!e.alive){ e.dieT+=dt; continue; }
    e.x+=e.vx*espd*dt; if(e.x<e.minX){e.x=e.minX;e.vx=1;} if(e.x>e.maxX){e.x=e.maxX;e.vx=-1;}
    if(ov(p,e)){
      if(p.dashT>0||(p.vy>0&&prevBottom<=e.y+10)){ e.alive=false; burst(e.x+11,e.y+11,G.pal.acc,14); G.shards+=2; gain(2); if(p.dashT<=0){ p.vy=-560; p.jumps=1; p.cut=true; } updateHud(); }
      else if(p.inv<=0){ hurt(false,e); if(!G||G.done) return; }
    } }
  // shards
  for(const s of L.shards){ if(!s.got&&Math.abs(p.x+p.w/2-s.x)<16&&Math.abs(p.y+p.h/2-s.y)<22){ s.got=true; G.shards++; gain(1); puff(s.x,s.y,G.pal.acc,6); updateHud(); } }
  // benches
  for(const b of L.benches){ if(ov(p,{x:b.x,y:b.y-30,w:b.w,h:50})){ G.cp={x:b.x+20,y:b.y+20};
      if(!b.used){ b.used=true; const healed=G.hearts<G.maxHearts; if(healed) G.hearts++; if(has("shield")) G.shieldUp=true; banner("Bench",healed?"You rest. +1 resolve, and your place is saved.":"You rest. Your place is saved."); updateHud(); } } }
  // interactions
  G.prompt=null;
  if(G.story){
    for(const s of L.stones){ const near=Math.abs(p.x+p.w/2-(s.x+15))<34;
      if(near){ if(!s.read){ s.read=true; openLore(s.k); return; } G.prompt={x:s.x+15,y:s.y-58,t:"E · read"}; if(G.ap){ G.ap=false; openLore(s.k); return; } } }
    const n=L.npc; if(n&&Math.abs(p.x+p.w/2-(n.x+15))<40){ G.prompt={x:n.x+15,y:n.y-90,t:"E · talk"}; if(G.ap){ G.ap=false; openDialog(G.world.intro.slice(-1).map(x=>({s:"The Mentor",x})).concat([{s:"The Mentor",x:"Read every stone. The gates ask only what the stones have taught."}])); return; } }
  }
  G.ap=false;
  if(L.flag&&p.x>L.flag.x-6&&!G.flagged){ return reachFlag(); }
  // camera
  const target=Math.max(0,Math.min(p.x-VW*.38,L.cols*TS-VW));
  G.cam+=(target-G.cam)*Math.min(1,dt*7);
}
function final_or_world_speed(){ return G.final?95:58+G.d*9+(G.story?0:8); }

function hurt(respawn,src){
  const p=G.p;
  if(!respawn&&p.inv>0) return;
  if(G.shieldUp){ G.shieldUp=false; banner("Composure","Your shield absorbs the blow."); }
  else G.hearts--;
  p.inv=1.3; G.shake=8; burst(p.x+p.w/2,p.y+p.h/2,"#e8e6df",12); updateHud();
  if(G.hearts<=0) return death();
  if(respawn){ p.x=G.cp.x; p.y=G.cp.y-p.h-1; p.vx=p.vy=0; p.dashT=0; p.plat=null; G.cam=Math.max(0,p.x-VW*.38); }
  else { p.kbT=.18; p.kbVx=(src&&src.x+11>p.x+p.w/2)?-320:320; p.vy=-380; p.plat=null; }
}
function death(){
  G.deaths++;

    const lost=G.shards; G.shards=0; G.hearts=G.maxHearts;
    const p=G.p; p.x=G.cp.x; p.y=G.cp.y-p.h-1; p.plat=null; p.dashT=0; p.vx=p.vy=0; p.inv=1.5; G.cam=Math.max(0,p.x-VW*.38);

    openDialog([{t:"Your resolve shatters",x:`The dark takes you, and you wake at the last bench. ${lost?lost+" insight shards were lost in the fall.":""} Your awakened arts remain.`}]);

}

/* ---------- dialogue ---------- */
function openDialog(pages,onDone){ G.dlg={pages,i:0,onDone}; clearKeys(); renderDlg(); }

  el.hidden=false;
  el.innerHTML=`<div class="dh">${pg.t?`<span class="dt">${esc(pg.t)}</span>`:"<span></span>"}${pg.s?`<span class="ds">${esc(pg.s)}</span>`:""}</div><p>${pg.html?pg.x:esc(pg.x)}</p><div class="df"><span>${d.i+1} / ${d.pages.length}</span><span>${d.i+1<d.pages.length?"E / Enter / tap ▸":"E / Enter / tap to continue"}</span></div>`; }
function advanceDlg(){ if(!G||!G.dlg) return; G.dlg.i++; if(G.dlg.i>=G.dlg.pages.length) closeDlg(); else renderDlg(); }
function closeDlg(){ if(!G||!G.dlg) return; const cb=G.dlg.onDone; G.dlg=null; $("#dlg").hidden=true; clearKeys(); if(cb) cb(); }
function openLore(k){ const l=G.world.lessons[k]; openDialog(l.lore.map((x,i)=>({t:(i===0?"Lore stone · ":"")+l.title,s:i===0?"The stone reads…":"",x,html:true}))); }
function banner(t,s){ const r=$("#bannerRoot"); if(!r) return; r.innerHTML=`<div class="banner"><div class="bt">${esc(t)}</div><div class="bs">${esc(s)}</div></div>`; clearTimeout(G&&G.bt); if(G) G.bt=setTimeout(()=>{ if(r) r.innerHTML=""; },3200); }

/* ---------- gates & questions ---------- */
function askGate(g){ G.activeGate=g; G.firstAttempt=!g.tried; clearKeys(); ask(); }
function nextQ(){
  const g=G.activeGate;
  if(G.story){ let pool=G.lessonPools[g.k]; if(!pool.length) pool=G.lessonPools.find(a=>a.length); if(!pool){ G.lessonPools[g.k]=shuffle(G.world.lessons[g.k].qs.map(q=>({w:G.world.id,lk:g.k,text:q[0],opts:q[1],exp:q[2]}))); pool=G.lessonPools[g.k]; } return pool.shift(); }
  if(G.qi>=G.pool.length){ G.pool=shuffle(G.pool); G.qi=0; } return G.pool[G.qi++];
}
function ask(){
  const q=nextQ(); const opts=shuffle(q.opts.map((o,i)=>({o,ok:i===0})));
  const W=WORLDS.find(w=>w.id===q.w); const lesson=W.lessons[q.lk];
  const nextPower=POWERS[G.powers.length];
  const nG=G.L.gates.length;
  modalRoot.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="qt"><div class="qbox" id="qbox">
    <div class="q-topic"><span>Gate ${G.activeGate.k+1} of ${nG} · ${esc(lesson.title)}</span><span>${G.firstAttempt?"first try":"retry"}</span></div>
    <div class="q-text" id="qt">${esc(q.text)}</div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o.o)}</span></button>`).join("")}</div>
    <div class="stakes">${G.firstAttempt?(nextPower?`First-try reward: <b>${nextPower.name}</b> (${nextPower.how.split(":")[0].toLowerCase()}).`:"First-try reward: +1 resolve."):"Retry: the gate opens, but no power."} A wrong answer costs 1 resolve.</div>
    <div id="fb"></div><div class="actions" id="acts"></div>
  </div></div>`;
  G.cur={q,opts,locked:false};
  modalRoot.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function modalKey(e){
  if(!G||!G.cur) return;
  if(e.key>="1"&&e.key<="4"&&!G.cur.locked){ e.preventDefault(); answer(+e.key-1); }
  else if(e.key==="Enter"&&G.cur.locked){ e.preventDefault(); const n=$("#cont"); if(n) n.click(); }
}
function answer(k){
  const cur=G.cur; if(!cur||cur.locked) return; cur.locked=true;
  const ok=cur.opts[k].ok;
  S.stats[cur.q.w].a++; if(ok) S.stats[cur.q.w].c++; save();
  const btns=modalRoot.querySelectorAll(".opt"); btns.forEach((b,j)=>{ b.disabled=true; if(cur.opts[j].ok) b.classList.add("right"); });
  if(G.firstAttempt){ G.answered++; if(ok) G.firstTry++; }
  let reward="";
  if(!ok){ G.activeGate.tried=true; btns[k].classList.add("wrong"); $("#qbox").classList.add("shake"); if(G.shieldUp) G.shieldUp=false; else G.hearts--; G.missed.push({q:cur.q,said:cur.opts[k].o}); updateHud(); }
  else { gain(G.firstAttempt?15:5); if(G.firstAttempt){ const np=POWERS[G.powers.length]; reward=np?`Power awakened: ${np.name}. ${np.how}`:"+1 resolve."; } }
  const dead=G.hearts<=0;
  $("#fb").innerHTML=`<div class="explain ${ok?"good":"bad"}"><b>${ok?(G.firstAttempt?"Correct, first try.":"Correct."):dead?"Your resolve breaks.":"Not quite. −1 resolve."}</b> ${esc(cur.q.exp)}${reward?`<br><b>${esc(reward)}</b>`:""}${!ok&&G.story?" <i>Reread the stone behind you if you need it.</i>":""}</div>`;
  $("#acts").innerHTML=`<button class="btn go" id="cont">${ok?"Open the gate":dead?"Continue":"Face another question"}</button>`;
  $("#cont").onclick=()=>{
    if(!G) return;
    modalRoot.innerHTML=""; const wasFirst=G.firstAttempt; G.cur=null;
    if(ok){ openGate(wasFirst); }
    else if(dead){ if(G.story){ G.firstAttempt=false; death(); } else finish(false,"Burnout"); }
    else { G.firstAttempt=false; ask(); }
  };
  $("#cont").focus();
}
function openGate(first){
  const g=G.activeGate; g.open=true; G.gatesCleared++;
  burst(g.x+15,g.h-80,G.pal.acc,26); G.shake=6;
  G.cp={x:g.x+50,y:g.h};
  if(first){ const np=POWERS[G.powers.length];
    if(np){ G.powers.push(np.id); if(np.id==="shield") G.shieldUp=true; banner("Power awakened · "+np.name,np.how); }
    else { G.hearts=Math.min(G.maxHearts,G.hearts+1); banner("Clarity","+1 resolve."); } }
  else banner("The gate yields","No power this time. Answer the next gate on the first try.");
  updateHud(); clearKeys();
}
function updateHud(){
  if(!G) return;
  $("#hearts").innerHTML=Array.from({length:G.maxHearts},(_,k)=>`<i class="${k>=G.hearts?"lost":""}"></i>`).join("")+(G.shieldUp?`<i class="shield" title="Composure shield"></i>`:"");
  $("#pchips").innerHTML=POWERS.map(p=>`<b class="${G.powers.includes(p.id)?"on":""}" title="${esc(p.name+": "+p.how)}">${p.short}</b>`).join("");
  $("#gates").textContent=`gates ${G.gatesCleared}/${G.L.gates.length}`;
  $("#shards").textContent=`shards ${G.shards}`;
}
function reachFlag(){
  G.flagged=true; G.L.flag.lit=true; G.p.vx=0; clearKeys();
  if(G.story) openDialog([{t:"The beacon is lit",s:"The Mentor",x:G.world.outro}],()=>finish(true));
  else finish(true);
}

function finish(won,reason){
  if(!G) return;
  const g=G; stopGame(); modalRoot.innerHTML="";
  const secs=Math.round((performance.now()-g.start)/1000);
  let head,verdict;
  if(g.final){
    const sc=g.firstTry, bk=g.world.best; if(S[bk]==null||sc>S[bk]) S[bk]=sc; if(won) gain(60); save();
    head=`<span class="label">${won?"Run complete":esc(reason)}</span><div class="score-big">${sc}<small>/10 on first try</small></div>`;
    verdict=!won?`You cleared ${g.gatesCleared} of 10 gates. Replay the regions where you slipped, then try again.`:sc>=9?"Exam-ready. Go ace it.":sc>=7?"Strong. Review the misses and run it once more.":"Replay Story mode for the regions you missed, then come back.";
  } else if(g.story){
    S.story[g.world.id]=true; gain(40); save();
    head=`<span class="label">Chapter ${g.world.num} complete · beacon lit</span><div class="score-big">${g.firstTry}<small>/${g.answered} gates on first try</small></div>`;
    verdict=`${g.powers.length} of 5 powers awakened · ${g.shards} shards · ${g.deaths} ${g.deaths===1?"fall":"falls"}.`;
  } else {
    let stars=0; if(won){ stars=g.hearts>=5?3:g.hearts>=3?2:1; if(!S.stars[g.world.id]||stars>S.stars[g.world.id]) S.stars[g.world.id]=stars; gain(30); save(); }
    head=`<span class="label">${won?"Trial cleared":esc(reason)}</span><div class="score-big">${g.firstTry}<small>/${g.answered} first-try</small></div>`;
    verdict=won?`${stars} star${stars===1?"":"s"}. Finish with all 5 resolve for 3 stars.`:`You cleared ${g.gatesCleared} of 5 gates. Try Story mode for this region, then retry.`;
  }
  const review=g.missed.map(m=>`<div class="rv"><span class="mark">MISSED · ${esc(WORLDS.find(w=>w.id===m.q.w).lessons[m.q.lk].title)}</span><span class="qq">${esc(m.q.text)}</span><span class="aa">You said: ${esc(m.said)}</span><span>Answer: <b>${esc(m.q.opts[0])}</b>. ${esc(m.q.exp)}</span></div>`).join("");
  app.innerHTML=`<section class="game">
    <div class="card">${head}<div class="verdict">${verdict}</div>
      <div class="statrow"><span class="pill">${g.powers.length}/5 powers</span><span class="pill">${g.shards} shards</span><span class="pill">${Math.floor(secs/60)}m ${secs%60}s</span></div>
      <div class="actions" style="justify-content:flex-start"><button class="btn go" id="again">Play again</button><button class="btn" id="back">Map</button></div></div>
    ${review?`<div class="section-head"><h2>What to fix</h2><span class="label">${g.missed.length} missed</span></div><div class="review">${review}</div>`:`<p class="kbd">No misses on this run.</p>`}
  </section>`;
  $("#again").onclick=()=>startGame(g.world.id,g.story); $("#back").onclick=()=>{ homeTab=g.story?"story":"trial"; home(); };
  window.scrollTo(0,0);
}

/* ---------- particles ---------- */
function burst(x,y,col,n){ for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,g:600,life:.5+Math.random()*.5,col,r:2+Math.random()*2}); }
function puff(x,y,col,n){ for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()-.5)*160,vy:Math.random()*40,g:0,life:.35+Math.random()*.3,col,r:1.5+Math.random()*1.5}); }

/* ============================ DRAW ============================ */
function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function draw(){
  const ctx=G.ctx, pal=G.pal, L=G.L, p=G.p;
  const sx=G.shake?(Math.random()-.5)*G.shake:0, sy=G.shake?(Math.random()-.5)*G.shake:0;
  const cam=Math.round(G.cam);
  // sky
  const sky=ctx.createLinearGradient(0,0,0,VH); sky.addColorStop(0,pal.top); sky.addColorStop(1,pal.bot);
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
  // far arches
  ctx.save(); ctx.fillStyle=pal.far; ctx.strokeStyle=pal.far; ctx.lineWidth=20;
  { const par=cam*.18, off=-(par%340), i0=Math.floor(par/340);
    for(let i=-1;i<5;i++){ const x=off+i*340, h=hash(i0+i); const top=120+h*80;
      ctx.fillRect(x+40,top,28,VH); ctx.fillRect(x+272,top,28,VH);
      ctx.beginPath(); ctx.arc(x+170,top+14,116,Math.PI,0); ctx.stroke();
      if(h>.5){ ctx.beginPath(); ctx.moveTo(x+170,top-102); ctx.lineTo(x+164,top-150); ctx.lineTo(x+176,top-150); ctx.fill(); } } }
  // near hanging roots
  ctx.fillStyle=pal.near;
  { const par=cam*.42, off=-(par%180), i0=Math.floor(par/180);
    for(let i=-1;i<7;i++){ const x=off+i*180, h=hash((i0+i)*3.7); const len=50+h*120;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+46,0); ctx.lineTo(x+22+h*8,len); ctx.closePath(); ctx.fill();
      ctx.fillRect(x+90,0,3,len*.7+30); ctx.beginPath(); ctx.arc(x+91.5,len*.7+34,5,0,Math.PI*2); ctx.fill(); } }
  ctx.restore();
