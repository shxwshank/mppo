     ["An employee who files expenses late has her reimbursement held for a month, to cut late filing. This is…",["Punishment","Negative reinforcement","Extinction","Positive reinforcement"],"Taking away something pleasant to reduce a behaviour is punishment."],
     ["A sales team gets a spot bonus right after every closed deal, and closing rises. This is…",["Positive reinforcement","Negative reinforcement","Extinction","Punishment"],"Adding something pleasant increased the behaviour."]]},
   {title:"The Three Links", lore:[
     "<strong>Expectancy theory</strong> (Vroom) assumes people consciously choose among alternatives to maximise pleasure and minimise pain.",
     "Motivation = <strong>Expectancy × Instrumentality × Valence</strong>. <strong>Expectancy</strong> (effort → performance): can I hit the target if I work hard? <strong>Instrumentality</strong> (performance → reward): will hitting it get me the reward? <strong>Valence</strong>: do I actually want that reward?",
     "The terms <strong>multiply</strong>, so if any one is near zero, motivation collapses, however strong the others."],
    qs:[
     ["Targets were raised so high that no one believes they can be hit, even with maximum effort. Which link is broken?",["Expectancy","Instrumentality","Valence","Equity"],"The effort-to-performance belief has gone."],
     ["Last year's promised bonus for top performers was quietly cancelled. This year effort is down. Which link broke?",["Instrumentality","Expectancy","Valence","Self-efficacy"],"Performance no longer leads to the reward."],
     ["Top performers win an all-expenses-paid offsite abroad. For an employee who hates travel and has young kids, motivation stays low. Which term is near zero?",["Valence","Expectancy","Instrumentality","Equity"],"He doesn't value the reward."],
     ["Expectancy is high and the reward is attractive, but promotions are seen as decided by politics, not performance. Predicted motivation?",["Low, because instrumentality is near zero and the terms multiply","High, because two of three are strong","Moderate, the average of the three","Unaffected; only valence matters"],"A zero in a product makes the whole product zero."]]},
   {title:"The Scales of Fairness", lore:[
     "We are social beings, and we compare. <strong>Adams' equity theory</strong>: people compare their own <strong>outcome-to-input ratio</strong> with a referent's. The fairer it seems, the more motivated they are.",
     "If someone is underpaid relative to a peer doing the same job, they may cut effort, ask for more, reinterpret the comparison, switch referents, or leave, all to restore balance.",
     "<strong>Organisational justice</strong> has three parts. <strong>Distributive</strong> justice is the fairness of outcomes (equity, equality, need), and it drives outcome satisfaction. <strong>Procedural</strong> justice is the fairness of the policies and processes used, and it drives system satisfaction. <strong>Interactional</strong> justice is respectful, dignified treatment, and it drives relationship satisfaction.",
     "In practice, pay bands rest on equity theory, and codes of conduct rest on organisational justice."],
    qs:[
     ["Riya learns a new hire doing exactly her job earns 20% more. She starts leaving on time and stops volunteering for extra work. Best explanation?",["Equity theory","Reinforcement theory","Goal setting","ERG"],"She is restoring balance by reducing her inputs."],
     ["Two employees get the same small raise. One is told in a respectful meeting with clear reasons; the other learns it from a curt email and is far angrier. Which justice is at stake?",["Interactional","Distributive","Procedural","Equity of inputs"],"The outcome is the same; the treatment differs."],
     ["Staff accept a disappointing bonus because the criteria were transparent, applied consistently, and open to appeal. This reflects…",["Procedural justice","Distributive justice","Interactional justice","Valence"],"A fair process makes a poor outcome easier to accept."],
     ["A promotion goes to the manager's friend over a clearly stronger candidate. Staff object that the result itself is unfair. Which justice?",["Distributive","Procedural","Interactional","Instrumentality"],"The objection is to the fairness of the outcome."]]},
   {title:"The Shape of the Work", lore:[
     "Some jobs are inherently more motivating. The <strong>Job Characteristics Model</strong> names five core characteristics.",
     "<strong>Skill variety</strong>, <strong>task identity</strong> (doing a whole, identifiable piece of work) and <strong>task significance</strong> (impact on others) create <strong>experienced meaningfulness</strong>. <strong>Autonomy</strong> creates <strong>experienced responsibility</strong> for outcomes. <strong>Feedback</strong> from the job gives <strong>knowledge of actual results</strong>.",
     "Those states lead to high internal motivation, high-quality work, high satisfaction, and low absenteeism and turnover. Individual differences moderate the effect: knowledge and skill, <strong>growth need strength</strong>, and satisfaction with the context.",
     "Compare a primary school teacher (high significance, variety and autonomy) with a quick-commerce delivery rider (little variety, little autonomy, a tightly scripted job)."],
    qs:[
     ["A loan officer checks one form in a 12-step process and never learns whether loans are approved. Which characteristics are weakest?",["Task identity and feedback","Only skill variety","Only task significance","Growth need strength"],"He never does a whole piece of work, and he never sees the results."],
     ["Which change most raises a delivery rider's experienced responsibility for outcomes?",["Letting him plan his own routes and schedule","A public leaderboard","A talk on the company mission","More types of parcels"],"Autonomy drives experienced responsibility."],
     ["Job enrichment energises some employees but barely moves others. The model explains this with…",["Growth need strength, a moderator","Hygiene factors","Instrumentality","Self-serving bias"],"Enrichment works best for people with strong growth needs."],
     ["Which job scores highest on task significance?",["A paediatric nurse","A data-entry clerk","A warehouse packer","A night-shift security guard at a quiet site"],"The nurse's work directly affects others' lives."]]}
  ]},
{ id:"CF", num:"VIII", name:"The Fractured Span", topic:"Conflict",
  pal:{top:"#110810",bot:"#2c1424",far:"#200e1a",near:"#301a29",tile:"#0c060a",edge:"#a85a86",acc:"#ff9ad5",fog:"255,154,213"},
  card:["#301a29","#110810","#ff9ad5"],
  enemies:["Avoidance","Escalation","Hostility","Rivalry","Ultimatum"],
  intro:[
    "The Fractured Span. A great bridge once joined Organa's two halves. Now it hangs in pieces, and each side is certain the other broke it.",
    "Conflict is not the enemy. Unmanaged conflict is. Learn when to stir it, how to read it, and how to mend it."],
  outro:"The eighth beacon burns. Let go of needing to be liked. Keep the big picture in view. Don't confuse disagreement with unkindness.",
  lessons:[
   {title:"Three Views", lore:[
     "<strong>Conflict</strong> is a process that begins when one party perceives that another has negatively affected, or is about to negatively affect, something the first party cares about.",
     "There are three views. <strong>Traditional</strong>: conflict is bad and should be avoided. <strong>Behavioural</strong>: conflict is natural and unavoidable, and it may even help. <strong>Interactionist</strong>: encourage a <strong>minimum desirable level</strong> of conflict to keep a group vibrant, self-critical and creative.",
     "Performance traces an inverted U. Too little conflict (point A) brings apathy and stagnation. An optimal level (B) brings peak performance. Too much (C) brings chaos.",
     "<strong>Functional</strong> conflict supports the group's goals and improves performance. <strong>Dysfunctional</strong> conflict hinders it."],
    qs:[
     ["A leadership team agrees on everything, nobody has challenged a decision in a year, and market share is slipping. An interactionist would say…",["Conflict is below the optimal level, so stimulate constructive debate","Perfect, because conflict is bad","They're at the optimal point","Conflict is unavoidable, so do nothing"],"Too little conflict sits at the left of the inverted U."],
     ["Two designers argue hard over which prototype better meets users' needs, and the final product improves. This conflict is…",["Functional","Dysfunctional","Annihilatory","Status conflict"],"It served the group's goal and improved performance."],
     ["A manager treats every disagreement as a sign of poor leadership and shuts debate down. Which view does he hold?",["Traditional","Behavioural","Interactionist","Integrative"],"The traditional view says conflict is bad and should be avoided."]]},
   {title:"Kinds of Conflict", lore:[
     "By content: <strong>task</strong> conflict is over the content and goals of the work. <strong>Relationship</strong> conflict is interpersonal. <strong>Process</strong> conflict is over how work gets done. <strong>Status</strong> conflict is over who does it and who ranks where.",
     "Low-to-moderate task conflict can be functional. Relationship conflict is almost always dysfunctional, because it breeds hostility and erodes trust.",
     "By locus: <strong>dyadic</strong> conflict is between two people, <strong>intragroup</strong> conflict is within a team, and <strong>intergroup</strong> conflict is between teams or groups."],
    qs:[
     ["Two analysts agree on the goal but clash over weekly sprints versus one big deadline. This is…",["Process conflict","Task conflict","Relationship conflict","Status conflict"],"It's about how the work gets done."],
     ["Two managers can't sit in the same meeting because of personal dislike, and their teams are taking sides. This is…",["Relationship conflict, likely dysfunctional","Task conflict, likely functional","Process conflict","Status conflict only"],"Interpersonal hostility rarely helps performance."],
     ["In the Jugaad case, Boston and Mumbai engineers blame each other for missed deadlines. By locus this is…",["Intergroup","Dyadic","Intrapersonal","Intragroup only"],"It runs between two groups at different sites."],
     ["A senior engineer is furious that a junior was chosen to present the team's work to the client. This is mainly…",["Status conflict","Task conflict","Process conflict","Functional conflict"],"It's about who gets to do the work, and rank."]]},
   {title:"Roots and Signs", lore:[
     "<strong>Causes</strong> of conflict: differing task goals, differing process goals, interpersonal differences, resource constraints, change, differing values, poor communication and <strong>task interdependence</strong>.",
     "<strong>Symptoms</strong>: poor communication, intergroup hostility and jealousy, interpersonal friction, escalation to arbitration, a proliferation of rules and regulations, and low morale.",
     "The <strong>conflict process</strong> has five stages: (1) potential opposition or incompatibility, arising from communication, structure or personal variables; (2) cognition and personalisation, where conflict is perceived and felt; (3) intentions; (4) behaviour; (5) outcomes, which can mean better or worse group performance.",
     "<strong>Intensity</strong> runs from minor misunderstandings, through overt questioning, assertive verbal attacks, and threats and ultimatums, up to physical attacks and efforts to destroy the other party, which is <strong>annihilatory conflict</strong>."],
    qs:[
     ["Two departments share one data team, and they fight over its time every quarter. The root cause is mainly…",["Resource constraints, with task interdependence","Differing values","Change","Personality"],"Scarce shared resources plus dependence on each other create conflict."],
     ["In one division every dispute now goes to HR for a ruling, and new rules keep being added to stop repeats. These are…",["Symptoms: escalation to arbitration and a proliferation of rules","Causes of conflict","Signs of functional conflict","Outcomes of collaboration"],"Both appear on the list of symptoms."],
     ["Two colleagues feel tense and anxious about each other but haven't acted on it yet. Which stage of the conflict process are they in?",["Cognition and personalisation (felt conflict)","Behaviour","Outcomes","Intentions already acted on"],"The conflict is perceived and felt, but not yet acted on."],
     ["A disagreement goes from 'Could you explain your numbers?' to 'Fix it by Friday or I go to the CEO.' On the intensity continuum it moved from…",["Overt questioning to threats and ultimatums","No conflict to annihilatory conflict","Assertive attacks to minor misunderstandings","Physical attacks to questioning"],"It escalated two rungs up the scale."]]},
   {title:"The Five Animals", lore:[
     "Conflict-handling intentions sit on two axes: how much your own needs matter, and how much the relationship matters.",
     "The <strong>shark competes</strong>: my needs matter and the relationship doesn't. The <strong>owl collaborates</strong>: both matter, so find a solution that fully satisfies both. The <strong>fox compromises</strong>: each side gives something up. The <strong>turtle avoids</strong>: it withdraws. The <strong>teddy bear accommodates</strong>: the relationship comes first, so it gives way.",
     "Culture shapes conflict too. Hofstede calls culture 'the collective programming of the mind'. His dimensions are <strong>power distance</strong>, <strong>uncertainty avoidance</strong>, <strong>individualism–collectivism</strong> and <strong>masculinity–femininity</strong>, later joined by <strong>long-term orientation</strong> and <strong>indulgence–restraint</strong>. India scores higher than the USA on power distance (77 vs 40) and long-term orientation (51 vs 26). The USA is far more individualist (91 vs 48) and indulgent (68 vs 26).",
     "In the <strong>Jugaad case</strong>, Boston feels that Mumbai hides bad news and misses deadlines. Mumbai feels disrespected, buried in requests it never agreed to, and addressed too casually. Beneath this lie differences in power distance and communication style, plus a work split that cut Mumbai off from the client."],
    qs:[
     ["A manager works with two feuding leads to find a solution that fully meets each one's core needs, even though it takes longer. This intention is…",["Collaborating (owl)","Compromising (fox)","Accommodating (teddy bear)","Competing (shark)"],"Both sides' needs and the relationship are kept whole."],
     ["To protect a key client relationship, a manager concedes a point he cares little about. This is…",["Accommodating (teddy bear)","Avoiding (turtle)","Competing (shark)","Collaborating (owl)"],"He put the relationship above his own need."],
     ["Mumbai engineers rarely flag bad news directly to Boston, and they expect seniors to be addressed as 'sir'. Which Hofstede dimension best explains this?",["Higher power distance in India","Higher indulgence in India","Masculinity","Lower long-term orientation in India"],"Deference to hierarchy shapes how bad news travels."],
     ["What is the deepest structural cause of the Boston–Mumbai conflict in the Jugaad case?",["The work split kept Mumbai away from clients while Boston passed on requests and deadlines Mumbai never agreed to","Mumbai engineers were less qualified","Boston had too few engineers","The suggestion box"],"The structure created task interdependence without shared ownership. The case notes that Mumbai's engineers were the more qualified."]]},
   {title:"Mending", lore:[
     "Resolution techniques: <strong>problem solving</strong> (meet face to face and openly work it through); <strong>superordinate goals</strong> (a shared goal neither side can reach alone); <strong>expansion of resources</strong> (grow the scarce thing); <strong>avoidance</strong> (withdraw or suppress); <strong>smoothing</strong> (play down differences and stress common interests); <strong>compromise</strong> (each side gives up something of value).",
     "Also: <strong>authoritative command</strong> (management decides, using formal authority); <strong>altering the human variable</strong> (training to change attitudes and behaviour); and <strong>altering structural variables</strong> (job redesign, transfers, coordinating roles).",
     "Managed well, conflict brings better work, chances to learn and grow, better relationships, higher job satisfaction and a more inclusive workplace (Gallo, HBR 2018). Her advice: let go of needing to be liked, focus on the big picture, don't equate disagreement with unkindness, and find a role model."],
    qs:[
     ["Sales and operations keep fighting over delivery promises. The CEO sets a joint target, 'zero missed customer deadlines this quarter', that neither can hit alone. This technique is…",["Superordinate goals","Smoothing","Authoritative command","Expansion of resources"],"A shared goal that requires cooperation."],
     ["Two teams fight over one shared meeting room, so the company leases a second. This is…",["Expansion of resources","Compromise","Avoidance","Problem solving"],"The scarce resource grew."],
     ["Which resolution in the Jugaad case tackles the structure that caused the conflict?",["Create a liaison role and give Mumbai client contact and a say in deadlines","Tell both sides to get along","Wait until the project ends","Let Boston decide everything"],"This alters structural variables, which removes the root cause."],
     ["A manager keeps saying, 'Let's focus on what we agree on,' and never addresses the real disagreement. This is…",["Smoothing","Problem solving","A superordinate goal","Collaborating"],"It plays down differences instead of resolving them."],
     ["A new manager avoids disagreeing with her team because she wants to be liked. Gallo's advice is to…",["Let go of needing to be liked, and don't equate disagreement with unkindness","Avoid conflict until trust is built","Use authoritative command","Agree in public and disagree in private"],"Disagreement handled well is not unkind."]]}
  ]},
{ id:"NG", num:"IX", name:"The Bargain Market", topic:"Negotiation",
  pal:{top:"#0a0e15",bot:"#1c2638",far:"#141c2b",near:"#1f2a3e",tile:"#070a10",edge:"#c79a4b",acc:"#ffd27a",fog:"255,210,122"},
  card:["#1f2a3e","#0a0e15","#ffd27a"],
  enemies:["Fixed Pie","Anchor","Bluff","Lowball","Positional"],
  intro:[
    "The Bargain Market. Every stall in Organa once traded here. Now each merchant guards a fixed pie and trusts no one.",
    "Negotiation is a process in which parties exchange goods or services and try to agree on the rate of exchange. See the real pie, and you will never fight over the wrong one."],
  outro:"The ninth beacon burns. Focus on interests, not positions. Create value before you claim it. And remember: effective negotiation is about beating your fallback.",
  lessons:[
   {title:"The Five Steps", lore:[
     "Negotiation has five steps: <strong>preparation and planning</strong>, <strong>definition of ground rules</strong>, <strong>clarification and justification</strong>, <strong>bargaining and problem solving</strong>, and <strong>closure and implementation</strong>.",
     "Why did the jacket deals vary so much between pairs? Because of anchoring, opening offers and how people responded to them, aspirations, how concessions were made, framing, justification, how information was gathered, and lies and deception. Outcomes depend on skill plus strategy."],
    qs:[
     ["Before a salary talk, a candidate researches market pay, lists her alternatives and sets her walk-away number. Which step is she in?",["Preparation and planning","Clarification and justification","Bargaining and problem solving","Closure and implementation"],"All of this happens before the negotiation starts."],
     ["Two buyers negotiate for the same jacket from the same seller. One aims high and opens first with a well-justified price; the other just asks, 'What's your best price?' The first pays far less. What mainly explains the gap?",["Aspirations, anchoring and justification","Luck","The seller's BATNA changed","Integrative bargaining"],"These are the variance drivers from the jacket exercise."],
     ["After agreeing a vendor contract, the team spells out who delivers what, by when, and how disputes will be handled. Which step?",["Closure and implementation","Definition of ground rules","Preparation","Clarification"],"The deal is formalised and put into practice."]]},
   {title:"Walk-Away", lore:[
     "<strong>BATNA</strong> stands for Best Alternative To a Negotiated Agreement: what you'll do if there's no deal. Assessing it is the <strong>first step</strong>. List your alternatives, value each one, and the best becomes your BATNA.",
     "Your <strong>reservation value</strong> (walk-away or resistance point) comes from your BATNA, your reality if there's no deal. It is not what you aspire to, not what feels fair, and not set by sunk costs.",
     "The <strong>ZOPA</strong> (zone of possible agreement, or settlement range) covers every deal between the two sides' resistance points. If the seller's minimum is above the buyer's maximum, there is no ZOPA. Each side also has a <strong>target point</strong>: its aspiration.",
     "Knowing your own BATNA stops you accepting a bad deal or walking away from a good one. Estimating <em>theirs</em> tells you how far you can push."],
    qs:[
     ["You hold a ₹20L offer and are negotiating with a second firm. Your reservation value with the second firm should rest on…",["The value of the ₹20L offer, your BATNA","What feels fair","What your MBA cost","Your dream salary"],"Your walk-away point is your reality without this deal."],
     ["The seller won't go below ₹50,000 and the buyer can't go above ₹62,000. The ZOPA is…",["₹50,000 to ₹62,000","₹0 to ₹50,000","Above ₹62,000","There is none"],"It's every deal between the two resistance points."],
     ["The seller's minimum is ₹70,000 and the buyer's maximum is ₹62,000, with nothing else on the table. What should happen?",["No ZOPA exists, so both should take their BATNAs","Split the difference at ₹66,000","The buyer must pay ₹70,000","Anchor harder"],"With no overlap, any deal leaves one side worse off than walking away."],
     ["A supplier keeps pressing you because it knows no other vendor can deliver in time. What is it exploiting?",["Your weak BATNA","Its own reservation value","Integrative potential","Your target point"],"A poor alternative limits how far you can push back."]]},
   {title:"Claiming", lore:[
     "<strong>Distributive</strong> bargaining divides a fixed pie. It is win–lose, focused on positions ('I can't go beyond this'), with opposed interests, little information sharing and a short-term relationship.",
     "<strong>Integrative</strong> bargaining expands the pie so both sides are satisfied. It is win–win, focused on interests ('Can you explain why this matters to you?'), with congruent interests, a lot of information sharing and a long-term relationship.",
     "Skilled negotiators sequence the two. First <strong>clarify needs</strong>, <strong>articulate interests</strong> rather than positions, and <strong>avoid early compromise</strong>. Then <strong>set high goals</strong>, and <strong>slice the pie</strong> with progressively smaller concessions.",
     "First offers anchor. If you make one, base it on the ZOPA and your aspirations, justify it, and mind the relationship. Faced with an aggressive offer, ignore it, ask for justification, or counter. Faced with a generous one, accept, counter, or ask why."],
    qs:[
     ["A one-time buyer at a flea market haggles only on price, reveals nothing about why he wants the item, and will never see the seller again. This is…",["Distributive bargaining","Integrative bargaining","Collaborating","A superordinate goal"],"Fixed pie, positions, no information shared, short term."],
     ["A firm cares most about delivery speed and its supplier about volume certainty. They sign a longer contract with faster delivery. This is…",["Integrative bargaining","Distributive bargaining","Compromise","Avoiding"],"Each side's interests were met, so the pie grew."],
     ["A recruiter opens a salary talk with an unexpectedly aggressive low offer. A sensible response is to…",["Avoid anchoring on it: ask for justification, or counter with your own justified number","Accept fast before it gets worse","Split the difference with your target","Walk out immediately"],"Don't let an extreme anchor set the range."],
     ["Why should integrative negotiators avoid compromising early?",["Early compromise often leaves value on the table before both sides' interests are understood","Compromise is always unethical","It weakens their BATNA","It creates a ZOPA"],"Explore interests first; then slice the pie."]]},
   {title:"Pitfalls", lore:[
     "Common pitfalls: <strong>premature judgement</strong>, <strong>searching for a single answer</strong>, <strong>assuming a fixed pie</strong>, and <strong>thinking that solving their problem is their problem</strong>.",
     "Individual differences shape outcomes too: personality, moods and emotions, cultural differences and gender.",
     "From <em>Getting to Yes</em>: craft agreements by focusing on <strong>interests, not positions</strong>. A position is what someone says they want; an interest is why they want it.",
     "Two siblings fight over one orange and cut it in half. One wanted the juice, the other only the peel for baking. They assumed a fixed pie and never asked about interests."],
    qs:[
     ["A buyer insists on a 15% price cut. Asked why, she explains that her real problem is cash flow this quarter. The seller offers 90-day payment terms at full price, and she agrees. What happened?",["Moving from her position to her interest unlocked a better deal","Distributive bargaining","The seller lowered his reservation value","Anchoring"],"Interests, not positions."],
     ["A negotiator thinks, 'Their budget-approval problem isn't my concern.' Which pitfall is this?",["Thinking that solving their problem is their problem","Premature judgement","Searching for a single answer","Fixed pie"],"Helping them solve their problem can make the deal possible."],
     ["Management walks into wage talks sure that any gain for the union must be a loss for the company. Which pitfall?",["Assuming a fixed pie","Searching for a single answer","Premature judgement","Lies and deception"],"It blinds them to trades that could create value for both sides."]]},
   {title:"Split the Pie", lore:[
     "Nalebuff and Brandenburger (HBR, 2021): the <strong>pie</strong> is not the total value. It is the <strong>extra value created by agreeing</strong>, over and above the sum of both sides' BATNAs.",
     "Both sides are <strong>equally essential</strong> to that pie: without either one, it vanishes. So it should be <strong>split equally</strong>, whatever each side's size or fallback. Each side gets its BATNA plus half the pie.",
     "Take a pizza. Without a deal, Alice gets 4 slices and Bob 2. Together they get 12. The pie is 12 − 6 = 6, so Alice gets 4 + 3 = <strong>7</strong> and Bob 2 + 3 = <strong>5</strong>. Not 8:4 (the power view), and not 6:6 (the naive fairness view).",
     "Splitting in proportion to size, as in a merger of equals, is wrong, and so is splitting the difference between a fair offer and an unfair one: halfway between unfair and fair is still unfair. If the pie's size is uncertain, split it as it's created, per unit. Caring more doesn't change the split. Effective negotiation is about <strong>beating your fallback</strong>."],
    qs:[
     ["Anju can earn $50 on her own and Bharat $400. Pooled, they earn $750. Under the split-the-pie principle, Anju should get…",["$200","$150","$375","$50"],"Pie = 750 − 450 = 300. Anju gets 50 + 150 = 200; Bharat gets 400 + 150 = 550."],
     ["Firm A (worth 60) and Firm B (worth 40) merge, creating 30 in synergies. A banker proposes splitting the synergies 60:40. Nalebuff would say…",["Split them 15:15, because both firms are equally needed to create them","60:40 is fair because A is bigger","A deserves all of it","Split by headcount"],"Either side walking away kills the whole 30."],
     ["A giant beverage firm can cut a start-up's bottle cost from 19¢ to 11¢, but future volume is uncertain. How should they split the savings?",["Price at 15¢ a bottle, so each gains 4¢ whatever the volume","11¢, because the giant has more power","Keep it at 19¢","Make one payment based on a volume guess"],"Splitting per unit handles the uncertainty."],
     ["One side offers a fair split, the other an unfair one, and someone suggests meeting in the middle. The article's answer is…",["Halfway between unfair and fair is still unfair","Meeting in the middle is always fair","The larger party should decide","Whoever cares less should get more"],"Anju rejected Bharat's split-the-difference offer of $175 for exactly this reason."]]}
  ]},
{ id:"GT", num:"X", name:"The Desert of Many", topic:"Groups & teams",
  pal:{top:"#130b0b",bot:"#33201b",far:"#261613",near:"#3a241e",tile:"#100807",edge:"#d08a6a",acc:"#ffc2a1",fog:"255,194,161"},
  card:["#3a241e","#130b0b","#ffc2a1"],
  enemies:["Social Loafing","Groupthink","Free Rider","Withdrawal","Conformity"],
  intro:[
    "The Desert of Many. Here Organa's people learned they could not survive alone, and then that simply being together was not enough.",
    "Teams don't happen. They need to be made to happen."],
  outro:"The tenth beacon burns, and the second realm's light holds. Above you, a Spire waits. People, performance, motivation, conflict, negotiation and teams: none of it is random. Understand it, design for it, and lead. Your quiz awaits.",
  lessons:[
   {title:"The Desert Trial", lore:[
     "In the Desert Survival exercise, members ranked 15 items alone, then agreed on one group ranking by consensus, with no voting, and compared both against an expert's ranking.",
     "The expert's logic: <strong>stay put and get found</strong>, and protect yourself from heat and dehydration. So the cosmetic mirror (for signalling) and the top coats (to slow water loss) rank highest, and the water third. The pistol, compass and air map matter far less.",
     "The lessons: teams usually reach better decisions than individuals; <strong>influence</strong> is key to team effectiveness; teams run on interpersonal processes (communication, influence, conflict resolution and negotiation); and each member plays a different role.",
     "Team roles include the <strong>creator</strong> (initiates ideas), <strong>promoter</strong> (champions them), <strong>assessor</strong> (analyses options), <strong>organiser</strong> (provides structure), <strong>producer</strong> (provides direction and follow-through), <strong>controller</strong> (checks details and enforces rules), <strong>maintainer</strong> (fights external battles), <strong>adviser</strong> (encourages the search for more information) and <strong>linker</strong> (coordinates and integrates)."],
    qs:[
     ["In the desert exercise, a team's consensus ranking lands closer to the expert's than most members' individual rankings. This shows…",["Teams often decide better by integrating diverse information","Social loafing","Groupthink","Process losses"],"Pooling information beats most individuals."],
     ["One member keeps urging the group to dig for more information before deciding. Which team role is this?",["Adviser","Controller","Promoter","Producer"],"The adviser encourages the search for more information."],
     ["A member makes sure the plan gets carried out on time and chases every action item. Which role?",["Producer","Creator","Assessor","Linker"],"The producer provides direction and follow-through."],
     ["Why does the expert rank the cosmetic mirror first?",["Signalling for rescue matters most, because the strategy is to stay put and get found","It's lightweight","To check for sunburn","To start a cooking fire"],"Being found fast is what saves lives."]]},
   {title:"Synergy", lore:[
     "<strong>Actual group effectiveness = potential effectiveness + process gains − process losses.</strong> Positive synergy means the team does better than any of its individuals.",
     "Synergy comes from integrating information from diverse views, complementary skills, and open communication with active listening.",
     "Process losses come from conflict, withdrawal, disengagement, a lack of psychological safety, groupthink and social loafing. Manage these and the whole becomes greater than the sum of its parts."],
    qs:[
     ["A team of five stars underperforms its best individual, because members talk over each other and quiet experts are never heard. In synergy terms…",["Process losses exceeded process gains","Potential effectiveness was low","This is positive synergy","This is social facilitation"],"Talent was there; the process wasted it."],
     ["Which change most directly creates process gains?",["Structured turn-taking, so diverse views are heard and integrated","Adding more members","Removing all disagreement","Letting the boss decide alone"],"Integrating diverse information is a source of synergy."],
     ["Members stop raising concerns after one was mocked in a meeting. Which source of process loss is this?",["Lack of psychological safety","Social loafing","Complementary skills","A superordinate goal"],"People withhold input when speaking up feels unsafe."]]},
   {title:"The Effective Team", lore:[
     "The <strong>team effectiveness model</strong> groups its factors into three sets.",
     "<strong>Context</strong>: adequate resources, leadership and structure, a climate of trust, and performance evaluation and reward systems.",
     "<strong>Composition</strong>: members' abilities, personality, allocation of roles, diversity, cultural differences, team size and member preferences.",
     "<strong>Process</strong>: common purpose, specific goals, team efficacy, team identity, cohesion, shared mental models, conflict levels and social loafing. Trust underpins it all, and both leadership and followership matter."],
    qs:[
     ["A team has talented, well-matched members and a clear purpose, but rewards are based only on individual sales, so nobody helps anybody. Which part of the model is failing?",["Context: performance evaluation and reward systems","Composition: abilities","Process: mental models","Composition: size"],"The reward system undercuts teamwork."],
     ["A project team has 22 members and coordination is chaos. Which factor should change?",["Composition: team size","Context: resources","Process: team identity","Context: trust"],"Large teams struggle to coordinate, and loafing rises."],
     ["Members share a common purpose but disagree on what 'done' means and how the system works. Which process factor is weak?",["Shared mental models","Team identity","Climate of trust","Member preferences"],"They hold different pictures of the work."]]},
   {title:"The Idle Hand", lore:[
     "<strong>Social loafing</strong> is the tendency of some members to put in less effort in a group than they would working alone.",
     "Reduce it by: identifying individual performance in a measurable way, forming smaller work groups, stating expectations and goals clearly, giving direct and immediate feedback, and building cohesion by restating the larger purpose."],
    qs:[
     ["In a 9-member class project, two members rarely contribute because the team gets one shared grade. Best fix?",["Make each member's contribution visible and measurable, with owned sections and peer evaluation","Add more members","Keep the single shared grade","Let the leader do it all"],"Measurable individual output reduces loafing."],
     ["Why does splitting a 12-person team into three pods of four often reduce loafing?",["In smaller groups, individual effort is more visible and harder to hide","Smaller groups have less talent","It creates groupthink","It removes goals"],"Visibility drives accountability."],
     ["A member says, 'My bit won't change the outcome anyway.' This mindset is at the core of…",["Social loafing","Groupthink","Status conflict","Equity theory"],"Felt dispensability invites free riding."]]},
   {title:"One Voice", lore:[
     "<strong>Groupthink</strong>: well-intentioned people make faulty decisions because group pressure and conformity make it hard to dissent.",
     "To reduce it: don't state a preferred solution early; regularly split into subgroups, then bring everyone back together; invite outsiders to challenge the group's ideas; get feedback from different stakeholders; and role-play how others will react.",
     "Group behaviour differs from individual behaviour. Teams don't happen; they need to be designed to happen."],
    qs:[
     ["A CEO opens a strategy meeting with, 'I'm leaning strongly toward option B. Thoughts?' What risk has she raised?",["Groupthink, by stating a preference early","Social loafing","Distributive bargaining","Inequity"],"An early preference from the leader chills dissent."],
     ["Which practice best counters groupthink in a cohesive leadership team?",["Work in independent subgroups, then reconvene, and invite an outsider to challenge","Hold one long meeting to reach consensus fast","Invite only senior members","Let the leader speak first"],"Both practices are on the list of remedies."],
     ["A tight-knit team dismisses a junior's warning about a product flaw because 'we always get this right'. Which phenomenon?",["Groupthink","Social loafing","Process gains","Trait activation"],"Cohesion plus overconfidence silences dissent."]]}
  ]},
{ id:"LD", num:"XI", name:"The Commander's Spire", topic:"Leadership",
  pal:{top:"#140a0a",bot:"#301616",far:"#241010",near:"#381a18",tile:"#0f0707",edge:"#d9694f",acc:"#ffb09a",fog:"255,176,154"},
  card:["#381a18","#140a0a","#ffb09a"],
  enemies:["Autocrat","Micromanager","Pushover","Bystander","Silence"],
  intro:[
    "The Commander's Spire. A third realm rises above Organa, and its beacons answer to one thing only: leadership.",
    "The Mentor looks up and does not climb. 'I was the last to try,' he says. 'I stopped asking, and the dark came in behind me. You go on.'",
    "Here no one is made to follow. They follow, or they do not, and the whole of the art lies in why.",
    "The stones ahead hold the leaders' lessons. Read them, then climb."],
  outro:"The eleventh beacon burns. Leadership is influence, aimed at a vision, built on trust, and never the same twice.",
  lessons:[
   {title:"Two Compasses", lore:[
     "<strong>Leadership</strong> is the ability to influence a group toward the achievement of a vision or set of goals. The influence can be <strong>formal</strong> (a title) or <strong>informal</strong> (respect earned without one).",
     "Leadership is shaped by what you already know: personality, perception, motivation and conflict all colour a leader's style.",
     "<strong>Ohio State</strong> found two independent dimensions: <strong>initiating structure</strong> (defining roles, goals, how work gets done) and <strong>consideration</strong> (care for people, trust, respect). A leader can be high or low on each. The <strong>Michigan</strong> studies contrasted job-centred (production-focused) with employee-centred leaders.",
     "<strong>Blake & Mouton's Managerial Grid</strong> plots concern for production against concern for people: <strong>impoverished</strong> (low, low), <strong>country club</strong> (low production, high people), <strong>task / authority</strong> (high production, low people), <strong>middle-of-the-road</strong> and <strong>team management</strong> (high on both, the ideal)."],
    qs:[
     ["A manager insists on rigid schedules and checks every output, but never asks how her team is coping. On the Blake & Mouton grid she sits closest to…",["Task management: high production, low people","Country club","Impoverished","Team management"],"All the concern is for output; none for people."],
     ["A leader keeps everyone happy, avoids hard targets and tolerates missed deadlines to protect morale. This is…",["Country club management","Task management","Team management","Middle-of-the-road"],"High concern for people, low for production."],
     ["In the Ohio State studies, a leader who clarifies roles, sets deadlines and defines procedures is high on…",["Initiating structure","Consideration","Concern for people","Employee-centredness"],"Initiating structure is about defining and organising the work."],
     ["A senior analyst with no title is the one colleagues turn to for direction during a crisis, and they follow her. This illustrates…",["Informal leadership: influence without formal authority","Transactional leadership","Positional power","Impoverished management"],"Leadership is influence, whether or not a title backs it."],
     ["Why is team management (high on production and people) considered the ideal on the grid?",["It combines results with commitment from engaged people","It avoids all conflict","It needs no decisions","It works only in small firms"],"Both concerns, high together, produce committed performance."]]},
   {title:"The Anele Question", lore:[
     "In the EcoLo simulation you were Interim Head of Product at Move, a smart mobility platform in Ireland, deciding whether the Lead Engineer, Anele, should be <strong>retained or replaced</strong> before a carbon-offsetting tool launched.",
     "Time pressure was only one force acting on you. Your own <strong>biases</strong>, first impressions, who you trusted, and whether you blamed the person or the situation all shaped your confidence in the launch.",
     "Across the episodes, confidence in the launch moved as new information arrived. The debrief asked what was changing it: facts, or the way you were reading them.",
     "Reasons to <strong>retain</strong> usually point to knowledge, context and fixable causes. Reasons to <strong>replace</strong> point to repeated, consistent shortfalls that coaching has not fixed. A good leader tests which story the evidence supports."],
    qs:[
     ["The EcoLo launch slips and you immediately think, 'Anele just isn't up to it', without checking what blocked her. Which error are you making?",["Fundamental attribution error: blaming the person, not the situation","Halo effect","Anchoring","Groupthink"],"Attributing to disposition while overlooking the situation is the classic error."],
     ["Before deciding on Anele, the best first step is to…",["Understand her view of what went wrong and test it against evidence","Replace her to show decisiveness","Ask the team to vote","Wait until the launch fails"],"Exploration before action gives you the real causes."],
     ["Under heavy time pressure, you accept the first plausible story about why the build is delayed. Which tendency does this show?",["Satisficing under bounded rationality","Social loafing","Equity thinking","Transformational vision"],"You stop at the first good-enough explanation."],
     ["Which evidence best supports replacing a lead engineer rather than retaining her?",["Repeated shortfalls across contexts despite clear expectations and support","One bad sprint","A personality clash with you","A rumour from another team"],"Consistency across situations, after support, points to a person-level issue."],
     ["In the simulation, your confidence in the launch swings up and down as each episode adds information. The most useful reflection is to ask…",["Which of my judgements came from facts and which from my own biases","Who is to blame","How to hide the swings","Why the simulation was unfair"],"Seeing your own reading of the data is the lesson."]]},
   {title:"Explore or Execute", lore:[
     "The simulation looked at your <strong>exploration</strong> and <strong>execution</strong> focus.",
     "<strong>Exploration</strong> is empathy, openness and curiosity: listening, asking, understanding before acting.",
     "<strong>Execution</strong> is taking action, the 'let us get it done' mindset: decisions, deadlines, delivery.",
     "Use exploration when the problem is unclear, the people are uncertain, or trust is thin. Use execution when the path is clear, time is short, and the team is aligned. Leaders who only execute run past the real problem; leaders who only explore never ship."],
    qs:[
     ["A new team is demoralised after a reorganisation and nobody is sure why targets changed. Your first priority as leader is…",["Exploration: listen, understand concerns, rebuild clarity","Execution: issue new tasks immediately","Cut the targets","Announce a deadline"],"When people and the problem are unclear, explore first."],
     ["A server outage is costing money every minute and the fix is known. The leader should…",["Execute: assign the fix and move now","Hold a feelings circle","Commission a survey","Wait for consensus"],"Clear path, time short: act."],
     ["A leader who keeps asking questions and gathering views while a decision deadline passes is overusing…",["Exploration","Execution","Transactional exchange","Initiating structure"],"Curiosity without a decision becomes drift."],
     ["A leader who ships fast, but keeps solving the wrong problem because she never asks the customer, is overusing…",["Execution","Exploration","Consideration","Trust"],"Action without understanding aims at the wrong target."],
     ["Which statement about exploration and execution is best?",["Effective leaders flex between them as the situation demands","Exploration is for weak leaders","Execution is always superior","Pick one style for life"],"Situational flexibility is the skill."]]},
   {title:"Two Banners", lore:[
     "<strong>Transactional leadership</strong> works through exchange: clear expectations, rewards for meeting them (contingent reward), and corrective action when standards slip. It keeps routine work on track.",
     "<strong>Transformational leadership</strong> lifts followers beyond self-interest. It builds a compelling vision, inspires, challenges old assumptions (intellectual stimulation) and develops each person individually.",
     "The two are not enemies. Transformational leadership builds on a transactional base: you still need clear goals and fair rewards, and then you add meaning."],
    qs:[
     ["A manager promises a bonus for hitting the quarterly target and steps in only when numbers fall short. This is…",["Transactional leadership","Transformational leadership","Laissez-faire","Informal leadership"],"Exchange of reward for performance, with management by exception."],
     ["A leader paints a vivid picture of why the product matters, coaches each engineer on growth, and invites challenges to old methods. This is…",["Transformational leadership","Transactional leadership","Task management","Country club management"],"Vision, individual attention and intellectual stimulation."],
     ["A firm in an urgent turnaround needs stable operations and also needs people to believe again. Best leadership approach?",["Transactional base for control, with transformational vision on top","Pure laissez-faire","Only rewards","Only inspiration"],"The two styles complement each other."],
     ["Which behaviour is most clearly 'intellectual stimulation'?",["Asking the team to question how the process is done and propose better ways","Setting a bonus slab","Checking attendance","Fixing the roster"],"Challenging assumptions is the transformational lever."]]},
   {title:"The Trust Bridge", lore:[
     "<strong>Trust</strong> is a psychological state of mutual positive expectations: both parties depend on each other and care about each other's welfare. Followers who trust a leader are confident their rights and interests will not be abused.",
     "Leaders create <strong>psychological safety</strong>: people can take risks, fail, and share information without fear.",
     "In the trust model, <strong>trust propensity</strong> is how likely an employee is to trust a leader to begin with. It differs between people before the leader does anything."],
    qs:[
     ["A junior discovers an error in the plan but stays silent because the last person who raised one was mocked. What is missing?",["Psychological safety","Trust propensity","Initiating structure","Contingent reward"],"People withhold when speaking up feels unsafe."],
     ["Two new hires receive the same warm welcome from the same leader. One trusts her at once; the other holds back for months. This difference is mainly…",["Trust propensity","Transformational charisma","Role clarity","Consideration"],"People differ in their starting willingness to trust."],
     ["Which leader action most directly builds psychological safety?",["Thanking someone publicly for flagging a problem and acting on it","Punishing mistakes quickly","Keeping information tight","Rewarding silence"],"Rewarding candour makes it safe to repeat."],
     ["A leader consistently keeps promises, shares information openly and shows concern for people's welfare. Over time, followers will most likely…",["Feel confident that their interests won't be abused, and take more risks","Become dependent","Lose initiative","Distrust her"],"That is the definition of earned trust."]]}
  ]},
{ id:"TM", num:"XII", name:"The Muster Fields", topic:"Talent management",
  pal:{top:"#0b140a",bot:"#1f3318",far:"#162510",near:"#25401b",tile:"#080f07",edge:"#86b85a",acc:"#cdf29a",fog:"205,242,154"},
  card:["#25401b","#0b140a","#cdf29a"],
  enemies:["Vacancy","Mis-hire","Interview Bias","Attrition","Gap"],
  intro:[
    "The Muster Fields. Organa's guilds once drew their people from these fields. Now heritage hotels line the horizon, and half of their people have walked away.",
    "GreenStay must staff twenty-five properties in six weeks. Talent management is how an organisation finds, picks, grows and lets go of the right people.",
    "Count carefully. Here the numbers matter."],
  outro:"The twelfth beacon burns. Plan the need, search wide, specify the person, choose with evidence, and interview with discipline.",
  lessons:[
   {title:"The Four Fields", lore:[
     "<strong>Talent management</strong> is a culture-building process. A manager owns four areas: <strong>managing selection, managing performance, managing development, and managing exits</strong> (voluntary and involuntary).",
     "The process runs: <strong>carry out the needs analysis</strong> → <strong>explore resources</strong> (internal and external) → <strong>attract applications</strong> → <strong>use an adequate selection mechanism</strong> → <strong>make an offer and onboard</strong> → <strong>compensation and appraisal</strong>.",
     "Everything starts with the needs analysis. Without knowing how many people, of what kind, by when, the rest is guesswork."],
    qs:[
     ["A manager starts hiring because 'we feel short-staffed', with no analysis of roles, numbers or skills. Which step was skipped?",["Workforce needs analysis","Onboarding","Appraisal","Offer making"],"The process begins with a needs analysis."],
     ["Which is NOT one of the four areas of a manager's talent management responsibility?",["Managing the share price","Managing selection","Managing development","Managing exits"],"The four are selection, performance, development and exits."],
     ["The correct order in the talent management process is…",["Needs analysis, explore resources, attract, select, offer and onboard, pay and appraise","Offer, select, attract, needs analysis","Appraise, attract, select, offer","Select, attract, analyse, offer"],"Analyse first, appraise last."],
     ["A resignation exit interview reveals a pattern of people leaving after being passed over for development. This signals a weakness in…",["Managing development, which feeds back into attrition","Managing selection only","Payroll processing","Office layout"],"The four areas are linked; poor development drives exits."]]},
   {title:"The Count of the Fallen", lore:[
     "GreenStay Hotels acquired 50 heritage properties and will rebrand <strong>25</strong>. Each hotel has five levels: <strong>L1 Executive 1</strong> (attrition 20%), <strong>L2 Managers 5</strong> (30%), <strong>L3 Supervisors 10</strong> (40%), <strong>L4 Associates 25</strong> (50%), <strong>L5 Support staff 30</strong> (40%).",
     "<strong>Workforce demand</strong> per hotel is 1 + 5 + 10 + 25 + 30 = <strong>71</strong>. For 25 hotels: L1 25, L2 125, L3 250, L4 625, L5 750, a total of <strong>1,775</strong>.",
     "<strong>Workforce supply</strong> shrinks by attrition. Applying the rates: L1 loses 5, L2 about 38, L3 100, L4 about 313, L5 300, roughly <strong>755 people</strong> to replace, in six weeks.",
     "<strong>Internal resources</strong> (promotions, transfers from the divested properties, redeployment) are faster and cheaper, and keep culture. <strong>External resources</strong> (campus, agencies, competitors, referrals) bring new skills but cost time and money."],
    qs:[
     ["For 25 hotels at 25 associates each, total Level 4 demand is…",["625","250","125","750"],"25 × 25 = 625."],
     ["Total demand per hotel across all five levels is…",["71","60","65","80"],"1 + 5 + 10 + 25 + 30 = 71."],
     ["With 250 supervisors needed across the 25 hotels and 40% attrition, about how many supervisors must be replaced?",["100","40","25","150"],"250 × 0.40 = 100."],
     ["Level 5 demand is 750 across the hotels, with 40% attrition. How many support staff leave?",["300","250","375","150"],"750 × 0.40 = 300."],
     ["Which level shows the highest attrition rate, and so threatens guest experience most directly, per the case?",["Level 4 associates (50%)","Level 1 executives (20%)","Level 3 supervisors (40%)","Level 2 managers (30%)"],"The case flags associates at 50%."],
     ["GreenStay has a six-week deadline. For supervisor roles, which source is usually fastest and best for culture?",["Internal promotion or transfer of experienced staff","Slow campus recruitment","Training cohorts from scratch","Relying on agencies only"],"Internal moves cut time and preserve values."],
     ["Hiring Level 4 chefs and waitstaff from competitor chains is an example of…",["External sourcing","Internal sourcing","Succession planning","Job rotation"],"Competitors are an external source."]]},
   {title:"The Scroll and the Sieve", lore:[
     "<strong>Job analysis</strong> yields two documents. The <strong>job description</strong> defines the <em>job</em>: tasks, activities and responsibilities, with a definite outcome. The <strong>job (role) specification</strong> defines the <em>person</em>: education, experience, skills, attitudes and behaviours needed.",
     "<strong>Competencies</strong> are knowledge, skills and behaviours needed to succeed. Split them into <strong>technical / functional</strong> (what you know: finance, F&B operations, sales) and <strong>behavioural</strong> (how you act: leadership, empathy, cultural intelligence). Then classify each as <strong>critical to success</strong> or <strong>good to have</strong>.",
     "For the GreenStay General Manager of a heritage property, essential attributes include leadership, attention to detail, sound financial management, communication and guest focus, willingness to take feedback, tech savviness and cultural intelligence."],
    qs:[
     ["'Oversees Rooms Division, F&B and Housekeeping; manages budgets; resolves guest escalations.' This statement belongs in the…",["Job description","Job specification","Selection matrix","Appraisal form"],"It describes tasks and responsibilities."],
     ["'Minimum four years in guest services; excellent communication; strong sales and marketing background.' This belongs in the…",["Job specification","Job description","Pay structure","Exit policy"],"It describes the qualities needed in the person."],
     ["For the heritage GM, 'sound financial management' (budgets, profitability) is best classed as…",["Technical competency, critical to success","Behavioural competency, good to have","Behavioural, critical","Technical, good to have"],"It is functional and essential to the role."],
     ["'Cultural intelligence' for a GM managing a diverse hospitality team across Karnataka and Kerala is best classed as…",["Behavioural competency, critical","Technical, good to have","Technical, critical","Irrelevant"],"How the GM engages people is behavioural, and the values stress diversity."],
     ["Why should competency mapping be done before advertising a role?",["It defines what to select for, and so shapes every later step","It decides salary only","It replaces interviews","It is a legal formality"],"Selection depends on knowing the needed attributes."]]},
   {title:"The Sorting Stones", lore:[
     "<strong>Selection methods</strong> measure different attributes: <strong>intelligence and cognitive tests</strong> (reasoning, numerical and verbal ability), <strong>motor skills tests</strong> (dexterity, reaction time), <strong>personality tests</strong> (enduring traits), <strong>work samples and simulations</strong> (actual job performance), <strong>situational judgement / in-basket exercises</strong> (judgement in context), <strong>group discussions and tasks</strong> (communication, leadership, team behaviour), <strong>essays</strong> (written communication, motivation) and <strong>structured interviews</strong>.",
     "Choose a method by: <strong>number of applicants, criticality of the position, cost and effort, predictive validity, and preparation required</strong>."],
    qs:[
     ["For hiring a cashier, the most direct evidence of job performance would be…",["A work sample or simulation at a till","A personality test only","An essay","A group discussion"],"Work samples measure actual job performance."],
     ["To judge how a hotel front-desk candidate handles an angry guest, use…",["A situational judgement exercise","A motor skills test","A numerical test","An essay on hospitality"],"It assesses judgement in a specific context."],
     ["For a role receiving 3,000 applications, which factor mainly pushes you to a cheap first-stage test before interviews?",["Number of applicants","Criticality","Predictive validity","Preparation required"],"Volume demands efficient screening."],
     ["A group discussion exercise is most useful for assessing…",["Communication, leadership and team behaviour","Manual dexterity","Vocabulary","Reaction time"],"Observing interaction shows team behaviours."],
     ["For a very critical senior position, you would rationally accept more cost and effort in order to get…",["Higher predictive validity","Fewer applicants","Faster hiring","Less preparation"],"Criticality justifies investing in validity."]]},
   {title:"The Interview Hall", lore:[
     "The interview is <strong>comforting to the assessor and used by almost every organisation</strong>, yet it is among the <strong>least reliable</strong> methods compared with well-designed tests and weighted application forms. Past behaviour is a good predictor of future behaviour, and an interview is a sample of representative behaviours, with all the usual sampling errors.",
     "A <strong>situational interview</strong> asks what you would do in a hypothetical (the angry customer and the late watch). A <strong>situational event interview</strong> and a <strong>behavioural event interview</strong> ask for past incidents: 'Tell me about a time you managed a conflict.'",
     "<strong>3 C's:</strong> <strong>context</strong> (physical and psychological), <strong>content</strong> (clarity on attributes and questions), <strong>conduct</strong> (the interviewer speaks about one-third of the time, shows dignity, lets people open up).",
     "Do: set clear criteria, use a structured format with the same questions for all, take notes, listen actively. Don't: show bias, ask non-job-related or discriminatory questions, dominate, rush, or neglect follow-up."],
    qs:[
     ["'Tell me about a time you had to handle a conflict in your team.' This is a…",["Behavioural event question","Situational hypothetical","Motor skills test","Personality inventory"],"It asks for a past incident."],
     ["'A guest arrives to a room that isn't ready and is furious. What would you do?' This is a…",["Situational question","Behavioural event question","Work sample","Group task"],"It poses a hypothetical."],
     ["Why does a structured interview with the same questions for all candidates improve selection?",["It makes candidates comparable and reduces bias","It is quicker","It avoids notes","It avoids preparation"],"Consistency supports fair comparison."],
     ["In a good interview the interviewer should speak roughly…",["One-third of the time","Two-thirds","Never","All of it"],"Conduct: let the candidate open up."],
     ["Which question should an interviewer avoid?",["'Are you planning to have children soon?'","'Describe a project you led.'","'How did you resolve a disagreement?'","'What would you do differently?'"],"It's not job-related and may be discriminatory."],
     ["Despite being less reliable than well-designed tests, interviews remain popular mainly because…",["They are comforting to the assessor","They are the best predictors","They are cheap and unbiased","The law requires them"],"Assessors trust what they can see and feel."]]}
  ]},
{ id:"PM", num:"XIII", name:"The Ledger Tower", topic:"Performance management",
  pal:{top:"#0a1118",bot:"#172a3a",far:"#101f2c",near:"#1c3447",tile:"#070c11",edge:"#5a9bc4",acc:"#a8dcff",fog:"168,220,255"},
  card:["#1c3447","#0a1118","#a8dcff"],
  enemies:["Vanity Metric","Gamed KPI","Wall of Shame","Headcount Cut","Silo"],
  intro:[
    "The Ledger Tower. Organa's counting-houses kept their books here. Every floor keeps a count, and every count changes how the people below it behave.",
    "A CFO named Hiram once built a ledger that shone with good numbers, and found out what they cost.",
    "Climb carefully. What you measure is what you get, and sometimes it is more than you wanted."],
  outro:"The thirteenth beacon burns. Measure what matters, tell people why, and watch for what the measure does to them.",
  lessons:[
   {title:"The Cascade", lore:[
     "<strong>Performance management</strong> is a dynamic, continuous, organisation-wide process. Strategy is translated into goals at the <strong>organisation, department, team and individual</strong> levels. This <strong>cascading of goals</strong> embeds strategy in individual jobs.",
     "<strong>Performance appraisal</strong> is narrower: it works at the individual level, evaluates performance against goals, gives developmental feedback, and is tied to rewards and recognition.",
     "Appraisal is one tool inside performance management, not a substitute for it."],
    qs:[
     ["A firm's strategy is 'faster delivery'. Which is the best example of cascading?",["Company goal → depot lead-time goals → team goals → individual pick-and-pack targets","A yearly rating form","A bonus pool","An employee survey"],"Goals flow down so strategy reaches individual jobs."],
     ["Which statement best distinguishes performance management from appraisal?",["Management is continuous and strategic; appraisal evaluates an individual against goals","They are identical","Appraisal is organisation-wide","Management happens once a year"],"Appraisal is one individual-level component."],
     ["A company runs an annual appraisal but nobody can say how team goals connect to strategy. The gap is in…",["Performance management (alignment and cascading)","Payroll","Recruitment","Onboarding"],"Appraisal exists, but the strategic link doesn't."],
     ["Which feature belongs to performance appraisal rather than to performance management as a whole?",["Developmental feedback tied to rewards for an individual","Aligning strategy to team goals","Tracking strategy implementation","Improving organisational effectiveness"],"Appraisal is individual-level."]]},
   {title:"The Four Seasons", lore:[
     "TV Rao's performance management cycle has four stages. <strong>1. Performance planning</strong>: how does the individual contribute to the big picture; set KRAs, metrics, targets and <strong>SMART</strong> objectives aligned to the business plan; agree a personal development plan.",
     "<strong>2. Managing and assessing performance</strong>: assess against objectives; input from self, peers, internal customers; recognise good performance; identify issues early; update objectives as required.",
     "<strong>3. Performance review and counselling</strong>: focus on performance and improvement, transparent rating, supervisor involvement, evaluation of context.",
     "<strong>4. Development dialogues</strong>: focus on potential and future needs, career and succession planning, finalise the development plan.",
     "<strong>Traditional methods</strong> include ranking, graphic rating scales and forced distribution; <strong>modern methods</strong> include MBO, 360-degree feedback and continuous check-ins."],
    qs:[
     ["A manager and employee meet in April to set three SMART objectives tied to the business plan. Which stage?",["Performance planning","Review and counselling","Development dialogue","Managing performance"],"Planning sets KRAs and targets."],
     ["During the year, a manager spots an issue early, updates a target after a market shift, and recognises a win. Which stage?",["Managing and assessing performance","Planning","Development dialogue","Exit"],"Ongoing assessment and adjustment."],
     ["A conversation about the employee's long-term potential, career path and succession falls in…",["Development dialogues","Performance planning","Review and counselling","Managing performance"],"Potential and future needs belong to stage 4."],
     ["Which objective is most clearly SMART?",["Reduce order-to-dispatch time from 5 to 3 days by 30 September","Improve service","Try harder on shipping","Be better at deadlines"],"It is specific, measurable, time-bound."],
     ["An appraisal that includes feedback from the employee's peers and internal customers is using…",["360-degree feedback","Forced ranking","A graphic rating scale only","Seniority"],"Multiple sources around the person."]]},
   {title:"Hiram's Ledger", lore:[
     "<strong>Rainbarrel Products</strong> was 'fat and happy': innovative, collegial, customer-minded under CEO Keith Randall, but lacking discipline. <strong>Hiram Phillips</strong>, CFO and chief administrative officer, came in to tighten it.",
     "His <strong>actions</strong>: offered buyouts to the bottom quartile of performers; when too few took them, imposed an <strong>across-the-board 10% headcount cut</strong>; set new call-centre targets with monitoring, peer pressure and a <strong>'Wall of Shame'</strong>; defined 'shipped' (left company property) and 'on time' (the promise made); and changed commissions on employee purchases to reflect <strong>actual price</strong>, replacing a complex subjective system.",
     "His <strong>intended consequences</strong>: reduce cost, raise productivity, make all metrics objective, keep it simple, and focus on money."],
    qs:[
     ["Which was an INTENDED consequence of Hiram's changes?",["Lower labour cost through exits and cuts","Hiding emails to dodge the response clock","Managers firing junior staff to protect seniors","R&D filing patents without commercialising them"],"Cost reduction was the aim."],
     ["Why did Hiram define 'shipped' as leaving company property, and 'on time' as the promise made?",["To make the metric objective and stop disputes over meaning","To lower costs","To reduce headcount","To punish customers"],"Vague terms had made the metric meaningless."],
     ["Replacing a subjective commission system (mentoring, prospecting, account upkeep) with one based only on sales price made the system…",["Simple and objective, but narrower in what it rewarded","More complex","More fair to mentors","Focused on knowledge sharing"],"Objective, yes, but it dropped the non-sales behaviours."],
     ["An across-the-board 10% headcount cut, applied by managers to their own units, is likely to…",["Hit low-level staff hardest, since managers protect higher roles, saving little","Raise morale","Target poor performers precisely","Save more than a cost-based approach"],"Headcount, not cost, drove who was cut."]]},
   {title:"The Gamed Metrics", lore:[
     "<strong>Unintended consequences</strong> at Rainbarrel: employees <strong>avoided opening customer emails</strong> so the '24 hours from opening' clock would not start; salespeople treated current and retired employees poorly because their commission fell; R&D became bean-counting, with patents filed but products not commercialised and a breakthrough product left with no budget.",
     "Salespeople lost <strong>mentoring, role models and knowledge sharing</strong>, and fought over rich territories. Morale fell. Shipments were reported 'shipped' while sitting on a railroad siding.",
     "The deeper causes: <strong>weak CEO oversight and shared governance</strong>, no common understanding of performance, <strong>no communication of goals and expectations</strong>, and no coordination of how actions interacted. Metrics were taken a 'little too strongly'.",
     "The principle: people optimise what is measured. A narrow metric invites <strong>gaming</strong>."],
    qs:[
     ["An employee says, 'Just don't open the email until you're ready; they only check response time after opening.' This is…",["Gaming a metric: meeting the measure while defeating its purpose","Teamwork","Innovation","Transformational leadership"],"The number improves, the outcome doesn't."],
     ["Salespeople stopped mentoring and sharing account knowledge after commissions were tied only to sales price. Best explanation?",["The metric rewarded sales alone, so unrewarded behaviours dropped","Salespeople were lazy","Mentoring was banned","Commission rates rose"],"What isn't rewarded is crowded out."],
     ["Customers heard 'shipped' while goods sat across the street. The underlying failure was…",["Unclear, uncommunicated definitions and weak coordination","Too much monitoring","Too many buyers","Overstaffing"],"No shared meaning of the metric."],
     ["Hiram's 'Wall of Shame' for call-centre performance most likely increased…",["Fear and gaming, with lower morale","Intrinsic motivation","Psychological safety","Knowledge sharing"],"Public shaming damages trust."],
     ["R&D filed more patents but commercialised fewer products. This shows…",["A countable output replacing the real goal","Better goal alignment","Intrinsic motivation","Equity"],"Patents were counted; commercialisation wasn't."]]},
   {title:"The Honest Word", lore:[
     "What should Rainbarrel do now? <strong>Damage control</strong> by using high-performing leaders to drive the right culture; define <strong>strategic goals</strong> that fit its culture; ask 'what do we want employees to do differently, and why aren't they already doing it?'; <strong>seek employees' input</strong>; <strong>communicate expectations</strong>; <strong>align and cascade</strong> goals; give managers some <strong>budget discretion</strong>; <strong>hold managers accountable</strong> with support; and go <strong>beyond pay</strong> to recognition like praise and appreciation.",
     "<strong>Goal-setting theory</strong>: goals work when people can achieve them and <strong>want</strong> to (commitment); a prevention vs promotion focus changes behaviour; MBO builds on this. <strong>Equity and justice theories</strong> explain fairness reactions.",
     "<strong>Good feedback</strong> is specific, states what you observed, explains the impact, pauses for reaction, suggests concrete steps, focuses on performance not personality, and does <strong>not sandwich</strong> the message."],
    qs:[
     ["Which is the best next step for Rainbarrel's management team?",["Define clear strategic goals, communicate them, and cascade them with input from employees","Add more metrics","Cut another 10%","Fire consultants"],"The failures were of clarity, alignment and communication."],
     ["A manager tells a team member, 'You're careless.' Which version is better feedback?",["'In last week's report, three figures were wrong. It delayed the client call. What happened, and how can we prevent it?'","'You always mess up.'","'Great, but sloppy, but great.'","'Try harder.'"],"Specific, observed, impact, pause, next steps."],
     ["Why is the 'feedback sandwich' discouraged?",["It dilutes the message and can leave it unnoticed","It is too direct","It hurts morale","It requires data"],"The important point gets lost."],
     ["Employees reject a stretch goal because they believe they cannot reach it. Goal-setting theory says the problem is…",["Low goal commitment: they don't believe they can achieve it","Too much feedback","Equity","Job design"],"Commitment needs ability and desire."],
     ["Beyond pay, Rainbarrel's leaders could improve performance quickly through…",["Frequent, specific recognition from managers and peers","More monitoring","Layoffs","A new wall of numbers"],"Recognition is low-cost and proximate to the action."]]}
  ]},
{ id:"CP", num:"XIV", name:"The Mint", topic:"Compensation & rewards",
  pal:{top:"#14110a",bot:"#33290f",far:"#261f0b",near:"#3d3112",tile:"#0f0c06",edge:"#d4b04a",acc:"#ffe08a",fog:"255,224,138"},
  card:["#3d3112","#14110a","#ffe08a"],
  enemies:["Pay Gap","Compa-Ratio","Bonus Chaser","Cliff","Midpoint"],
  intro:[
    "The Mint. Organa's coin was struck here before the dark, and not only the kind you can spend.",
    "Pay is a promise about what the organisation values. Struck carelessly, it says the wrong things.",
    "Read the dies and the ranges. The numbers are the easy part. The fairness is the art."],
  outro:"The fourteenth beacon burns. Pay for the position, reward the person, tie it to strategy, and be able to explain it.",
  lessons:[
   {title:"The Five Coins", lore:[
     "<strong>Total rewards</strong> are the monetary and non-monetary return employees get in exchange for their time, talent, effort and results. They have <strong>five elements</strong>: <strong>compensation</strong>, <strong>benefits</strong>, <strong>development and career</strong>, <strong>work environment</strong> (work-life offerings, recognition, culture, work arrangements) and <strong>performance and recognition</strong>.",
     "<strong>Transactional</strong> rewards (pay, benefits) are tangible and market-driven. <strong>Relational</strong> rewards (development, environment, recognition, culture) build the emotional bond.",
     "<strong>Extrinsic</strong> rewards include fixed and variable pay, benefits, promotions, learning, recognition and working conditions. <strong>Intrinsic</strong> rewards are meaningfulness, choice, growth and community."],
    qs:[
     ["A firm can't raise salaries this year, so it adds mentoring, flexible hours and public recognition. It is leaning on…",["Relational elements of total rewards","Fixed pay","Long-term incentives","Pay for time not worked"],"These build the bond without cash."],
     ["Which is a transactional reward?",["Base pay and group health insurance","A sense of community","Coaching and mentoring","Organisational culture"],"Pay and benefits are the market-driven exchange."],
     ["Which of these belongs to the 'work environment' element of total rewards?",["Work-life offerings and flexible arrangements","Stock options","Base pay","Retirement plan"],"Environment covers how and where work happens."],
     ["A designer says, 'I love this job because my work matters and I decide how to do it.' Which rewards is she describing?",["Intrinsic: meaningfulness and choice","Extrinsic: variable pay","Transactional: benefits","Fixed pay"],"Purpose and autonomy are intrinsic."]]},
   {title:"Fixed and Fickle", lore:[
     "<strong>Fixed pay</strong> (base pay) is non-discretionary and does not vary with performance. <strong>Variable pay</strong> (pay at risk) is directly linked to performance or results for a period.",
     "<strong>Short-term incentives (STI)</strong> reward performance over a year or less. <strong>Long-term incentives (LTI)</strong> reward over more than a year: stock options, restricted stock, performance units, cash. LTIs are typically for <strong>senior executives</strong>.",
     "<strong>Benefits</strong> include social insurance, group insurance (medical, life, disability, retirement) and <strong>pay for time not worked</strong> (leaves, holidays, maternity/paternity).",
     "Other incentives: sales commission for retail, wholesale incentives for account executives."],
    qs:[
     ["A sales rep gets 8% of each deal closed this quarter on top of her salary. This is…",["Short-term variable pay","Long-term incentive","Fixed pay","A benefit"],"Linked to current-period results."],
     ["A CEO receives restricted stock that vests over four years if performance goals are met. This is a…",["Long-term incentive","Short-term incentive","Fixed pay","Social insurance"],"The horizon exceeds a year."],
     ["Paid maternity leave is best classified as…",["Benefit: pay for time not worked","Variable pay","LTI","Recognition"],"Income continues while away from work."],
     ["Which statement about fixed pay is correct?",["It does not vary with performance or results","It is paid only on targets","It is for executives","It is at risk"],"Non-discretionary and stable."],
     ["Group medical insurance negotiated for the entire organisation is a…",["Benefit (group insurance)","STI","Fixed pay","Perquisite on performance"],"Benefits cover health and welfare."]]},
   {title:"Strategy and Stage", lore:[
     "<strong>Pay mix changes across an organisation's life stages.</strong> Young, cash-poor ventures tend to lean on equity and the promise of upside; mature firms rely on stable base pay, structured incentives and benefits.",
     "Compensation should <strong>link to competitive strategy</strong>. <strong>Cost leadership</strong>: stable, formal, hierarchical; reward team-based performance, minimise cost per employee, focus on efficiency. <strong>Differentiation (product leadership)</strong>: constantly changing, informal, experimental; reward organisational success and innovation, with higher-than-average rewards and little differentiation. <strong>Focus (customer intimacy)</strong>: service-oriented, bottom-up; few policies, strong fit in recruiting, broad benefits that make employees' lives easier.",
     "Compensation is shaped by <strong>internal job worth, external market, the organisation's philosophy and available budget</strong>."],
    qs:[
     ["A cost-leadership retailer is redesigning pay. The best fit is…",["Team-based rewards tied to efficiency and low cost per employee","Lavish individual stock grants","Unstructured bonuses","Highly differentiated innovation pay"],"Efficiency is the strategic focus."],
     ["A product-innovation firm that depends on creativity and information sharing should most likely…",["Reward organisational success, with generous overall rewards and little differentiation","Pay minimum market rates","Rank staff against each other","Use rigid policy-driven pay"],"Collaboration needs less internal competition."],
     ["A boutique hotel group built on personal service rewards staff with broad benefits, strong 'fit' in recruiting and few rigid policies. Which strategy?",["Focus / customer intimacy","Cost leadership","Differentiation by product","Mass production"],"Autonomy, fit and responsiveness."],
