     ["A cash-strapped start-up with high growth potential will most likely lean its pay mix toward…",["Equity and upside, with modest cash","Rich fixed pay","Generous pensions","Long service awards"],"Upside substitutes for cash early on."],
     ["Which is NOT one of the factors that determine compensation, according to the session?",["The CEO's personal taste","Internal job worth","External market dynamics","Budget available"],"The four are job worth, market, philosophy, budget."]]},
   {title:"Weighing the Post", lore:[
     "<strong>Job evaluation</strong> uses <strong>compensable factors</strong> (impact, knowledge and skills, innovation, etc.) to determine the worth of <strong>jobs, not individuals</strong>, relative to each other. A position belongs to the organisation, not the person: when people are promoted they leave their old position's scope behind.",
     "When all unique jobs are evaluated, the frequency distribution looks like a <strong>'bouncing ball'</strong>, and <strong>grades</strong> (bands) emerge at the inflexion points. <strong>Position grading</strong> assigns a grade to a position, and grades are the foundation of compensation, benefits and talent programmes. Mercer's IPE is one methodology.",
     "Aims: <strong>internal equity</strong> (relative worth inside the firm), <strong>external competitiveness</strong> (market value), and <strong>performance orientation</strong>."],
    qs:[
     ["Job evaluation assesses the worth of…",["The job, relative to other jobs in the organisation","The person's seniority","The person's last salary","The boss's opinion"],"Compensable factors rate jobs, not individuals."],
     ["Two employees do very different work yet earn identical pay, and the lower-impact role has the same grade. Which objective is violated?",["Internal equity","External competitiveness","Performance orientation","Benefits parity"],"Relative worth inside the firm isn't reflected."],
     ["A talented analyst is promoted to manager. Her old position…",["Remains with its scope and responsibilities for the next holder","Moves with her","Is deleted","Is renamed after her"],"The position belongs to the organisation."],
     ["What do grades or bands give an organisation?",["A structure for pay, benefits and talent programmes","A list of employees","A tax benefit","An appraisal rating"],"They are the foundation of reward programmes."],
     ["Which is a compensable factor?",["Impact of the job","The incumbent's age","The incumbent's gender","The boss's preferences"],"Impact, knowledge and innovation are job-based factors."]]},
   {title:"The Range and the Raise", lore:[
     "<strong>Salary range</strong> is typically 80% to 120% of the <strong>midpoint</strong>. Midpoint = fully competent; minimum to midpoint = learning or below-average performance; midpoint to maximum = consistently high performance, long experience. Most firms target <strong>P50 (the market median)</strong> for the midpoint.",
     "<strong>Compa-ratio</strong> = actual pay ÷ midpoint. <strong>Position in range (PIR)</strong> = where pay sits between minimum (0%) and maximum (100%), so the midpoint is 50%. <strong>Range spread</strong> = (maximum − minimum) ÷ minimum.",
     "A <strong>position</strong> is assigned a grade; an <strong>associate</strong> is paid within the grade based on performance, experience and growth. <strong>Merit increases</strong> depend on performance, and lower PIR employees with strong performance get larger percentages. The total must fit the <strong>merit budget (pool)</strong>.",
     "A <strong>promotion</strong> is for a significant increase in scope or consistently high performance, not seniority. It typically gives about <strong>twice the average merit increase</strong> and lands <strong>below 50% PIR</strong>, as the person is not yet fully competent in the new role."],
    qs:[
     ["A grade has a midpoint of ₹10 lakh. Associate Rao is paid ₹9 lakh. His compa-ratio is…",["0.90","1.10","0.50","9.0"],"9 ÷ 10 = 0.90."],
     ["The same grade has range ₹8 lakh to ₹12 lakh. Rao earns ₹9 lakh. His position in range is…",["25%","50%","90%","75%"],"(9 − 8) ÷ (12 − 8) = 25%."],
     ["A merit budget is 5% of a ₹3.86 crore payroll, which is about ₹19.3 lakh. Proposed raises total ₹20.26 lakh. What must the manager do?",["Adjust individual raises so the total fits the pool","Ignore the pool","Give everyone zero","Raise the pool silently"],"Merit pay must stay within the budget."],
     ["Two strong performers get a rating of 'Strong'. One sits at 25% PIR; the other at 80%. The merit guidelines would typically give…",["A larger percentage to the one lower in range","The same to both","More to the higher-paid","Nothing to either"],"Lower PIR gets a bigger catch-up."],
     ["After a promotion, an employee's new pay is usually…",["Below the midpoint (PIR under 50%) as she is still learning the role","At the maximum","Unchanged","At the old midpoint"],"She is not yet fully competent in the new role."],
     ["Which is NOT a valid reason for promotion?",["Long seniority alone","Significantly larger job scope","Consistently above-average performance","Both scope and performance"],"Promotion is not a reward for seniority."]]}
  ]},
{ id:"DI", num:"XV", name:"The Garden of Many Greens", topic:"Diversity & inclusion",
  pal:{top:"#130a14",bot:"#2e1633",far:"#22102a",near:"#371a3f",tile:"#0e060f",edge:"#c46ad8",acc:"#f0b4ff",fog:"240,180,255"},
  card:["#371a3f","#130a14","#f0b4ff"],
  enemies:["Unconscious Bias","Tokenism","Echo Chamber","Checkbox","Silo"],
  intro:[
    "The Garden of Many Greens. Organa's gardeners tended every shade, until they forgot to look. Two hundred and ninety-five shades, and most people see five.",
    "Diversity is a fact. Inclusion is a choice. Equity is a design. This garden grows only when someone tends it.",
    "Read the stones, then walk the beds."],
  outro:"The fifteenth beacon burns. Diversity is what you have; inclusion is what you do; belonging is what people feel.",
  lessons:[
   {title:"Shades of Green", lore:[
     "Seeing 295 shades of green is partly evolutionary and biological, and partly learnt. <strong>Thinking about diversity is a skill that requires practice.</strong> Ask: how many ways can I define myself? How diverse is my network?",
     "<strong>Surface diversity</strong> is visible (age, gender, race, physical ability). <strong>Deep diversity</strong> sits beneath: <strong>cognitive</strong> (thinking, problem solving, information processing, skills), <strong>affective</strong> (affinities, interests, social purpose, empathy) and <strong>experience-based</strong> (life experiences, values, beliefs, morals, ethics)."],
    qs:[
     ["A team is mixed in age and gender but everyone solves problems the same way and was trained at the same institute. It has…",["Surface diversity but little cognitive diversity","Deep diversity","Affective diversity","No diversity of any kind"],"Visible mix, uniform thinking."],
     ["Two colleagues look alike but one grew up in a conflict zone and holds very different values about risk. This is…",["Experience-based deep diversity","Surface diversity","Cognitive only","Affective only"],"Life experience and values."],
     ["Which of these is surface-level diversity?",["Age","Problem-solving style","Beliefs and values","Empathy"],"Visible, demographic attributes."],
     ["A team member who cares passionately about social purpose and connects easily with others adds…",["Affective diversity","Cognitive diversity","Surface diversity only","No diversity"],"Affinities, interests and empathy."],
     ["Why does the session say 'thinking diversity is a skill'?",["Seeing and valuing difference needs practice, not just awareness","It is genetic","It cannot be learnt","Only HR can do it"],"It is trained through repeated practice."]]},
   {title:"Why the Garden Grows", lore:[
     "Views on diversity vary: it <strong>improves financial performance</strong>; it has <strong>no impact</strong>; it is a <strong>fad</strong>; it <strong>destroys meritocracy</strong>; organisations <strong>should not be forced into affirmative action</strong>.",
     "McKinsey's 2020 <em>Diversity Wins</em> found higher diversity <strong>correlated</strong> with financial outperformance (correlation, not proof of cause).",
     "Three paradigms for adopting diversity: <strong>discrimination and fairness</strong> (some groups are systematically marginalised), <strong>access and legitimacy</strong> (a diverse workforce reflects diverse customers and sustains the firm), and <strong>learning and effectiveness</strong> (diversity enhances learning, innovation and resilience)."],
    qs:[
     ["A bank hires staff from the communities it serves so it can win their trust and business. Which paradigm?",["Access and legitimacy","Discrimination and fairness","Learning and effectiveness","Meritocracy"],"The workforce mirrors the customer base."],
     ["A firm adds diverse voices to its product team because varied perspectives improve learning and innovation. Which paradigm?",["Learning and effectiveness","Access and legitimacy","Discrimination and fairness","Tokenism"],"Diversity as a source of capability."],
     ["An organisation hires women into leadership because women had been systematically excluded from its senior ranks. Which paradigm?",["Discrimination and fairness","Access and legitimacy","Learning and effectiveness","Cost leadership"],"Correcting systematic marginalisation."],
     ["A report shows diverse firms outperform financially. A careful manager concludes…",["It is a correlation; diversity may help, but we can't claim it alone causes it","Diversity always causes profit","It proves nothing at all","Profit causes diversity"],"Correlation is not causation."],
     ["Which statement is one of the predominant views on diversity?",["Diversity destroys meritocratic culture","Diversity is a legal fiction","Diversity has always been universally accepted","Diversity is purely biological"],"It is a view some hold; the session lists it."]]},
   {title:"The Business Case and Beyond", lore:[
     "In the <strong>Allegis India</strong> case, the company built disability hiring across the <strong>employee life cycle</strong> with enabling systems.",
     "A possible <strong>business case</strong> for including persons with disabilities: enhancing the corporate brand, an <strong>untapped talent pool</strong>, CSR engagement, stakeholder perspective, and the <strong>purple economy</strong> (the market around disability).",
     "If there is <strong>no business case</strong>, the argument rests on ethical leadership, fairness and human dignity, respect and responsibility, SDG alignment and societal change.",
     "Enabling systems: <strong>change processes that support unconscious bias</strong>, empathise with specific challenges, strengthen the hiring pipeline and community engagement, build a mutually supportive community. Policies alone aren't enough: <strong>leadership beliefs, a supportive ecosystem, DEI champions</strong> and <strong>structural plus behavioural interventions</strong> matter."],
    qs:[
     ["A firm says it will hire persons with disabilities because the talent pool is untapped and its brand improves. This is…",["The business case","The ethical case","A legal penalty","A tax rule"],"Value to the business."],
     ["A leader says, 'Even if it earned us nothing, it is right, because everyone deserves dignity.' This is…",["The ethical case for inclusion","The business case","Access and legitimacy","Cost leadership"],"Fairness and dignity independent of returns."],
     ["A company publishes an inclusion policy but its interview process still screens out candidates with disabilities. What's missing?",["Changes to processes that carry unconscious bias, and leadership commitment","More posters","A new slogan","Fewer applicants"],"Structure must change, not just policy text."],
     ["Which pair of interventions best builds lasting inclusion?",["Structural (systems) and behavioural (mindset and practice)","Only training","Only quotas","Only a policy"],"Both together."],
     ["Why is a DEI champion valuable?",["Keeps leadership commitment visible and models inclusive behaviour","Replaces HR","Reduces headcount","Approves salaries"],"Champions sustain momentum."]]},
   {title:"Wipro's Long Road", lore:[
     "<strong>Wipro</strong> began its diversity journey with the <strong>'Women of Wipro' (WoW)</strong> framework in 2008, a <strong>life-stage-based</strong> approach. Programmes included WoW Mom (supporting maternity), a relaunch programme for women returning after a break, and <strong>Enrich</strong>, a 12-month sponsorship pairing high-potential senior women with sponsors above vice-president.",
     "A senior woman challenged whether this diluted <strong>merit</strong>. The CHRO replied that Wipro would seek qualified women and create a <strong>level playing field</strong>, bringing people along.",
     "Wipro added <strong>disability inclusion</strong> (frameworks, governance, audits that found 100+ accessible roles), <strong>LGBTQIA+ inclusion</strong> from 2018 (PRIDE framework, an ERG called Wipro Pride, allyship), and the <strong>Multigen</strong> pillar in 2024 (four generations, reverse mentoring).",
     "The CEO then asked to move from <strong>DEI to 'Inclusion and Belonging'</strong>: measure not just representation numbers but whether employees <strong>feel valued, respected and integral</strong>, and anticipate unintended consequences."],
    qs:[
     ["A woman leader argues that targeted programmes for women dilute merit. The best-supported reply from the case is…",["Seek qualified women and create a level playing field, while holding the merit standard","Remove all programmes","Lower the standard","Ignore concerns"],"Equity of access without discrimination."],
     ["Wipro's WoW framework addressing early, mid and senior stages is a…",["Life-stage-based inclusion approach","One-time quota","Compensation policy","Performance rating"],"Different needs at different career stages."],
     ["A reverse mentoring circle, where younger colleagues coach senior leaders on technology, belongs to Wipro's…",["Multigen pillar","WoW framework","PRIDE framework","Disability audit"],"Generational diversity."],
     ["Why did Wipro's CEO want to move from DEI to 'Inclusion and Belonging'?",["To measure how valued and respected people feel, not just representation numbers","To drop diversity targets","To save money","To reduce HR staff"],"Success defined by experience, not only counts."],
     ["Wipro's Enrich programme differs from ordinary mentoring because it is…",["A flexible sponsorship pairing senior women with sponsors above VP","A fixed curriculum","A recruitment drive","A pay scheme"],"Sponsors open doors and advocate."]]},
   {title:"The Seed of Culture", lore:[
     "<strong>Building and sustaining an inclusive culture</strong>: <strong>influencers and change agents</strong> drive it from below; <strong>diversity training, affirmative action in recruitment, equitable budgeting and codes of conduct</strong> embed it; <strong>leaders' demonstrated commitment</strong> signals it; and <strong>restructuring teams or punitive action</strong> is a last resort for resisters. (Adapted from Doherty et al.)",
     "<strong>Key takeaways:</strong> <strong>diversity is a fact; inclusion is a choice; equity is a design.</strong> Inclusion is created in everyday interactions. Biases are predictable and manageable. DEI should be strategic, not symbolic."],
    qs:[
     ["A firm hires a diverse intake but meetings still reward only the loudest voices. Which takeaway applies?",["Diversity is a fact; inclusion is a choice made in everyday interactions","Diversity alone guarantees inclusion","Equity is optional","Biases cannot be managed"],"Representation doesn't equal participation."],
     ["Hiring panels get a standard scoring rubric and structured questions to reduce bias. This is…",["Designing for equity","Symbolism","Affirmative quotas","A tax benefit"],"Equity is a design."],
     ["A company's diversity effort is a Pride-month logo and nothing else. Critics would call it…",["Symbolic, not strategic","Strategic","Structural","Transformational"],"DEI should be strategic."],
     ["Which action best signals leadership commitment to inclusion?",["Leaders visibly model inclusive behaviour and hold managers accountable","A one-off speech","Delegating it all to HR","A press release"],"Demonstrated commitment shapes culture."],
     ["The statement 'biases are predictable and manageable' implies we should…",["Design processes that anticipate and counter them","Accept them","Deny them","Ignore them"],"Predictable biases can be designed around."]]}
  ]},
{ id:"AI", num:"XVI", name:"The Foundry of Change", topic:"Technology & change (guest lecture)",
  pal:{top:"#0a0e14",bot:"#14242c",far:"#0e1a22",near:"#1a303a",tile:"#070a0e",edge:"#ff8a4a",acc:"#ffd0a8",fog:"255,208,168"},
  card:["#1a303a","#0a0e14","#ffd0a8"],
  enemies:["Black Box","Obsolete Skill","Dashboard Gamer","Abdication","Fear"],
  intro:[
    "The Foundry of Change. Organa's forges once shaped tools for hands. Now machines hum here, and the people beside them wonder what is left for them to do.",
    "Three leaders from MakeMyTrip, Persistent and ISB came to speak of it. This forge teaches what they said.",
    "Technology is not the hard part. People are."],
  outro:"The sixteenth beacon burns. AI is a workforce transformation, not a tool rollout. Redesign the work, protect the judgement, reskill the people. The Mentor lays the lantern in your hands: 'Now you are the one who asks.'",
  lessons:[
   {title:"Tool or Transformation", lore:[
     "The panel's headline: <strong>AI is not ultimately a technology rollout. It is a workforce transformation.</strong> Organisations are moving from <strong>automating tasks to redesigning workflows</strong>.",
     "The old question, 'can AI do the task?', becomes <strong>'what should AI do, what should people do, and what should I do as an associate or manager?'</strong>",
     "AI is changing the relationship between people, skills and technology, and the time between learning something and applying it is nearly real-time."],
    qs:[
     ["A company buys an AI tool, trains no one and leaves workflows unchanged. Why is the result likely to disappoint?",["It treated AI as a tool rollout instead of redesigning work and people","The tool was too cheap","AI never works","Employees dislike technology"],"The lecture stressed workflow redesign and workforce transformation."],
     ["Which shift best describes the panel's view?",["From automating tasks to redesigning workflows","From workflows to tasks","From people to machines","From skills to tools"],"Task automation alone isn't enough."],
     ["A manager now asks, 'What should AI do for me, what should my people do, and what should I do?' This reflects…",["Allocating work between AI and humans at sub-process level","Cost cutting","Ignoring technology","Job rotation"],"Roles are reallocated task by task."],
     ["Why do the speakers say the gap between learning and applying is now 'almost real time'?",["AI tools let people apply new knowledge immediately","Training became free","Managers stopped teaching","Jobs no longer change"],"Rapid learn-and-apply cycles."]]},
   {title:"The Line in the Sand", lore:[
     "Both firms drew <strong>a firm boundary</strong>: some HR processes could be done by AI but would <strong>not be abdicated to it</strong>. Efficiency gains in sourcing, screening, tracking and onboarding sit beside <strong>human-in-the-loop</strong> control and decision-making.",
     "HR is the <strong>custodian of employee values and concerns</strong>, not only of efficiency. Governance, fairness and empathy are why humans stay in the loop.",
     "At the sub-process level: the recruitment pipeline can be heavily automated, but offers, sensitive conversations and final judgement stay with people. Interview tools can suggest questions in real time while a human decides."],
    qs:[
     ["An AI tool ranks candidates and recommends rejections. The company lets recruiters review and override. This is…",["Human-in-the-loop decision control","Abdication to AI","Full automation","Outsourcing"],"Humans keep final say."],
     ["Why is HR described as the custodian of employee values even as it automates?",["Efficiency can conflict with fairness, governance and empathy","Automation is illegal","HR dislikes speed","AI cannot be trusted at all"],"Someone must protect the human side."],
     ["Which decision is most appropriate to keep with a human, according to the logic of the panel?",["A sensitive final hiring or exit decision","Scheduling interviews","Parsing resumes","Sending reminders"],"High-stakes, values-laden judgement."],
     ["A live interview tool suggests the next question to the interviewer, who decides whether to ask it. This is…",["AI assisting, human deciding","AI replacing the interviewer","AI choosing the hire","AI scoring only"],"Support, not substitution."],
     ["What is the risk of 'abdicating' a process to AI?",["Fairness and governance problems with no human accountability","Higher cost","Less data","Slower hiring"],"No one is answerable for the outcome."]]},
   {title:"The Vanished Roles", lore:[
     "At <strong>Persistent</strong>, some role clusters on the skills chart simply <strong>vanished</strong>, not moved. New roles rose: the <strong>forward-deployed engineer (FDE)</strong> who sits in the customer environment, and the <strong>AI-native engineer</strong> who sits in the product or project team.",
     "Many engineers wanted to move into those roles, creating a huge <strong>reskilling</strong> challenge: tech moved so fast that skills went obsolete, and the work is to <strong>scale reskilling, redeploy people, keep them engaged and keep performance</strong>.",
     "<strong>MakeMyTrip / Redbus</strong> tackled 'unclear skill readiness' by building an <strong>internal talent pool</strong> and career tools so people would not need to leave to switch."],
    qs:[
     ["Which role sits inside the customer's environment, solving problems on site?",["Forward-deployed engineer","AI-native engineer","Product owner","Data steward"],"FDEs work in customer environments."],
     ["A firm sees whole job clusters vanish after AI adoption. The most constructive response is…",["Scale reskilling and redeploy people into new roles","Wait and see","Hire only externally","Freeze all hiring"],"Reskill and redeploy at scale."],
     ["Engineers keep leaving to switch skill tracks. MakeMyTrip's response was an internal talent pool and career tools. Which problem did it address?",["Unclear skill readiness and external attrition","Payroll errors","Too many managers","Poor office layout"],"Let people grow without leaving."],
     ["Which statement about the new roles is correct?",["The AI-native engineer sits in the product or project team","The FDE works only in R&D","Both sit in HR","Neither needs new skills"],"The two roles sit in different places."]]},
   {title:"The Watching Eye", lore:[
     "At MakeMyTrip, the tech-product team built <strong>10 to 12 in-house HR tools</strong> to solve <strong>fragmented signals</strong> (learning, performance, delivery and people data in sheets), <strong>high-touch processes</strong>, <strong>unclear skill readiness</strong> and <strong>limited productivity visibility</strong> (what did AI cost versus what did it save?).",
     "A dashboard can show attrition, reward spend, learning hours and more from API feeds. A student asked: <strong>how do you know people aren't gaming the metrics?</strong> The answer: people stay in the loop. The conversation behind the number still matters.",
     "This echoes Rainbarrel: <strong>a metric on its own invites gaming</strong>. Data plus judgement plus empathy is the combination."],
    qs:[
     ["Engineers learn their Jira ticket count feeds a productivity dashboard and start splitting tasks into tiny tickets. The best response is…",["Keep managers in the loop to discuss context behind the numbers, not just read the dashboard","Add more dashboards","Ban Jira","Ignore it"],"Human judgement guards against gaming."],
     ["Why does the Rainbarrel lesson connect to AI dashboards?",["Any metric can be gamed when it becomes the target","Dashboards are always accurate","Rainbarrel used AI","Both involve shipping"],"Goodhart-style behaviour."],
     ["MakeMyTrip's HR tools aimed first to fix 'fragmented signals'. What does this mean?",["Learning, performance and people data were scattered across sheets and entities","Radio interference","Too many leaders","Slow emails"],"Data was disconnected."],
     ["Leaders wanted to know how much of productivity gains came from AI versus cost. This is a question of…",["Return on investment and productivity visibility","Compensation","Recruitment","Onboarding"],"ROI of AI spend."],
     ["A manager sees an unusually good number on a dashboard. A sound response is to…",["Look at how it was achieved and talk to the person","Reward it immediately","Hide it","Replace the dashboard"],"Understand before rewarding."]]},
   {title:"The Manager's Compass", lore:[
     "Takeaways for a future manager: <strong>redesign work</strong> rather than bolt on tools; decide <strong>what AI does and what people do</strong>, process by process; keep <strong>human judgement and empathy</strong> in sensitive decisions; invest in <strong>continuous reskilling</strong>; and be transparent about <strong>how AI is used</strong>.",
     "Link to the course: change creates <strong>uncertainty</strong>, so communicate early; use <strong>psychological safety</strong> so people can raise fears; align <strong>goals and rewards</strong> with the new way of working (no metric that punishes learning); involve employees and <strong>seek their input</strong>; and watch <strong>inclusion</strong>, since not everyone adapts equally fast."],
    qs:[

function leaveGame(){ if(!G) return home(); if(G.menu) return closeExitMenu(); if(G.cur||G.done) return; G.menu=true; clearKeys();
  const canSave=!G.final;
  modalRoot.innerHTML=`<div class="modal modal-dark" role="dialog" aria-modal="true" aria-labelledby="xt"><div class="qbox" id="xbox"><div class="q-text" id="xt" tabindex="-1">Leave this level?</div>

      <button class="btn go" id="xk">Keep playing (Esc)</button>
      ${canSave?`<button class="btn" id="xs">Save progress and exit</button>`:""}
      <button class="btn" id="xr">Restart this level</button>
      <button class="btn" id="xd">Exit without saving</button></div></div></div>`;
  const a=document.getElementById("app"); if(a) a.inert=true; $("#xt").focus();
  $("#xk").onclick=closeExitMenu;
  if(canSave) $("#xs").onclick=()=>{ saveResume(); closeExitMenu(true); home(); };
  $("#xr").onclick=()=>{ const id=G.final?G.world.key||G.setKey:G.world.id, st=G.story; if(G.final){ const w=G.world; closeExitMenu(true); startGame(w.id,false); } else { if(S.resume&&S.resume.id===id){ S.resume=null; save(); } closeExitMenu(true); startGame(id,st); } };

function pickChunk(t,avoid){
  const pool=CHALL.filter(c=>c.t===t && c!==avoid);
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildLevel(wi,story,final){
  const parts=[CH.start(story)];
  const nG=final?10:5; let last=null;
  for(let k=0;k<nG;k++){
    if(story) parts.push(CH.lore(k));
    const tier=final?(k<3?2:3):Math.min(3,1+Math.floor((k+wi+(story?0:1))/2));
    const n=final?1:2;
    for(let j=0;j<n;j++){ const t=j===0?tier:Math.max(1,tier-1); const c=pickChunk(t,last); last=c; parts.push(c.f()); }
    parts.push(CH.gate(k));
    if(!final&&k<4) parts.push(CH.cache(k));
  }
  const fin=pickChunk(3,last); parts.push(fin.f()); parts.push(CH.end());
  const cols=parts.reduce((a,c)=>a+c.w,0);
  const grid=Array.from({length:ROWS},()=>[]);
  const L={cols,grid,spawn:{x:60,y:450},caches:[],benches:[],stones:[],gates:[],enemies:[],mplats:[],shards:[],npc:null,flag:null};
  let off=0;
  for(const c of parts){
    for(let y=0;y<ROWS;y++) grid[y].push(...c.g[y]);
    for(const e of c.ents){
      const X=(off+e.x)*TS, Y=e.y*TS;
      switch(e.type){
        case "spawn": L.spawn={x:X,y:Y+TS}; break;
        case "bench": L.benches.push({x:X,y:Y+10,w:60,h:20,used:false}); break;
        case "npc": L.npc={x:X,y:Y+TS}; break;
        case "stone": L.stones.push({x:X,y:Y+TS,k:e.k,read:false}); break;
        case "gate": L.gates.push({x:X,y:0,w:TS,h:Y+TS,k:e.k,open:false,openT:0}); break;
        case "flag": L.flag={x:X,y:Y+TS}; break;
        case "spike1": grid[e.y][off+e.x]="^"; break;
        case "enemy": { const ex=X+4; L.enemies.push({x:ex,y:Y+TS-22,w:22,h:22,vx:1,minX:ex-e.range*TS,maxX:ex+e.range*TS,alive:true,dieT:0}); break; }
        case "mplat": { const bx=X+15-45; L.mplats.push({bx,by:Y,x:bx,y:Y,w:90,h:14,axis:e.axis,range:e.range*TS,spd:e.spd,ph:e.ph||0,dx:0,dy:0}); break; }
        case "cache": L.caches.push({x:X,y:Y+TS,k:e.k,open:false,told:false}); break;
        case "shard": L.shards.push({x:X+15,y:Y+15,got:false}); break;
      }
    }
    off+=c.w;
  }
  return L;
}

function stopGame(){ if(raf) cancelAnimationFrame(raf); raf=null; if(timerId) clearInterval(timerId); timerId=null; G=null; document.onkeydown=null; document.onkeyup=null; for(const k in keys) keys[k]=false; }

     shake:0,freeHint:!final,coach:null,start:performance.now(),end:final&&!S.practice?Date.now()+15*60*1000:null,banner:null,jp:false,jr:false,dp:false,ap:false,prompt:null};
  app.innerHTML=`<section class="game" style="--wacc:${pal.acc}">

function bindControls(){
  const map={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"jump",KeyW:"jump",Space:"jump",KeyZ:"jump",ShiftLeft:"dash",ShiftRight:"dash",KeyX:"dash",KeyK:"dash",KeyE:"act",ArrowDown:"act",KeyS:"act"};
  document.onkeydown=e=>{
    if(!G) return;
    if(G.menu){ if(e.code==="Escape"){ e.preventDefault(); closeExitMenu(); } return; }
    if(G.cur){ modalKey(e); return; }
    if(G.dlg){ if(["Enter","Space","KeyE","ArrowDown","KeyS"].includes(e.code)){ e.preventDefault(); if(!e.repeat) advanceDlg(); } else if(e.code==="Escape"){ closeDlg(); } return; }
    if(e.code==="Escape"){ e.preventDefault(); leaveGame(); return; }
    const k=map[e.code]; if(!k) return; e.preventDefault(); if(e.repeat){ keys[k]=true; return; }
    if(k==="jump"&&!keys.jump) G.jp=true;
    if(k==="dash") G.dp=true;
    if(k==="act") G.ap=true;
    keys[k]=true;
  };
  document.onkeyup=e=>{ const k=map[e.code]; if(!k||!G) return; keys[k]=false; if(k==="jump") G.jr=true; };
  const hold=(id,k)=>{ const b=$(id); if(!b) return;
    b.onpointerdown=e=>{ e.preventDefault(); if(!G) return; if(G.dlg){ advanceDlg(); return; } if(k==="jump") G.jp=true; if(k==="dash") G.dp=true; if(k==="act") G.ap=true; keys[k]=true; };
    b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{ if(keys[k]&&k==="jump"&&G) G.jr=true; keys[k]=false; }; };
  hold("#bl","left"); hold("#br","right"); hold("#bj","jump"); hold("#bd","dash"); hold("#ba","act");
}

function tile(cx,cy){ if(cy<0||cy>=ROWS) return "."; if(cx<0||cx>=G.L.cols) return "#"; return G.L.grid[cy][cx]; }
const ov=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

function loop(now){
  if(!G) return;
  const dt=Math.min(1/30,(now-G.last)/1000); G.last=now; G.t+=dt;
  const paused=!!(G.dlg||G.cur||G.done||G.menu);
  if(!paused) step(dt);
  if(!G) return;
  for(const g of G.L.gates){ if(g.open&&g.openT<1) g.openT=Math.min(1,g.openT+dt*1.4); }
  G.parts=G.parts.filter(q=>(q.life-=dt)>0); G.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;});
  G.trail=G.trail.filter(q=>(q.life-=dt)>0);
  G.motes.forEach(m=>{ m.y-=m.s*dt; m.x+=Math.sin(G.t*.6+m.r*7)*6*dt; if(m.y<-4){m.y=VH+4;m.x=Math.random()*VW;} });
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  draw();
  raf=requestAnimationFrame(loop);
}

function step(dt){
  const p=G.p, L=G.L;
  // moving platforms
  for(const m of L.mplats){ const ox=m.x,oy=m.y, s=Math.sin(G.t*m.spd+m.ph)*m.range; if(m.axis==="x") m.x=m.bx+s; else m.y=m.by+s; m.dx=m.x-ox; m.dy=m.y-oy; }
  if(p.plat){ p.x+=p.plat.dx; p.y=p.plat.y-p.h; }
  // input
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir&&p.dashT<=0&&p.kbT<=0) p.face=dir;
  const spd=has("speed")?325:240;
  if(G.dp){ G.dp=false; if(has("dash")&&!p.dashUsed&&p.dashT<=0){ p.dashT=.17; p.dashUsed=true; p.plat=null; G.shake=3; } }
  if(p.dashT>0){ p.dashT-=dt; p.vx=p.face*650; p.vy=0; G.trail.push({x:p.x,y:p.y,face:p.face,life:.25}); }
  else if(p.kbT>0){ p.kbT-=dt; p.vx=p.kbVx; }
  else { const target=dir*spd; p.vx+=(target-p.vx)*Math.min(1,dt*(p.on?22:12)); if(!dir&&Math.abs(p.vx)<8) p.vx=0; }
  if(G.jp){ p.buf=.12; G.jp=false; }
  if(p.buf>0){ p.buf-=dt;
    if(p.on||p.coyote>0){ p.vy=-760; p.on=false; p.coyote=0; p.buf=0; p.jumps=1; p.plat=null; p.cut=false; }
    else if(has("double")&&p.jumps<2&&p.dashT<=0){ p.vy=-690; p.jumps=2; p.buf=0; p.cut=false; puff(p.x+p.w/2,p.y+p.h,G.pal.acc,10); }
  }
  if(G.jr){ G.jr=false; if(p.vy<0&&!p.cut){ p.vy*=.45; p.cut=true; } }
  p.gliding=false;
  if(p.dashT<=0){ p.vy+=2100*dt; if(has("glide")&&keys.jump&&p.vy>95&&!p.on){ p.vy=95; p.gliding=true; } if(p.vy>1000) p.vy=1000; }
  const prevBottom=p.y+p.h;
  // X
  p.x+=p.vx*dt; if(p.x<0) p.x=0;
  { const y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h-.01)/TS);
    if(p.vx>0){ const cx=Math.floor((p.x+p.w-.01)/TS); for(let y=y0;y<=y1;y++) if(tile(cx,y)==="#"){ p.x=cx*TS-p.w; p.vx=0; break; } }
    else if(p.vx<0){ const cx=Math.floor(p.x/TS); for(let y=y0;y<=y1;y++) if(tile(cx,y)==="#"){ p.x=(cx+1)*TS; p.vx=0; break; } } }
  for(const g of L.gates){ if(!g.open&&ov(p,g)&&!(G.gateCool>performance.now())){ p.x=g.x-p.w; p.vx=0; p.dashT=0; askGate(g); return; } }
  // Y
  p.y+=p.vy*dt; p.on=false; p.plat=null;
  { const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-.01)/TS);
    if(p.vy>=0){ const cy=Math.floor((p.y+p.h-.01)/TS); for(let x=x0;x<=x1;x++){ const c=tile(x,cy); if(c==="#"||(c==="="&&prevBottom<=cy*TS+1)){ p.y=cy*TS-p.h; p.vy=0; p.on=true; break; } } }
    else { const cy=Math.floor(p.y/TS); for(let x=x0;x<=x1;x++) if(tile(x,cy)==="#"){ p.y=(cy+1)*TS; p.vy=0; break; } } }
  for(const m of L.mplats){ if(p.vy>=0&&prevBottom<=m.y+3&&p.y+p.h>=m.y&&p.x+p.w>m.x+2&&p.x<m.x+m.w-2){ p.y=m.y-p.h; p.vy=0; p.on=true; p.plat=m; } }
  if(p.on){ p.coyote=.1; p.jumps=0; p.dashUsed=false; } else p.coyote-=dt;
  if(p.inv>0) p.inv-=dt;
  // hazards
  { const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w-.01)/TS), y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h-.01)/TS);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const c=tile(x,y);
      if(c==="^"&&ov(p,{x:x*TS+5,y:y*TS+13,w:20,h:17})) return hurt(true);
      if(c==="v"&&ov(p,{x:x*TS+5,y:y*TS,w:20,h:17})) return hurt(true); } }
  if(p.y>VH+40) return hurt(true);
  // enemies
  const espd=final_or_world_speed();
  for(const e of L.enemies){ if(!e.alive){ e.dieT+=dt; continue; }
    e.x+=e.vx*espd*dt; if(e.x<e.minX){e.x=e.minX;e.vx=1;} if(e.x>e.maxX){e.x=e.maxX;e.vx=-1;}
    if(ov(p,e)){
      if(p.dashT>0||(p.vy>0&&prevBottom<=e.y+10)){ e.alive=false; burst(e.x+11,e.y+11,G.pal.acc,14); G.shards+=2; if(p.dashT<=0){ p.vy=-560; p.jumps=1; p.cut=true; } updateHud(); }
      else if(p.inv<=0){ hurt(false,e); if(!G||G.done) return; }
    } }
  // shards
  for(const s of L.shards){ if(!s.got&&Math.abs(p.x+p.w/2-s.x)<16&&Math.abs(p.y+p.h/2-s.y)<22){ s.got=true; G.shards++; puff(s.x,s.y,G.pal.acc,6); updateHud(); } }
  for(const c of L.caches){ if(c.open||Math.abs(p.x+p.w/2-(c.x+15))>26||Math.abs(p.y+p.h-c.y)>40) continue; const pw=POWERS[c.k%5];
    if(has(pw.id)){ c.open=true; G.shards+=8; burst(c.x+15,c.y-20,G.pal.acc,18); updateHud(); banner("Cache opened · "+pw.name,"+8 shards. Understanding pays."); }
    else if(!c.told){ c.told=true; banner("A sealed cache","It answers only to "+pw.name+", earned by answering gate "+(c.k+1)+" on the first try."); } }
  if(G.coach&&p.x>G.coach.x+90){ G.coach=null; hideCoach(); }
  if(S.cos&&S.cos.trail!=="mist"&&!RM&&p.on&&Math.abs(p.vx)>120&&Math.random()<.35){ const t=cosItem("trail",S.cos.trail); if(t) puff(p.x+p.w/2,p.y+p.h-2,t.c,1); }
  // benches

function final_or_world_speed(){ return G.final?95:58+G.d*9+(G.story?0:8); }

/* ---------- gates & questions ---------- */
function askGate(g){ G.activeGate=g; G.firstAttempt=!g.tried; clearKeys(); ask(); }
function nextQ(){

function dismissGate(){ if(!G||!G.cur||G.cur.locked) return; const q=G.cur.q; if(q.isEcho) G.echo.unshift({q,after:0}); modalRoot.innerHTML=""; G.cur=null; const a=document.getElementById("app"); if(a) a.inert=false; G.gateCool=performance.now()+1500; const g=G.activeGate; G.p.x=g.x-G.p.w-30; G.p.vx=0; clearKeys(); }

function openGate(first){

function finish(won,reason){

      <div class="actions" style="justify-content:flex-start"><button class="btn ${(g.story&&won&&WORLDS[WORLDS.findIndex(w=>w.id===g.world.id)+1])?"":"go"}" id="again">Play again</button>${(g.story&&won&&WORLDS[WORLDS.findIndex(w=>w.id===g.world.id)+1])?`<button class="btn go" id="nextch">Next chapter</button>`:""}${Object.keys(S.miss).length?`<button class="btn" id="rv">Review saved misses (${Object.keys(S.miss).length})</button>`:""}<button class="btn" id="qk">Quick Study</button><button class="btn" id="back">Back to map</button></div></div>
    ${review?`<div class="section-head"><h2>What to fix</h2><span class="label">${g.missed.length} missed</span></div><div class="review">${review}</div>`:`<p class="kbd">No misses on this run.${Object.keys(S.miss).length?" You still have "+Object.keys(S.miss).length+" saved from earlier runs.":""}</p>`}

/* ---------- particles ---------- */
function burst(x,y,col,n){ if(RM) n=Math.min(n,4); for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,g:600,life:.5+Math.random()*.5,col,r:2+Math.random()*2}); }

/* ============================ DRAW ============================ */
function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function draw(){

  const cam=Math.round(G.cam);

      ctx.beginPath(); ctx.arc(x+170,top+14,116,Math.PI,0); ctx.stroke();
      if(h>.5){ ctx.beginPath(); ctx.moveTo(x+170,top-102); ctx.lineTo(x+164,top-150); ctx.lineTo(x+176,top-150); ctx.fill(); } } }

  { const par=cam*.42, off=-(par%180), i0=Math.floor(par/180);
    for(let i=-1;i<7;i++){ const x=off+i*180, h=hash((i0+i)*3.7); const len=50+h*120;

  const c0=Math.max(0,Math.floor(cam/TS)-1), c1=Math.min(L.cols-1,Math.floor((cam+VW)/TS)+1);
  for(let y=0;y<ROWS;y++) for(let x=c0;x<=c1;x++){ const c=L.grid[y][x]; if(c===".") continue; const X=x*TS,Y=y*TS;
    if(c==="#"){ ctx.fillStyle=pal.tile; ctx.fillRect(X,Y,TS+.5,TS+.5);
      if(tile(x,y-1)!=="#"){ ctx.fillStyle=pal.edge; ctx.fillRect(X,Y,TS+.5,3); ctx.fillStyle=`rgba(${pal.fog},.10)`; ctx.fillRect(X,Y+3,TS+.5,5); }
      if(tile(x-1,y)!=="#"){ ctx.fillStyle=`rgba(${pal.fog},.18)`; ctx.fillRect(X,Y,2,TS); }
      if(tile(x+1,y)!=="#"){ ctx.fillStyle=`rgba(${pal.fog},.18)`; ctx.fillRect(X+TS-2,Y,2,TS); } }
    else if(c==="="){ ctx.fillStyle=pal.tile; ctx.fillRect(X,Y,TS+.5,9); ctx.fillStyle=pal.edge; ctx.fillRect(X,Y,TS+.5,2); }
    else if(c==="^"){ ctx.fillStyle="#d9dce4"; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(X+i*10,Y+TS); ctx.lineTo(X+i*10+5,Y+12); ctx.lineTo(X+i*10+10,Y+TS); ctx.fill(); } }
    else if(c==="v"){ ctx.fillStyle="#d9dce4"; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(X+i*10,Y); ctx.lineTo(X+i*10+5,Y+18); ctx.lineTo(X+i*10+10,Y); ctx.fill(); } }
  }
  // moving platforms
  for(const m of L.mplats){ ctx.fillStyle=pal.tile; rr(ctx,m.x,m.y,m.w,m.h,4); ctx.fill(); ctx.fillStyle=pal.edge; ctx.fillRect(m.x+3,m.y,m.w-6,2); ctx.fillStyle=`rgba(${pal.fog},.35)`; ctx.fillRect(m.x+m.w/2-8,m.y+m.h,16,3); }
  // benches
  for(const b of L.benches){ if(b.x+60<cam||b.x>cam+VW) continue; const Y=b.y+20;
    if(b.used){ const gl=ctx.createRadialGradient(b.x+30,Y-10,2,b.x+30,Y-10,60); gl.addColorStop(0,`rgba(${pal.fog},.22)`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(b.x-30,Y-70,120,80); }
    ctx.fillStyle=pal.edge; ctx.fillRect(b.x+6,Y-14,48,4); ctx.fillRect(b.x+6,Y-26,48,3); ctx.fillRect(b.x+8,Y-26,3,26); ctx.fillRect(b.x+49,Y-26,3,26); ctx.fillRect(b.x+20,Y-10,3,10); ctx.fillRect(b.x+37,Y-10,3,10); }

  if(G.story) for(const s of L.stones){ if(s.x+40<cam||s.x-20>cam+VW) continue; const Y=s.y, pulse=s.read?.25:.55+.35*Math.sin(G.t*3);
    const gl=ctx.createRadialGradient(s.x+15,Y-26,2,s.x+15,Y-26,56); gl.addColorStop(0,`rgba(${pal.fog},${.3*pulse})`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(s.x-45,Y-90,120,100);

    ctx.strokeStyle=pal.acc; ctx.globalAlpha=.4+pulse*.6; ctx.lineWidth=1.5; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(s.x+8,Y-34+i*7); ctx.lineTo(s.x+22-(i%2)*5,Y-34+i*7); ctx.stroke(); } ctx.globalAlpha=1; }
  // npc (the Mentor)

    ctx.fillStyle="#d9d6cf"; ctx.beginPath(); ctx.ellipse(X+17,Y-58,6,7,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#0c0e13"; ctx.fillRect(X+14,Y-60,2,4); ctx.fillRect(X+18,Y-60,2,4);
    ctx.strokeStyle="#3b3a36"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X+36,Y); ctx.lineTo(X+36,Y-78); ctx.stroke();
    const gl=ctx.createRadialGradient(X+36,Y-80,1,X+36,Y-80,40); gl.addColorStop(0,`rgba(${pal.fog},.55)`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(X-4,Y-120,80,80); ctx.fillStyle=pal.acc; ctx.beginPath(); ctx.arc(X+36,Y-80,3.5,0,Math.PI*2); ctx.fill(); }
  // shards
  for(const s of L.shards){ if(s.got||s.x<cam-20||s.x>cam+VW+20) continue; const b=Math.sin(G.t*3+s.x)*3; ctx.fillStyle=pal.acc; ctx.shadowColor=pal.acc; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(s.x,s.y-7+b); ctx.lineTo(s.x+5,s.y+b); ctx.lineTo(s.x,s.y+7+b); ctx.lineTo(s.x-5,s.y+b); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; }
  // gates
  for(const g of L.gates){ if(g.x+40<cam||g.x-40>cam+VW) continue; if(g.openT>=1) continue;
    const lift=g.openT*g.h, a=1-g.openT;
    ctx.globalAlpha=a; ctx.fillStyle=pal.tile; ctx.fillRect(g.x,g.y-lift,g.w,g.h);
    const glow=.5+.5*Math.sin(G.t*3);
    ctx.fillStyle=`rgba(${pal.fog},${.08+.08*glow})`; ctx.fillRect(g.x-10,g.y-lift,g.w+20,g.h);
    ctx.strokeStyle=pal.edge; ctx.lineWidth=2; ctx.strokeRect(g.x+1,g.y-lift+1,g.w-2,g.h-2);
    ctx.strokeStyle=pal.acc; ctx.lineWidth=1.5; for(let yy=g.h-40;yy>20;yy-=46){ ctx.beginPath(); ctx.moveTo(g.x+8,yy-lift); ctx.lineTo(g.x+15,yy-12-lift); ctx.lineTo(g.x+22,yy-lift); ctx.stroke(); }
    ctx.fillStyle=pal.acc; ctx.shadowColor=pal.acc; ctx.shadowBlur=14; ctx.font="700 20px Cinzel, Georgia, serif"; ctx.textAlign="center"; ctx.fillText("?",g.x+15,g.h-60-lift); ctx.shadowBlur=0;
    ctx.font="700 10px 'JetBrains Mono', monospace"; ctx.fillText("GATE "+(g.k+1),g.x+15,g.h-86-lift); ctx.globalAlpha=1; }
  // enemies
  ctx.textAlign="center";
  for(const e of L.enemies){ if(e.x+30<cam||e.x-30>cam+VW) continue;
    if(!e.alive){ if(e.dieT<.4){ ctx.globalAlpha=1-e.dieT/.4; ctx.fillStyle="#050608"; ctx.beginPath(); ctx.ellipse(e.x+11,e.y+16,12+e.dieT*20,6,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } continue; }
    const bob=Math.sin(G.t*9+e.x)*1.5;
    ctx.fillStyle="#040507"; ctx.beginPath(); ctx.ellipse(e.x+11,e.y+13+bob*.3,12,10,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=pal.edge; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle="#040507"; ctx.lineWidth=2; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(e.x+4+i*7,e.y+20); ctx.lineTo(e.x+2+i*7+Math.sin(G.t*14+i)*3,e.y+23); ctx.stroke(); }
    ctx.fillStyle=pal.acc; ctx.shadowColor=pal.acc; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(e.x+11+e.vx*4,e.y+11+bob*.3,2.6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    if(!e.name) e.name=G.world.enemies[Math.floor(hash(e.x)*G.world.enemies.length)];
    ctx.fillStyle=`rgba(${pal.fog},.7)`; ctx.font="600 10px 'JetBrains Mono', monospace"; ctx.fillText(e.name.toUpperCase(),e.x+11,e.y-6); }
  // flag / beacon
  if(L.flag){ const f=L.flag, X=f.x, Y=f.y; ctx.fillStyle=pal.tile; ctx.fillRect(X,Y-90,24,90); ctx.fillStyle=pal.edge; ctx.fillRect(X-6,Y-96,36,8);
    const lit=f.lit||G.done; const fl=lit?1:.35+.2*Math.sin(G.t*4);
    const gl=ctx.createRadialGradient(X+12,Y-110,2,X+12,Y-110,lit?140:60); gl.addColorStop(0,`rgba(${pal.fog},${.6*fl})`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(X-140,Y-260,300,280);
    ctx.fillStyle=pal.acc; ctx.beginPath(); ctx.moveTo(X+2,Y-96); ctx.quadraticCurveTo(X+12,Y-(lit?150:118),X+22,Y-96); ctx.fill();
    ctx.fillStyle=`rgba(${pal.fog},.8)`; ctx.font="700 10px 'JetBrains Mono', monospace"; ctx.fillText(G.final?G.world.quiz.toUpperCase():"BEACON",X+12,Y+14); }
  // sealed caches
  for(const c of L.caches){ if(c.x<cam-40||c.x>cam+VW+40) continue; const X=c.x, Y=c.y, pw=POWERS[c.k%5], can=has(pw.id);
    ctx.fillStyle=pal.tile; rr(ctx,X+1,Y-26,28,26,4); ctx.fill(); ctx.strokeStyle=c.open?pal.acc:`rgba(${pal.fog},.55)`; ctx.lineWidth=1.5; rr(ctx,X+1,Y-26,28,26,4); ctx.stroke();
    if(c.open){ const gl=ctx.createRadialGradient(X+15,Y-30,1,X+15,Y-30,40); gl.addColorStop(0,`rgba(${pal.fog},.5)`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(X-30,Y-70,90,70); }
    ctx.fillStyle=c.open?pal.acc:(can?pal.acc:`rgba(${pal.fog},.6)`); ctx.font="700 12px 'JetBrains Mono', monospace"; ctx.textAlign="center"; ctx.fillText(c.open?"✦":pw.short,X+15,Y-9);
    if(!c.open){ ctx.font="600 9px 'JetBrains Mono', monospace"; ctx.fillStyle=`rgba(${pal.fog},.75)`; ctx.fillText("SEALED",X+15,Y-32); } }
  if(G.coach){ const X=G.coach.x, Y=G.coach.y; ctx.font="700 12px 'JetBrains Mono', monospace"; const t=matchMedia("(hover:none),(pointer:coarse)").matches?"tap JUMP":"Space · jump"; const w=ctx.measureText(t).width+16; ctx.fillStyle="rgba(6,8,12,.85)"; rr(ctx,X-w/2,Y-22,w,22,6); ctx.fill(); ctx.fillStyle=pal.acc; ctx.textAlign="center"; ctx.fillText(t,X,Y-7); }
  // dash trail
  for(const t of G.trail){ ctx.globalAlpha=t.life*1.6; ctx.fillStyle=(S.cos&&S.cos.trail!=="mist"&&cosItem("trail",S.cos.trail))?cosItem("trail",S.cos.trail).c:`rgba(${pal.fog},.5)`; ctx.beginPath(); ctx.ellipse(t.x+10,t.y+18,9,14,0,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
  drawPlayer(ctx,p,pal);
  // prompt
  if(G.prompt){ ctx.font="700 11px 'JetBrains Mono', monospace"; const w=ctx.measureText(G.prompt.t).width+14; ctx.fillStyle="rgba(6,8,12,.85)"; rr(ctx,G.prompt.x-w/2,G.prompt.y-14,w,20,5); ctx.fill(); ctx.fillStyle=pal.acc; ctx.fillText(G.prompt.t,G.prompt.x,G.prompt.y); }

  ctx.restore();
  // lantern vignette
  const px=p.x-cam+p.w/2, py=p.y+p.h/2;
  const vg=ctx.createRadialGradient(px,py,90,px,py,600); vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.5)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  // fog floor
  const fg=ctx.createLinearGradient(0,VH-120,0,VH); fg.addColorStop(0,`rgba(${pal.fog},0)`); fg.addColorStop(1,`rgba(${pal.fog},.08)`); ctx.fillStyle=fg; ctx.fillRect(0,VH-120,VW,120);
}
function drawPlayer(ctx,p,pal){
  const cx=p.x+p.w/2, by=p.y+p.h, T0=G?G.t:0, C=S.cos||{}; const cl=(cosItem("cloak",C.cloak)||{}).c||"#171b24", mk=cosItem("mask",C.mask)||{}, fl=(cosItem("flame",C.flame)||{}).c||pal.acc;
  // lantern light
  const gl=ctx.createRadialGradient(cx+p.face*10,by-14,1,cx+p.face*10,by-14,46); gl.addColorStop(0,`rgba(${pal.fog},.35)`); gl.addColorStop(1,`rgba(${pal.fog},0)`); ctx.fillStyle=gl; ctx.fillRect(cx-60,by-70,120,100);

  if(p.inv>0&&Math.floor(T0*18)%2) ctx.globalAlpha=.4;
  const run=p.on&&Math.abs(p.vx)>20, ph=T0*16;
  const flap=p.gliding?14:(p.on?Math.sin(ph)*1.5:4);
  // cloak
  ctx.fillStyle=cl;
  ctx.beginPath(); ctx.moveTo(-6,-24); ctx.lineTo(6,-24); ctx.lineTo(10+(p.gliding?8:0),-3); ctx.lineTo(-12-flap,-1+(p.gliding?-6:0)); ctx.closePath(); ctx.fill();
  // feet
  ctx.fillStyle="#0c0e13"; const l=run?Math.sin(ph)*3:0; ctx.fillRect(-5+l,-4,4,4); ctx.fillRect(2-l,-4,4,4);
  // hood with a single swept tip
  ctx.fillStyle=cl; ctx.beginPath(); ctx.moveTo(-9,-27); ctx.quadraticCurveTo(-4,-44,6,-38); ctx.quadraticCurveTo(-6,-42,-15,-35); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-29,10,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  // paper mask
  ctx.fillStyle=mk.c||"#EEF0F2"; ctx.beginPath(); ctx.ellipse(1,-28,7,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=mk.eye||"#0b0d12"; ctx.fillRect(-1.5,-31,2,5); ctx.fillRect(3,-31,2,5);
  ctx.fillStyle="#c9cdd4"; ctx.fillRect(-3,-22,8,1.2);
  // lantern
  ctx.strokeStyle="#5b5e66"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(7,-16); ctx.lineTo(10,-12); ctx.stroke();
  ctx.fillStyle=fl; ctx.shadowColor=fl; ctx.shadowBlur=12; rr(ctx,8,-12,5,7,1.5); ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();

}
